<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>창백한 청수리</title>
<style>
:root{
  --bg:#141312; --panel:#1d1b19; --ink:#e4dccd; --dim:#8f877a; --line:#3a352f;
  --int:#5fb0d0; --psy:#a68be0; --fys:#d0625a; --mot:#d8b54c;
  --pale:#dfe3e3; --red:#b8322a; --ok:#7fbf6a; --npc:#e8c890;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Nanum Myeongjo","Batang","Noto Serif KR",serif;font-size:17px;line-height:1.7}
button{font:inherit;color:inherit;cursor:pointer}
#app{display:grid;grid-template-columns:300px 1fr;height:100vh;max-width:1200px;margin:0 auto}
#side{border-right:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:16px;background:linear-gradient(180deg,#1b1a18,#121110)}
#scene{font-size:24px;letter-spacing:.05em}
#clock{color:var(--dim);font-size:14px}
.bar{display:flex;align-items:center;gap:8px;font-size:14px}
.bar .pips{display:flex;gap:3px}
.pip{width:14px;height:14px;border:1px solid var(--line)}
.pip.on.hp{background:var(--fys)} .pip.on.mo{background:var(--psy)}
.side-btns{display:flex;flex-direction:column;gap:6px;margin-top:auto}
.side-btns button{background:transparent;border:1px solid var(--line);padding:6px 10px;text-align:left}
.side-btns button:hover{border-color:var(--ink)}
#paleMeter{font-size:13px;color:var(--dim)}
#paleMeter b{color:var(--pale)}
#main{display:flex;flex-direction:column;height:100vh;min-width:0}
#log{flex:1;overflow-y:auto;padding:28px 36px 12px}
#log p{margin:0 0 14px}
.narr{color:var(--ink)}
.voice b{letter-spacing:.03em}
.npc b{color:var(--npc)}
.you{color:var(--dim);font-style:italic}
.roll{font-size:14px;color:var(--dim);border-left:2px solid var(--line);padding-left:10px}
.roll.ok b{color:var(--ok)} .roll.no b{color:var(--red)}
.sys{color:var(--pale);font-size:14px;text-align:center;opacity:.8}
.fx{font-size:14px;color:var(--dim)}
#opts{border-top:1px solid var(--line);padding:14px 36px 22px;display:flex;flex-direction:column;gap:6px;max-height:45vh;overflow-y:auto}
#opts button{background:transparent;border:none;text-align:left;padding:4px 0;color:#d9c08a}
#opts button:hover:not(:disabled){color:#fff}
#opts button:disabled{color:var(--dim);cursor:not-allowed}
#opts .n{color:var(--dim);margin-right:8px}
.tag{font-size:14px;padding:0 6px;border:1px solid currentColor;margin-right:6px}
.tag.red{background:rgba(184,50,42,.2)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal.show{display:flex}
.card{background:var(--panel);border:1px solid var(--line);max-width:760px;width:100%;max-height:90vh;overflow-y:auto;padding:24px}
.card h2{margin:0 0 4px;font-weight:normal}
.card h3{margin:18px 0 6px;font-weight:normal;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 20px}
.sk{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:15px;border-bottom:1px solid var(--line);padding:3px 0}
.sk small{display:block;color:var(--dim);font-size:12px;line-height:1.4}
.sk button{border:1px solid var(--line);background:transparent;padding:0 8px}
.arch{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.arch button{background:transparent;border:1px solid var(--line);padding:12px;text-align:left}
.arch button:hover{border-color:var(--ink)}
.arch small{color:var(--dim);display:block;font-size:13px;line-height:1.5}
.thought{border:1px solid var(--line);padding:10px;margin:6px 0;font-size:15px}
.thought small{color:var(--dim)}
.close{float:right;background:transparent;border:1px solid var(--line);padding:2px 10px}
@media (max-width:760px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto;min-height:100vh}
  #side{border-right:none;border-bottom:1px solid var(--line);padding:12px 16px;flex-direction:row;flex-wrap:wrap;gap:8px 16px;align-items:center}
  #scene{font-size:19px}
  .side-btns{flex-direction:row;flex-wrap:wrap;margin-top:0;width:100%}
  #main{height:auto;min-height:80vh}
  #log{padding:16px}
  #opts{padding:12px 16px 18px;max-height:none}
  .grid,.arch{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div>
      <div id="scene">—</div>
      <div id="clock"></div>
    </div>
    <div class="bar"><span>체력</span><span class="pips" id="hp"></span></div>
    <div class="bar"><span>사기</span><span class="pips" id="mo"></span></div>
    <div id="paleMeter"></div>
    <div class="side-btns">
      <button data-act="sheet">인물 · 기술 <span id="spBadge"></span></button>
      <button data-act="thoughts">사상함 <span id="thBadge"></span></button>
      <button data-act="save">저장</button>
      <button data-act="load">불러오기</button>
      <button data-act="start">새 게임</button>
    </div>
  </aside>
  <main id="main">
    <div id="log"></div>
    <div id="opts"></div>
  </main>
</div>
<noscript><p style="padding:20px">이 게임은 자바스크립트가 필요합니다. 파일을 브라우저(Chrome, Safari 등)로 직접 열어주세요.</p></noscript>
<div class="modal" id="modal"><div class="card" id="card"></div></div>

<!-- ============================================================
     세계 데이터: 속성 · 기술 · 출신 · 사상
     ============================================================ -->
<script>
const ATTRS = {

  psy:{name:'정신', color:'var(--psy)'},

  mot:{name:'동작', color:'var(--mot)'},
};
const SKILLS = {
  logic:   {name:'주체논리',   attr:'int', desc:'모든 것은 설명될 수 있다. 수령의 교시로.'},
  rhet:    {name:'웅변',       attr:'int', desc:'구호로 사람을 움직이고, 구호로 사람을 멈춘다.'},
  history: {name:'당력사',     attr:'int', desc:'모든 날짜, 모든 교시, 모든 숙청을 기억한다.'},
  volition:{name:'자아비판',   attr:'psy', desc:'너를 붙잡아 두는 목소리. 생활총화의 기술.'},
  baekdu:  {name:'내면의 백두', attr:'psy', desc:'혁명전설이 속삭인다. 소나무가, 눈보라가, 초상화가.'},
  empathy: {name:'인민감정',   attr:'psy', desc:'굶주린 얼굴 뒤의 마음을 읽는다.'},

  {id:'ideo', name:'사상 일꾼', attrs:{int:4,psy:3,fys:1,mot:2}, desc:'정치대학 출신. 논리와 구호로 무장했다. 몸은 약하다.'},
  {id:'feel', name:'감성 보위원', attrs:{int:2,psy:4,fys:2,mot:2}, desc:'사람의 마음과 혁명전설의 목소리를 듣는다. 너무 잘 듣는다.'},
  {id:'body', name:'제대 군관', attrs:{int:1,psy:2,fys:4,mot:3}, desc:'인민군 10년. 고난의 행군을 몸으로 넘었다.'},
  {id:'eye',  name:'현장 수사관', attrs:{int:2,psy:2,fys:2,mot:4}, desc:'장마당과 국경을 30년 지켜봤다. 아무것도 놓치지 않는다.'},

// 사상함: 내면화하면 기술 보너스와 플래그를 준다.
const THOUGHTS = {
  reaction:{name:'창백은 반동인가', time:5,
    q:'수령님의 초상화마저 바래게 하는 것. 그것은 적인가, 아니면 그냥… 날씨인가?',
    a:'창백은 계급이 없다. 그것은 미제도 아니고 우리도 아니다. 너는 그것을 적으로 부르기를 그만둔다.',
    bonus:{logic:1, rhet:-1}, flag:'th_reaction'},
  ration:{name:'배급표의 형이상학', time:6,
    q:'1997년, 배급표에는 쌀이 적혀 있었지만 쌀은 없었다. 종이가 거짓이면, 무엇이 남는가?',
    a:'이름만 남고 실체가 빠진 것들. 창백은 그런 것들부터 먹는다. 너는 이제 그것을 본다.',
    bonus:{empathy:1, march:1, composure:-1}, flag:'th_ration'},
  dream:{name:'나는 누구의 꿈인가', time:7,
    q:'신분증의 이름이 지워졌다. 그럼 너는 누구지? 혹시 처음부터 아무도 아니었던 건?',
    a:'너는 국가가 꾸는 꿈이다. 국가가 잠에서 깬다면 너도 사라진다. 아니면… 네가 먼저 깨어날 수도 있다.',
    bonus:{baekdu:2, volition:-1}, flag:'th_dream'},
  names:{name:'이름의 무게', time:5,
    q:'노인은 마흔둘의 이름을 매일 부른다. 구호는 수백만 번 외쳐도 하얘지는데, 왜 이름은 남는가?',
    a:'한 사람을 가리키는 말은 복제되지 않는다. 너는 이제 이름을 무기처럼, 아니 닻처럼 쥔다.',

    a:'지도는 땅이 아니다. 하지만 이 나라에서는 지도가 먼저 그려지고 땅이 따라왔다. 너는 이제 둘 사이의 틈을 본다.',

    a:'무게는 사라지지 않는다. 대신 너는 그것을 들고 걷는 법을 배운다. 한 문장씩.',

  grammar_names:{name:'명부의 문법', time:6,
    q:'보고서에는 주어와 결론이 있다. 명부에는 이름만 있다. 이름만으로 된 문장은 무엇을 말하는가?',
    a:'명부는 아무것도 주장하지 않는다. 그저 이 사람들이 있었다고 말할 뿐이다. 그것이 가장 위험한 문장이다.',
    bonus:{empathy:1, history:1, rhet:-1}, flag:'th_grammar_names'},

  '@empathy: 대답하지 않는 것도 대답이야.',
], options:[{t:'침묵한다.', go:'park', fx:{flag:'complicit'}}]},

river:{scene:'압록강 둑', on:{flag:'seen_pale', pale:1}, text:G=>[
  G.visited.river>1 ? '강둑. 창백이 어제보다 가까운 것 같다.' :
  '둑 위에 선다. 철조망. 감시초소. 그리고 강.',
  G.visited.river>1 ? '' : '강물은 흐른다. 너는 그것을 본다. 그런데 소리가 없다. 그리고 강의 한가운데부터 — 중국이 있어야 할 곳에 — 아무것도 없다. 하얀 것. 안개처럼 움직이지 않고, 벽처럼 단단하지 않은, 의미가 다 빠져나간 공간.',
  G.visited.river>1 ? '' : '@baekdu: 창백이야. 세상의 가장자리. 기억과 이름이 녹아 흐르는 곳. 그게 왜 하필 여기 나타났을까? 가장 많은 것을 지운 나라에.',
  G.flags.soldier_freed ? '초소는 비어 있다. 명수는 집에 갔다.' : '초소 앞에 어린 하전사 한 명이 총을 메고 강을 향해 서 있다. 그의 군복 끝자락이 반쯤 투명하다.',
], passives:[
  {s:'eye', dc:8, t:'강물 소리가 들리지 않는다. 물은 흐르는데. 소리가 먼저 먹혔다.'},
  {s:'logic', dc:10, t:'이것은 기상현상이 아니다. 기상현상에는 날씨가 있어야 한다. 이건 날씨가 없다. 기압이 없다는 보고는 정확했다.'},
  {s:'march', dc:12, t:'이 냄새. 아니, 냄새가 없음. 1997년 겨울, 배고픔이 극에 달하면 세상이 이렇게 하얘졌었다.'},
], options:[
  {t:'하전사에게 말을 건다.', go:'soldier', not:['soldier_freed']},
  {t:'창백에 손을 넣어본다.', check:{s:'march', dc:10, red:true}, ok:'pale_hand_ok', no:'pale_hand_no'},
  {t:'창백을 정면으로 응시한다.', check:{s:'baekdu', dc:12}, ok:'pale_gaze_ok', no:'pale_gaze_no', req:['th_dream']},
  {t:'마을로 돌아간다.', go:'square'},
]},
soldier:{scene:'압록강 초소', text:G=>[
  '#하전사: 초…초소 근무 중입니다! 정명수 하전사! 교대가 안 옵니다. 며칠째인지 모르겠습니다.',
  '그의 눈은 창백에서 떨어지지 않는다. 입술이 갈라져 있다. 그는 먹지도 자지도 않은 것 같다. 아니면 그럴 필요가 없어졌거나.',
  G.flags.pale_touch ? '@march: 그의 손가락 끝도 너처럼 하얗다. 하지만 그의 것은 손목까지 올라왔다.' : '',
], options:[
  {t:'"강 건너에 뭐가 보이나?"', go:'soldier_see'},
  {t:'"보위원으로서 명령한다. 근무를 해제하고 집에 가라."', check:{s:'rhet', dc:10}, ok:'soldier_free', no:'soldier_refuse'},
  {t:'"어머니가 기다리신다, 명수."', go:'soldier_mother', req:['know_son']},
  {t:'물러난다.', go:'river'},
]},
soldier_see:{scene:'압록강 초소', text:[
  '#정명수: 중국이 안 보입니다. 처음엔… 처음엔 다행이라고 생각했습니다. 이제 넘어가는 놈들도 없을 테니까. 근무가 편해지겠다고.',
  '#정명수: 그런데 어제부터는 우리 쪽도 안 보이기 시작했습니다. 뒤를 돌아보면 마을이 흐려요. 그래서 안 돌아봅니다. 앞만 봅니다. 앞을 지키면 뒤는 있을 거 같아서.',
  '@empathy: 이 아이는 국경이 되어가고 있다. 아무도 넘지 못하게, 자기 자신도.',
], options:[{t:'…', go:'soldier'}]},
soldier_free:{scene:'압록강 초소', on:{ws:1, flag:'soldier_freed', sp:1}, text:[
  '네 목소리가 공화국의 목소리로 나온다. 쇠처럼, 확성기처럼.',
  '#정명수: …알겠습니다! 근무 해제!',
  '그는 경례하고, 비틀거리며, 마을 쪽으로 돌아선다. 몇 걸음 후 그는 무릎을 꿇고 토한다. 그리고 다시 일어나 걷는다. 군복 끝자락에 색이 조금 돌아온 것 같다.',
], options:[{t:'그를 보낸다.', go:'river'}]},
soldier_refuse:{scene:'압록강 초소', on:{morale:-1}, text:[
  '#정명수: 명령서… 명령서 없이는 초소를 떠날 수 없습니다. 죄송합니다. 동지 이름이 뭡니까? 이름을 대주시면…',
  '너는 입을 연다. 아무것도 나오지 않는다.',
], options:[{t:'물러난다.', go:'soldier'}]},
soldier_mother:{scene:'압록강 초소', on:{ws:1, flag:'soldier_freed', morale:2}, text:[
  '그의 어깨가 흔들린다. 총이 내려간다.',
  '#정명수: 어머니가… 우리 어머니가 아직 거기 있습니까? 마을이 아직 있습니까?',
  '"있다. 빗자루를 들고 있다."',
  '그는 운다. 열아홉 살처럼, 아니 아홉 살처럼 운다. 그리고 처음으로 뒤를 돌아본다. 마을이 거기 있다. 그는 달려간다.',
  '@empathy: 이름을 불러주는 것. 창백에 맞서는 방법이 그것일지도 모른다.',
], options:[{t:'강가에 혼자 남는다.', go:'river'}]},
pale_hand_ok:{scene:'창백의 가장자리', on:{thought:'ration', sp:1, pale:1}, text:[
  '손을 넣는다. 아무 감각이 없다. 그리고 — 1997년.',
  '너는 열여섯 살이다. 함흥역 대합실. 꽃제비 아이들. 한 아이가 네 배급표를 훔쳐가고, 너는 쫓아가지 않는다. 배급표로 받을 쌀이 없다는 걸 둘 다 알기 때문이다.',
  '@march: 기억해 냈다. 그해 너는 아무것도 먹지 못했고, 그래도 살았다. 고통은 사라지지 않는다. 그것이 고통의 좋은 점이다.',
  '너는 손을 뺀다. 손은 그대로다. 하지만 머릿속에 하나의 생각이 남았다.',
], options:[{t:'물러난다.', go:'river'}]},
pale_hand_no:{scene:'창백의 가장자리', on:{hp:-2, pale:1}, text:[
  '손을 넣는다. 그리고 너는 잊는다. 네 어머니의 얼굴. 네 첫 근무지. 네가 좋아하던 노래. 하나씩, 연필 자국처럼.',
  '너는 비명을 지르며 손을 빼낸다. 몇 개는 돌아오고, 몇 개는 돌아오지 않는다. 어떤 게 돌아오지 않았는지는 모른다. 그게 창백이다.',
], options:[{t:'비틀거리며 물러난다.', go:'river'}]},
pale_gaze_ok:{scene:'창백의 가장자리', on:{flag:'saw_other', pale:1}, text:[
  '너는 본다. 하얀 것의 안쪽을. 거기에도 누군가 서 있다. 강의 저쪽 편 둑에. 중국 군복을 입은 젊은 병사가, 똑같이 반쯤 투명해진 채, 너를 — 아니, 창백을 — 응시하고 있다.',
  '@baekdu: 저쪽에서도 이게 우리의 무기라고 생각해. 그리고 저쪽에서도, 아무도 보고하지 않아.',
], options:[{t:'시선을 거둔다.', go:'river'}]},
pale_gaze_no:{scene:'창백의 가장자리', on:{morale:-2}, text:[
  '너는 응시한다. 창백도 너를 응시한다. 그리고 너는 깨닫는다. 너를 들여다보는 쪽에 비해, 너는 너무 작다.',
], options:[{t:'눈을 감는다.', go:'river'}]},

station:{scene:'기상관측소', on:{flag:'visited_station'}, text:G=>[
  G.visited.station>1 ? '관측소. 담배 연기와 라디오 잡음.' :
  '언덕 위의 콘크리트 건물. 백엽상, 풍향계, 녹슨 안테나. 안에는 담배 연기가 구름처럼 차 있고, 그 속에 쉰 살쯤의 여자가 앉아 있다. 관측원 오영희.',
  G.visited.station>1 ? '' : '#오영희: 일어나셨구만. 해장은 했어요? 아니지, 해장할 게 없지. 이 마을엔.',
  '구석의 낡은 라디오에서 무언가 흘러나온다. 지금 방송이 아니다. 아나운서의 억양이 30년 전 것이다.',
], passives:[
  {s:'hands', dc:8, t:'라디오는 전원 코드가 뽑혀 있다. 그래도 소리가 난다.'},
  {s:'jangmadang', dc:10, t:'그녀가 피우는 건 "7.27"이 아니다. 중국산 "홍타산". 밀수품이다. 어디서 났을까?'},
], options:[
  {t:'관측 기록부를 본다.', check:{s:'logic', dc:12}, ok:'log_ok', no:'log_no'},
  {t:'라디오에 귀를 기울인다.', check:{s:'baekdu', dc:10}, ok:'radio_ok', no:'radio_no'},
  {t:'"어젯밤 내가 무슨 말을 했소?"', go:'oh_lastnight'},
  {t:'"담배 한 대 주시오."', check:{s:'jangmadang', dc:8}, ok:'oh_smoke', no:'oh_smoke_no'},
  {t:'마을로 내려간다.', go:'square'},
]},
log_ok:{scene:'기상관측소', on:{flag:'log_truth', sp:1}, text:[
  '숫자들. 기온, 기압, 풍속, 습도. 사흘 전부터 기압 칸에 "—". 그리고 그 다음 날부터 기온 칸도 "—". 그리고 마지막 줄, 오영희의 글씨:',
  '「관측 불가. 관측 대상 불가. 관측자 불가.」',
  '그 아래, 날짜가 적혀 있다. 모레의 날짜다.',
  '@logic: 그녀는 미래의 기록을 미리 적었다. 아니면 창백 안에서는 순서가 의미가 없다. 어느 쪽이든, 이 기록은 미제의 무기를 증명하지 않는다. 이것은 무기가 아니다. 이것은 끝이다. 아니면 시작.',
], options:[{t:'기록부를 덮는다.', go:'station'}]},
log_no:{scene:'기상관측소', text:[
  '숫자들이 헤엄친다. 머리가 아프다. 어쩌면 농태기 때문이고, 어쩌면 숫자들이 정말로 움직이고 있기 때문이다.',
], options:[{t:'포기한다.', go:'station'}]},
radio_ok:{scene:'기상관측소', on:{thought:'dream', pale:1}, text:[
  '잡음 사이로 목소리가 선명해진다. 아나운서가 너에게 직접 말한다.',
  '#라디오: …보위원 동무. 동무는 1996년 겨울 함경북도에서 이미 한 번 죽었습니다. 동무의 이름은 그때 지워졌습니다. 지금 걷고 있는 것은 국가가 동무를 계속 필요로 했기 때문입니다. 날씨를 알려드리겠습니다. 내일은 하얗겠습니다. 모레도 하얗겠습니다…',
  '@baekdu: 들었지? 이제 알겠어? 너는 이미 창백의 일부였어. 그래서 여기 보내진 거야.',
  '@volition: 라디오는 거짓말을 한다. 라디오는 늘 거짓말을 했다. 그것만은 확실하다.',
], options:[{t:'라디오에서 물러난다.', go:'station'}]},
radio_no:{scene:'기상관측소', on:{morale:-1}, text:[
  '잡음뿐이다. 그런데 그 잡음 속에서 네 이름이 들린 것 같다. 하지만 무슨 이름이었는지 듣지 못했다.',
], options:[{t:'물러난다.', go:'station'}]},
oh_lastnight:{scene:'기상관측소', on:{flag:'draft'}, text:[
  '#오영희: 많은 말을 했지. 평양에서 바라는 대로 "미제의 기상무기"라고 써주면 동지는 승진하고 나는 표창 받는다고. 그런데 그렇게 쓰고 나서 울었어요. 이 종이가 거짓말이면 창백이 더 빨리 온다고.',
  '그녀가 서랍에서 구겨진 종이를 꺼낸다. 네 글씨다. 술 취한 글씨.',
  '「보고서 초안. 창백은 무기가 아니다. 창백은 우리가 지운 모든 것이 돌아오는 것이다. 우리는 너무 많이 지웠다.」',
  '그 아래에 줄이 그어져 있고, 다시 쓰여 있다: 「미제의 기상침략 무기로 판단됨.」 그리고 그 위에 또 줄이.',
  '#오영희: 어느 쪽을 보낼지는 동지가 정해요. 나는 숫자만 적어요. 숫자가 남아 있는 동안은.',
], options:[{t:'초안을 챙긴다.', go:'station'}]},
oh_smoke:{scene:'기상관측소', on:{flag:'know_cat', hp:1}, text:[
  '그녀가 피식 웃으며 홍타산 한 개비를 내민다. 연기가 폐 깊숙이 들어온다. 아, 이 맛. 공화국에서 가장 정직한 것은 밀수 담배다.',
  '@jangmadang: 좋아. 아주 좋아. 이제 좀 사람 같네.',
  '#오영희: 이거 어디서 났는지 묻지 마요. …아니, 물어요. 어차피 다 끝나가는데. 장마당 뒷골목에 "고양이"라는 애가 있어. 중국 손전화를 가지고 있지. 그 애 말로는 강 건너에서도 문자가 온대. 강 건너에서도 하얗대.',
], options:[{t:'연기를 내뿜는다.', go:'station'}]},
oh_smoke_no:{scene:'기상관측소', text:[
  '#오영희: 보위원 동지가 담배를 구걸해요? 이 마을도 진짜 끝났나 보다.',
  '그녀는 담배갑을 서랍에 넣고 잠근다.',
], options:[{t:'헛기침한다.', go:'station'}]},

market:{scene:'장마당 뒷골목', text:G=>[
  '장마당은 닫혀 있다. 단속 때문인지, 창백 때문인지. 뒷골목에는 비닐 천막과 빈 매대만 남았다.',
  G.flags.met_cat ? '고양이가 매대 뒤에 쪼그려 앉아 있다.' : '아무도 없다. 적어도 그렇게 보인다.',
], options:[
  {t:'숨어 있는 사람을 찾는다.', check:{s:'eye', dc:10}, ok:'cat', no:'market_none', not:['met_cat']},
  {t:'"오영희 동무가 보냈소. 고양이 있나?"', go:'cat', req:['know_cat'], not:['met_cat']},
  {t:'고양이에게 말을 건다.', go:'cat', req:['met_cat']},
  {t:'광장으로 돌아간다.', go:'square'},
]},
market_none:{scene:'장마당 뒷골목', text:[
  '천막 사이로 바람이 분다. 어딘가에서 누군가 숨을 참는 소리가 나는 것 같기도 하다. 확실하지 않다.',
], options:[{t:'돌아선다.', go:'market'}]},
cat:{scene:'장마당 뒷골목', on:{flag:'met_cat'}, text:G=>[
  G.visited.cat>1 ? '#고양이: 또 왔네, 보위원.' :
  '매대 아래에서 스무 살쯤 된 여자가 기어 나온다. 짧은 머리, 중국산 패딩, 눈빛이 고양이다.',
  G.visited.cat>1 ? '' : '#고양이: 보위원? 날 잡으러? 잡을 국경이 아직 남아 있나 보지.',
  G.visited.cat>1 ? '' : '그녀가 손전화를 흔든다. 화면에 중국어와 조선어가 섞인 문자. 단둥에 사는 그녀의 이모에게서 온 것이다:',
  G.visited.cat>1 ? '' : '「여기도 하얘. 강 건너가 안 보여. 너희 쪽에서 무슨 폭탄 쏜 거야? 사람들이 다 그렇게 말해. 근데 아무도 신고 안 해.」',
], options:[
  {t:'"양쪽 다 상대가 했다고 생각한다면…"', check:{s:'logic', dc:10}, ok:'cat_both', no:'cat_confused', not:['both_sides']},
  {t:'손전화를 압수한다.', go:'cat_seize', not:['phone']},
  {t:'"농태기 있나? 거래하지."', check:{s:'jangmadang', dc:12, red:true}, ok:'cat_deal', no:'cat_deal_no'},
  {t:'"창백에 대해 아는 걸 말해."', check:{s:'empathy', dc:10}, ok:'cat_talk', no:'cat_shrug'},
  {t:'떠난다.', go:'square'},
]},
cat_both:{scene:'장마당 뒷골목', on:{flag:'both_sides', sp:1}, text:[
  '"…그럼 누구의 무기도 아니다."',
  '고양이가 너를 처음으로 제대로 본다.',
  '#고양이: 보위원 입에서 그런 말이 나오네. 맞아. 저쪽은 우리가 했다 하고, 우리는 미제가 했다 하고. 근데 창백은 국적이 없어. 밀수꾼처럼.',
  '@logic: 지령서의 결론은 틀렸다. 증거가 있다. 다만 그 증거를 쓰는 사람이 살아남을지는 별개의 문제다.',
], options:[{t:'고개를 끄덕인다.', go:'cat'}]},
cat_confused:{scene:'장마당 뒷골목', text:[
  '"…그건 즉 미제가 양쪽 다를 공격했다는…" 말하면서도 무언가 이상하다. 생각이 매듭지어지지 않는다.',
  '#고양이: 보위원 머리는 그렇게밖에 안 돌아가나 봐.',
], options:[{t:'물러난다.', go:'cat'}]},
cat_seize:{scene:'장마당 뒷골목', on:{flag:'phone', item:'phone', morale:-1}, text:[
  '너는 손을 내민다. 그녀는 잠깐 망설이다가 손전화를 건넨다. 그 망설임 안에 네가 이 마을에서 본 모든 체념이 들어 있다.',
  '#고양이: 가져가. 어차피 내일이면 화면도 하얄 거야.',
  '화면 속 마지막 문자: 「살아 있어?」 답장은 없다.',
], options:[{t:'주머니에 넣는다.', go:'cat'}]},
cat_deal:{scene:'장마당 뒷골목', on:{flag:'lies_feed', hp:1, morale:1}, text:[
  '그녀가 웃는다. 매대 밑에서 페트병 하나가 나온다. 투명한 농태기. 너는 한 모금 마신다. 목이 타고, 세상이 잠깐 선명해진다.',
  '@jangmadang: 그래! 이거야! 색이 돌아온다!',
  '#고양이: 하나 알려줄게, 공짜로. 이 마을에서 제일 먼저 하얘진 게 뭔지 알아? 구호판. 그다음은 초상화. 그다음은 배급 장부. 사람은 그다음이야.',
  '#고양이: 창백은 거짓말부터 먹어. 제일 많이 반복된 거짓말부터. 그러니까 보위원, 보고서 쓸 때 조심해.',
], options:[{t:'병을 돌려준다.', go:'cat'}]},
cat_deal_no:{scene:'장마당 뒷골목', on:{hp:-1}, text:[
  '너는 거래를 시도하지만, 네 손이 너무 떨린다. 그녀는 병을 내밀고, 너는 그것을 떨어뜨린다. 바닥에 고인 농태기를 둘 다 바라본다.',
  '#고양이: …보위원 동지, 술 끊으시라요.',
], options:[{t:'창피함을 삼킨다.', go:'cat'}]},
cat_talk:{scene:'장마당 뒷골목', text:[
  '#고양이: 우리 할머니가 그랬어. 고난의 행군 때 사람이 죽으면 이름을 장부에서 지웠대. 배급 하나라도 더 타려면 안 지우는 게 나은데, 위에서 지우라고 했대. 숫자가 맞아야 하니까.',
  '#고양이: 그때 지운 이름이 얼마나 많은데. 그게 다 어디 갔겠어? 나는 그게 돌아오는 거라고 생각해. 이름 없는 채로.',
], options:[{t:'침묵한다.', go:'cat'}]},
cat_shrug:{scene:'장마당 뒷골목', text:[
  '#고양이: 보위원한테 내가 아는 걸 말하는 게 이 나라에서 제일 멍청한 짓이야. 하얘지기 전에도, 하얘진 다음에도.',
], options:[{t:'물러난다.', go:'cat'}]},

// ================= 1일째 밤 =================
night1:{scene:'청수리 초대소 · 밤', on:{hp:1, morale:1}, text:G=>[
  '초대소로 돌아온다. 난로에 석탄 몇 덩이를 넣는다. 하얀 초상화 아래, 얇은 이불 속.',
  '처음으로 확성기가 조용하다. 그 침묵이 확성기 소리보다 시끄럽다.',
  G.flags.has_orders ? '' : '베개 밑에서 딱딱한 것이 만져진다. 붉은 수첩. 신분증과 지령서다. 이름 칸은 하얗다. 「3일 내 보고할 것.」',
  '@baekdu: 첫날이 끝났어. 하루가 지날 때마다 강이 한 뼘씩 가까워질 거야. 아니면 네가 한 뼘씩 강에 가까워지거나.',
  '@volition: 자라. 내일도 보위원이어야 한다.',
], options:[
  {t:'잠든다.', go:'day2_start', fx:{flag:'has_orders', day:2}},
]},

// ================= 2일째 =================
day2_start:{scene:'청수리 초대소', text:G=>[
  '— 2일째 —',
  '문을 두드리는 소리. 주먹이 아니라 손바닥으로, 다급하게.',
  G.flags.soldier_freed
    ? '#박순녀: 보위원 동지! 우리 명수가… 집에 오긴 왔는데, 저를 "아주머니"라고 불러요. 제 이름을 몰라요. 어머니라는 말도 몰라요.'
    : '#박순녀: 보위원 동지! 명수가 없어졌어요! 초소에 총만 세워져 있고… 발자국이 강 쪽으로, 그 하얀 데로…',
  '#박순녀: 그리고 평양에서 사람이 왔어요. 혜산에서 트럭을 타고. 중좌라는데, 동지를 찾아요.',
  '창밖으로 북쪽을 본다. 창백이 철조망을 넘었다. 둑이 반쯤 사라졌다.',
], options:[
  {t:'광장으로 나간다.', go:'square2', fx:G=>G.flags.soldier_freed ? null : {flag:'myeongsu_lost'}},
]},
square2:{scene:'청수리 광장 · 2일째', text:G=>[
  G.visited.square2>1 ? '광장. 사람들이 붉은 천과 구호판을 나르고 있다.' :
  '구호판이 완전히 하얗다. 글자의 흔적조차 없다. 사람들이 그 위에 새 종이를 붙이고 붓으로 구호를 다시 쓰고 있다. 쓰는 족족 바래간다.',
  G.visited.square2>1 ? '' : '#확성기: …지금부터 우리 인민은… 1994년… 7월… 슬픔을 힘으로… (잡음) …오늘 정오, 미제의 기상침략을 규탄하는 군중궐기대회를…',
  G.visited.square2>1 ? '' : '광장 한쪽에 군용 트럭 한 대. 그 옆에 긴 외투를 입은 남자가 서서 담배를 피운다. 평양의 냄새가 난다. 가죽과 권력의 냄새.',
  G.flags.rally_done ? '궐기대회의 흔적이 남아 있다. 짓밟힌 붉은 천, 흩어진 구호 종이.' : '',
], passives:[
  {s:'history', dc:10, t:'중좌의 견장은 국가보위성 검열국이다. 검열국이 오면 보고서는 둘 중 하나다. 검열 대상이 쓰는 것, 아니면 검열 대상에 대해 쓰는 것.'},
  {s:'eye', dc:12, t:'중좌는 담배를 피우면서 계속 자기 왼손을 본다. 장갑을 낀 손. 왜 한 손에만 장갑을 꼈을까?'},
], options:[
  {t:'중좌에게 신고한다.', go:'choi', not:['met_choi']},
  {t:'최 중좌에게 간다.', go:'choi', req:['met_choi']},
  {t:'박순녀의 집으로 간다.', go:'park_home2'},
  {t:'뒷산 공동묘지로 올라간다.', go:'graves'},
  {t:'장마당 뒷골목으로 간다.', go:'cat2'},
  {t:'기상관측소로 간다.', go:'station2', req:['know_station']},
  {t:'[정오 — 궐기대회가 시작된다]', go:'rally', req:['met_choi'], not:['rally_done']},
  {t:'[해가 진다. 초대소로 돌아간다.]', go:'night2', req:['rally_done']},
]},

choi:{scene:'광장 · 군용 트럭', on:{flag:'met_choi'}, text:G=>[
  G.visited.choi>1 ? '#최경철: 또 무슨 일이오, 소좌.' :
  '#최경철: 국가보위성 검열국 중좌 최경철이오. 13국 소좌 동무지? 이름은?',
  G.visited.choi>1 ? '' : '너는 입을 연다. 이름이 나오지 않는다. 그는 너를 오래 본다. 그리고 손에 든 서류철을 — 너의 인사 문건을 — 탁 덮는다. 덮기 직전 너는 보았다. 그의 문건에도 네 이름 칸은 하얗다.',
  G.visited.choi>1 ? '' : '#최경철: 됐소. 이름은 중요하지 않소. 중요한 건 보고서지. 정오에 궐기대회가 있소. 동무가 연설하시오. 원고는 내가 준비했소. 그리고 모레 밤, 동무의 보고서를 내가 직접 평양에 가져가겠소.',
], options:[
  {t:'"알겠습니다, 중좌 동지." 표정을 지킨다.', check:{s:'composure', dc:10}, ok:'choi_trust', no:'choi_doubt', not:['choi_trust','choi_hostile']},
  {t:'그가 펼쳐 놓은 서류를 훔쳐본다.', check:{s:'eye', dc:10}, ok:'choi_fading', no:'choi_caught', not:['choi_fading']},
  {t:'"중좌 동지, 창백은 무기가 아닙니다."', go:'choi_warn', cond:G=>G.flags.log_truth||G.flags.both_sides, not:['choi_hostile'], once:true},
  {t:'"그 장갑 아래에 뭐가 있습니까?"', go:'choi_glove', req:['choi_fading'], not:['choi_ally','choi_hostile'], once:true},
  {t:'물러난다.', go:'square2'},
]},
choi_trust:{scene:'광장 · 군용 트럭', on:{flag:'choi_trust'}, text:[
  '너는 등을 펴고 경례한다. 13국에서 20년 동안 연습한 얼굴. 아무것도 담지 않은 얼굴.',
  '#최경철: 좋소. 동무 같은 사람이 필요하오. 이 마을 사람들은 겁에 질렸소. 겁에 질린 인민에게는 구호가 필요하오.',
  '@composure: 그는 너를 믿는다. 아니, 너의 얼굴을 믿는다. 이 나라에서 그 둘은 같은 것이다.',
], options:[{t:'…', go:'choi'}]},
choi_doubt:{scene:'광장 · 군용 트럭', on:{morale:-1}, text:[
  '"알겠습—" 목소리 끝이 떨린다. 그의 눈이 가늘어진다.',
  '#최경철: 동무, 어제 술 마셨지. 강가에서 노래를 불렀다고 들었소. 무슨 노래였소? …됐소. 정오에 보겠소.',
], options:[{t:'…', go:'choi'}]},
choi_fading:{scene:'광장 · 군용 트럭', on:{flag:'choi_fading', sp:1}, text:[
  '그가 담배에 불을 붙이려 고개를 돌린 순간, 너는 본다. 서류철 맨 위에 끼워진 그 자신의 출장 증명서.',
  '성명: 최경— 그리고 하얗다. 마지막 글자가 없다.',
  '@eye: 그도 지워지고 있다. 평양에서 온 사람도. 그는 그걸 알고 있다. 그래서 장갑을 꼈다.',
], options:[{t:'아무 일 없었던 척한다.', go:'choi'}]},
choi_caught:{scene:'광장 · 군용 트럭', on:{morale:-1, flag:'choi_suspicious'}, text:[
  '#최경철: 뭘 보시오, 소좌?',
  '그가 서류철을 외투 안에 넣는다. 그 동작이 너무 빠르다. 그도 숨기는 게 있다. 하지만 이제 그는 네가 뭔가를 찾는다는 걸 안다.',
], options:[{t:'…', go:'choi'}]},
choi_warn:{scene:'광장 · 군용 트럭', on:{flag:'choi_hostile', morale:-1}, text:[
  '그의 손바닥이 네 뺨을 친다. 소리가 광장에 울린다. 구호판을 붙이던 사람들이 고개를 숙인다.',
  '#최경철: 그런 말을 한 사람들 명단이 저 트럭에 있소. 혜산에서 다섯, 삼수에서 둘. 동무가 여덟 번째가 되고 싶소?',
  '#최경철: 창백은 미제의 무기요. 왜냐하면 그래야 하기 때문이오. 알아들었소?',
  '@logic: 그는 논리를 말하지 않는다. 그는 필요를 말한다. 그리고 그 필요가 그의 얼굴에서 땀으로 흐르고 있다.',
], options:[{t:'뺨을 문지른다.', go:'choi'}]},
choi_glove:{scene:'광장 · 군용 트럭', text:[
  '그가 굳는다. 담배가 손가락 사이에서 탄다.',
  '#최경철: …아무것도 없소.',
  '그는 장갑을 벗는다. 정말로 아무것도 없다. 손목부터 손끝까지 하얗다. 손이 있는 자리에 손의 개념만 있다.',
  '#최경철: 혜산을 출발할 때는 손끝만 그랬소. 평양에는 보고하지 않았소. 보고하면 어떻게 되는지 동무도 알지 않소.',
  '@empathy: 이 사람은 무섭다. 너를 무서워하는 게 아니라, 자기가 쓸 보고서를 무서워한다.',
], options:[{t:'"알겠습니다." 그 이상은 말하지 않는다.', go:'choi', fx:{flag:'choi_shaken'}}]},

park_home2:{scene:'박순녀의 집', text:G=>[
  '흙벽 집. 부엌과 방 하나. 벽의 초상화는 하얗다. 그 아래에 박순녀가 앉아 있다.',
  G.flags.soldier_freed && !G.flags.myeongsu_remember ? '방 구석에 명수가 군복 차림으로 앉아 있다. 그는 어머니를 정중하게, 낯선 사람처럼 바라본다.' : '',
  G.flags.myeongsu_remember ? '명수가 어머니 옆에서 강냉이죽을 먹고 있다. 서툴게, 하지만 아들처럼.' : '',
  G.flags.myeongsu_lost && !G.flags.wrote_myeongsu ? '방 구석에 명수의 군화 한 켤레. 주인 없이.' : '',
], options:[
  {t:'명수가 어머니를 기억하도록 돕는다.', check:{s:'empathy', dc:10}, ok:'myeongsu_ok', no:'myeongsu_no', req:['soldier_freed'], not:['myeongsu_remember']},
  {t:'인민반 명단을 펼쳐, 명수의 이름을 다시 적는다.', go:'write_myeongsu', req:['myeongsu_lost'], not:['wrote_myeongsu']},
  {t:'"지워진 세 세대의 이름을 말해 주시오."', go:'park_names', req:['list'], not:['park_named']},
  {t:'"이사 갔다는 집들… 원래 누가 살았소?"', check:{s:'empathy', dc:8}, ok:'park_names', no:'park_silent', not:['list','park_named']},
  {t:'나온다.', go:'square2'},
]},
myeongsu_ok:{scene:'박순녀의 집', on:{flag:'myeongsu_remember', name:'정명수', morale:1, sp:1}, text:[
  '너는 명수 앞에 쪼그려 앉는다. 그리고 묻는다. 어릴 때 누가 밥을 해줬나. 누가 군대 가는 날 울었나. 누가 매일 저 빗자루로 마당을 쓸었나.',
  '#정명수: …빗자루. 마당. 아침마다 쓱, 쓱. …어머니. 순녀. 박순녀.',
  '박순녀가 입을 막는다. 명수의 군복 단추 하나에 색이 돌아온다. 붉은 별.',
  '@empathy: 이름은 혼자서는 버티지 못한다. 누군가 불러줘야 한다.',
], options:[{t:'일어선다.', go:'park_home2'}]},
myeongsu_no:{scene:'박순녀의 집', on:{morale:-1}, text:[
  '너는 질문을 던진다. 명수는 정중하게 고개를 갸웃한다. 마치 시험 문제를 풀지 못한 학생처럼.',
  '#정명수: 죄송합니다, 동지. 모르겠습니다. 이 아주머니는 친절하십니다.',
  '박순녀가 부엌으로 나간다. 울음소리가 난다. 아주 조용하게.',
], options:[{t:'…', go:'park_home2'}]},
write_myeongsu:{scene:'박순녀의 집', on:{flag:'wrote_myeongsu', name:'정명수'}, text:[
  '박순녀가 공책을 내민다. 명수의 이름이 있던 자리는 볼펜 홈만 남았다. 너는 그 홈을 따라 한 글자씩 다시 쓴다. 정. 명. 수.',
  '#박순녀: 그게… 무슨 소용입네까.',
  '"모르겠소. 하지만 장부에 있는 사람은 배급을 받소. 배급을 받는 사람은 살아 있는 거요. 이 나라에서는."',
  '@logic: 터무니없는 논리다. 하지만 이 나라는 원래 장부가 사람보다 먼저였다. 그렇다면 거꾸로도 될지 모른다.',
], options:[{t:'공책을 돌려준다.', go:'park_home2'}]},
park_names:{scene:'박순녀의 집', on:{flag:'park_named', name:['리용남','한복실','문태식']}, text:[
  '#박순녀: 리용남네. 아들 둘, 막내가 다리를 절었지. 한복실 할머니. 혼자 사는데 두부를 잘 만들었어요. 문태식네. 문 동무는 탄광에서 다쳐서 기침을 달고 살았고…',
  '그녀는 말하면서 놀란다. 자기가 기억하고 있었다는 것에.',
  '#박순녀: 이사 갔다고 적었는데. 적고 나니까 정말 이사 간 것 같았는데. 말로 하니까… 아니네. 아니었네.',
], options:[{t:'이름들을 수첩에 적는다.', go:'park_home2'}]},
park_silent:{scene:'박순녀의 집', text:[
  '#박순녀: 이사 갔다니까요. 이사 간 사람 이름을 알아서 뭐 합네까.',
  '그녀는 초상화 쪽을 본다. 하얀 얼굴을. 그리고 입을 닫는다.',
], options:[{t:'…', go:'park_home2'}]},

graves:{scene:'뒷산 공동묘지', text:G=>[
  G.visited.graves>1 ? '뒷산. 봉분들 사이로 바람이 분다.' :
  '마을 뒤 비탈에 낮은 흙무덤들이 줄 없이 흩어져 있다. 대부분 비석이 없다. 나무 말뚝이 꽂힌 무덤도 있는데, 말뚝의 글씨가 하얗다.',
  G.visited.graves>1 ? '' : '무덤 사이에서 허리가 굽은 노인이 낫으로 풀을 벤다. 그가 고개를 들지 않고 말한다.',
  G.visited.graves>1 ? '' : '#노인: 보위원이 여기까지 웬일이오. 여긴 보위할 게 없소. 다 죽은 사람들이니까.',
], passives:[
  {s:'history', dc:10, t:'고난의 행군 시기 사망자에 대한 공식 통계는 존재하지 않는다. 존재하지 않는 것은 지울 필요도 없다. 그런데 창백은 여기에서 유난히 옅다.'},
  {s:'march', dc:8, t:'이 흙. 1997년의 흙은 얼어서 삽이 들어가지 않았다. 그래서 무덤이 이렇게 얕다.'},
], options:[
  {t:'"이 무덤들은 누구요?"', go:'grave_old'},
  {t:'무덤 앞에 무릎을 꿇는다.', check:{s:'march', dc:10, red:true}, ok:'grave_kneel_ok', no:'grave_kneel_no'},
  {t:'내려간다.', go:'square2'},
]},
grave_old:{scene:'뒷산 공동묘지', text:G=>[
  '#노인: 97년, 98년. 내가 묻었소. 한 해에 이 마을에서 마흔둘. 장부에서는 다 "이동"이라고 지웠지. 위에서 숫자를 맞추라고 했으니까.',
  '#노인: 말뚝에 이름을 써 놨는데 사흘 전부터 하얘졌소. 그런데 이상하지. 내 머릿속 이름은 안 하얘져. 내가 매일 부르니까.',
  G.flags.grave_names ? '#노인: 적어 간 이름은 잘 있소?' : '#노인: 적어 두시오, 보위원 동지. 나 죽으면 아무도 없소.',
], options:[
  {t:'노인이 부르는 이름을 받아 적는다.', go:'grave_write', not:['grave_names']},
  {t:'물러난다.', go:'graves'},
]},
grave_write:{scene:'뒷산 공동묘지', on:{ws:1, flag:'grave_names', name:['강철호','류정녀','단추'], thought:'names', pale:-1}, text:[
  '노인이 무덤 하나하나를 낫으로 가리키며 부른다. 너는 받아 적는다.',
  '#노인: 강철호. 탄광 운전공. 풀뿌리 캐러 산에 갔다가 안 내려왔소. 류정녀. 아이 셋 먹이고 자기는 안 먹었소. 그리고 이건 이름 없는 아이. 꽃제비. 우리는 "단추"라고 불렀소. 외투에 단추 하나만 달려 있어서.',
  '#노인: …마흔둘 다 부르려면 해가 지겠지만. 오늘은 이만하면 됐소.',
  '수첩을 덮는다. 말뚝 하나에, 아주 희미하게, 획 하나가 돌아와 있다.',
  '@baekdu: 들었어? 창백이 한 발 물러났어. 아주 조금. 이름을 불렀더니.',
], options:[{t:'노인에게 고개를 숙인다.', go:'graves'}]},
grave_kneel_ok:{scene:'뒷산 공동묘지', on:{name:'은실', morale:1, sp:1}, text:[
  '무릎이 언 흙에 닿는다. 그리고 몸이 기억해 낸다.',
  '1997년 겨울, 함흥. 너보다 네 살 어린 누이. 마지막 며칠 동안 그 아이는 배고프다는 말을 하지 않았다. 네가 미안해할까 봐.',
  '그 아이의 이름. 30년 동안 한 번도 소리 내 부르지 않은 이름.',
  '"…은실아."',
  '@march: 아프다. 좋다. 아픈 건 네가 아직 여기 있다는 뜻이다.',
], options:[{t:'일어선다.', go:'graves'}]},
grave_kneel_no:{scene:'뒷산 공동묘지', on:{morale:-1, hp:-1}, text:[
  '무릎을 꿇는다. 무언가 떠오르려 한다. 작은 손, 겨울, 함흥역. 그런데 그 얼굴 위로 하얀 것이 덮인다.',
  '너는 누구를 잊었는지도 모른 채 일어선다. 가슴에 구멍 모양만 남는다.',
], options:[{t:'…', go:'graves'}]},

cat2:{scene:'장마당 뒷골목 · 2일째', text:G=>[
  (G.visited.cat || G.visited.cat2>1) ? '고양이가 배낭에 물건을 쑤셔 넣고 있다. 중국 담배, 라면, 손전등.' :
  '천막 뒤에서 스무 살쯤 된 여자가 배낭을 꾸리고 있다. 짧은 머리, 중국산 패딩. 너를 보고도 손을 멈추지 않는다.',
  (G.visited.cat || G.visited.cat2>1) ? '' : '#고양이: 보위원? 마침 잘 왔네. 사람들은 나를 고양이라고 불러.',
  '#고양이: 오늘 밤 강 건너갈 거야. 초소에 아무도 없잖아. 이모가 그러는데 단둥 쪽도 하얀데, 하얀 데 한가운데서 만나자고. 웃기지? 국경 한가운데서.',
  G.flags.cat_decided ? '' : '@history: 도강 시도는 반역이다. 보위원은 현장에서 체포할 권한과 의무가 있다.',
], on:{flag:'met_cat'}, options:[
  {t:'"넌 체포다." 팔을 붙잡는다.', check:{s:'rhet', dc:10}, ok:'cat_arrest', no:'cat_escape', not:['cat_decided']},
  {t:'"가라. 나는 아무것도 보지 못했다."', go:'cat_go', not:['cat_decided']},
  {t:'"그 손전등으론 안 된다. 이리 줘봐." 장비를 손봐준다.', check:{s:'hands', dc:10}, ok:'cat_help', no:'cat_go', not:['cat_decided']},
  {t:'압수했던 손전화를 돌려준다.', go:'cat_help', req:['phone'], not:['cat_decided']},
  {t:'떠난다.', go:'square2'},
]},
cat_arrest:{scene:'장마당 뒷골목 · 2일째', on:{ws:-1, flag:['cat_arrested','cat_decided'], morale:-1}, text:[
  '네 목소리에 그녀가 굳는다. 너는 그녀의 손목을 잡아 초대소 뒤 구류실로 끌고 간다. 그녀는 저항하지 않는다. 그게 더 나쁘다.',
  '#고양이: 잘했어, 보위원. 이제 이 마을에서 하얘지지 않는 건 너랑 나랑 저 자물쇠뿐이겠네.',
  '@volition: 의무를 다했다. 그런데 왜 이렇게 무겁지?',
], options:[{t:'자물쇠를 잠근다.', go:'square2'}]},
cat_escape:{scene:'장마당 뒷골목 · 2일째', on:{flag:['cat_gone','cat_decided'], morale:-1}, text:[
  '너는 손을 뻗지만 그녀가 더 빠르다. 고양이처럼. 배낭을 멘 채 천막 사이로 사라진다.',
  '멀리서 그녀의 목소리: "다음엔 술 끊고 와, 보위원!"',
], options:[{t:'숨을 고른다.', go:'square2'}]},
cat_go:{scene:'장마당 뒷골목 · 2일째', on:{flag:['cat_gone','cat_decided']}, text:[
  '그녀가 너를 본다. 처음으로, 의심 없이.',
  '#고양이: …진짜? 보위원이?',
  '"보위할 국경이 없으면 보위원도 없는 거다."',
  '#고양이: 그 말, 기억해 둘게.',
], options:[{t:'돌아선다.', go:'square2'}]},
cat_help:{scene:'장마당 뒷골목 · 2일째', on:{ws:1, flag:['cat_gone','cat_helped','cat_decided'], unflag:['phone','item_phone'], name:'김설화', sp:1}, text:[
  '너는 그녀의 장비를 손본다. 손전등 접점을 긁어내고, 손전화 배터리를 아끼는 법을 알려준다. 국경 경비대에서 압수품을 다루며 배운 것들이다. 이제 처음으로 반대쪽을 위해 쓴다.',
  '#고양이: …김설화야. 내 진짜 이름. 고양이는 장마당 이름이고.',
  '#고양이: 기억해. 저쪽에서 이름을 물어보면, 누군가 나를 기억하고 있다고 말할 수 있게.',
  '@empathy: 그녀는 이름을 맡겼다. 이 나라에서 그건 목숨을 맡기는 것과 같다.',
], options:[{t:'그녀를 보낸다.', go:'square2'}]},

station2:{scene:'기상관측소 · 2일째', text:G=>[
  '관측소. 오영희가 기록부 위에 엎드리다시피 무언가를 쓰고 있다. 숫자가 아니다.',
  '#오영희: 숫자가 다 하얘졌어. 어제 쓴 것까지. 그래서 이름을 써봤지. 남편 이름, 딸 이름, 옆집 사람 이름. 이상하게 이름은 버텨. 반나절은.',
  G.names.length ? `@baekdu: 네 수첩에도 이름이 ${G.names.length}개 있지. 그녀에게 보여줘.` : '',
], passives:[
  {s:'hands', dc:10, t:'라디오가 다른 주파수를 잡고 있다. 아니, 다른 시간을 잡고 있다. 어젯밤의 목소리다. 네 목소리.'},
], options:[
  {t:'원리를 따져본다.', check:{s:'logic', dc:8}, ok:'oh_theory', no:'oh_theory_no', not:['names_resist']},
  {t:'수첩의 이름들을 그녀에게 불러준다.', go:'oh_share', cond:G=>G.names.length>=2, not:['oh_shared']},
  {t:'라디오에서 나오는 네 목소리를 듣는다.', check:{s:'baekdu', dc:12}, ok:'radio2_ok', no:'radio2_no'},
  {t:'"남편 이야기를 해주시오."', go:'oh_husband', once:true},
  {t:'내려간다.', go:'square2'},
]},
oh_theory:{scene:'기상관측소 · 2일째', on:{flag:'names_resist', sp:1}, text:[
  '@logic: 정리하자. 가장 먼저 사라진 것: 구호. 존함. 초상화. 배급 장부의 숫자. 공통점은 — 수없이 복제되었다는 것. 수백만 번 반복된 말은 원본이 없다. 창백은 원본 없는 것부터 먹는다.',
  '@logic: 반대로 남는 것: 단 한 사람을 가리키는 이름. 누군가 직접, 의미를 담아 부른 말. 복제가 아니라 원본인 것.',
  '#오영희: 그러니까… 구호는 하얘지고 사람 이름은 버틴다? 그거 보고서에 쓰면 동지 죽어요.',
], options:[{t:'"알고 있소."', go:'station2'}]},
oh_theory_no:{scene:'기상관측소 · 2일째', text:[
  '무언가 패턴이 있다. 손에 잡힐 듯하다. 하지만 머릿속에서 구호가 울린다 — 미제의 기상침략, 미제의 기상침략 — 그 소리가 생각을 덮는다.',
], options:[{t:'…', go:'station2'}]},
oh_share:{scene:'기상관측소 · 2일째', on:{ws:1, flag:'oh_shared', pale:-1, morale:1}, text:G=>[
  `너는 수첩을 펼쳐 이름을 하나씩 부른다. ${G.names.join(', ')}.`,
  '오영희가 받아 적는다. 관측 기록부의 "기압" 칸에, "기온" 칸에, "풍속" 칸에.',
  '#오영희: 관측 대상: 사람. 관측 결과: 있음. …이렇게 적으니까 좀 낫네.',
  '창밖의 창백이 아주 조금, 언덕 아래로 물러난다. 아니면 그렇게 보이고 싶은 것이다.',
], options:[{t:'…', go:'station2'}]},
radio2_ok:{scene:'기상관측소 · 2일째', on:{flag:'heard_self', morale:1}, text:[
  '잡음 속에서 어젯밤의 네가 노래를 부르고 있다. 「휘파람」. 엉망으로, 행복하게. 노래가 끝나고 네가 말한다.',
  '#라디오 속의 너: 영희 동무, 내 이름 들어봐. 내 이름은 한— (잡음) — 엄마가 지어준 이름이야. 아무한테도 말 안 했어. 13국에서는 번호로 불리니까.',
  '@baekdu: 한. 첫 글자. 너의 것. 창백이 아직 못 먹은 것.',
], options:[{t:'라디오를 끈다. 소리는 계속 난다.', go:'station2'}]},
radio2_no:{scene:'기상관측소 · 2일째', text:[
  '네 목소리가 들린다. 노래인지 울음인지 모르겠다. 너는 스스로가 부끄러워 귀를 막는다.',
], options:[{t:'…', go:'station2'}]},
oh_husband:{scene:'기상관측소 · 2일째', on:{name:'오창근'}, text:[
  '#오영희: 오창근. 나보다 열 살 많았지. 이 관측소 첫 관측원이었어. 98년 봄에 갔어. 마지막으로 적은 기록이 "맑음"이었어. 그날 비가 왔는데.',
  '#오영희: 왜 "맑음"이라고 적었냐고 물었더니, 위에서 그날은 맑아야 한다고 했대. 무슨 기념일이었나. 그 사람이 평생 적은 숫자 중에 그게 유일한 거짓말이었어.',
  '@empathy: 그녀가 여기 남아 있는 이유. 남편이 못 쓴 정직한 기록을 대신 쓰기 위해서.',
], options:[{t:'…', go:'station2'}]},

rally:{scene:'청수리 광장 · 궐기대회', text:G=>[
  '정오. 마을 사람 예순 명쯤이 광장에 모였다. 손에는 급히 만든 구호판. 「미제의 기상침략 책동을 짓부시자!」 단상에 최경철 중좌가 서 있다.',
  '#최경철: 지금부터 국가보위성 13국 소좌 동무가 연설하겠소!',
  '그가 원고를 건넨다. 「…미제와 그 추종세력이 감행한 비렬한 기상무기 공격에 우리 인민은 천백 배의 복수로…」',
  '군중이 구호를 외치기 시작한다. 짓부시자! 짓부시자! 외칠 때마다 — 너는 본다 — 구호판의 글자가 바래고, 광장 북쪽 가장자리의 창백이 꿈틀거린다. 소리를 먹고 있다.',
  G.names.length>=3 ? `@baekdu: 네 수첩에는 이름이 ${G.names.length}개 있어. 구호 대신 그걸 부르면 어떻게 될까?` : '@logic: 반복되는 구호. 원본 없는 말. 창백의 먹이다.',
], options:[
  {t:'원고대로 읽는다.', check:{s:'rhet', dc:10}, ok:'rally_lie_ok', no:'rally_lie_no'},
  {t:'원고를 내려놓고, 수첩의 이름들을 부른다.', check:{s:'rhet', dc:12, red:true}, ok:'rally_names', no:'rally_names_fail', cond:G=>G.names.length>=3},
  {t:'아무 말도 하지 않고 서 있는다.', check:{s:'composure', dc:12, red:true}, ok:'rally_silence', no:'rally_silence_fail'},
]},
rally_lie_ok:{scene:'청수리 광장 · 궐기대회', on:{ws:-2, flag:['rally_done','rally_lie','choi_trust'], pale:2}, text:[
  '너는 읽는다. 목소리가 쇠처럼 울린다. 군중이 따라 외친다. 천백 배의 복수! 천백 배의 복수!',
  '그리고 그것이 온다. 광장 북쪽 끝의 김치움 두 개가 하얘진다. 맨 앞줄에서 주먹을 흔들던 노파 한 명이 구호를 외치는 도중에 — 투명해지더니 — 없다. 옆 사람들은 계속 외친다. 아무도 멈추지 않는다.',
  '#최경철: 훌륭하오, 소좌!',
  '@empathy: 누구였지? 방금 사라진 그 할머니. 아무도 모른다. 이제 아무도 모를 것이다.',
], options:[{t:'단상에서 내려온다.', go:'square2'}]},
rally_lie_no:{scene:'청수리 광장 · 궐기대회', on:{ws:-1, flag:['rally_done','rally_lie'], pale:1, morale:-1}, text:[
  '너는 읽으려 한다. 그런데 글자가 원고에서 미끄러진다. "미제의… 기상… 기상…" 군중이 웅성거린다.',
  '최경철이 마이크를 빼앗아 직접 외친다. 군중이 따라 외친다. 창백이 꿈틀거린다.',
  '#최경철: (낮게) 동무는 나중에 보겠소.',
], options:[{t:'단상에서 내려온다.', go:'square2', fx:{flag:'choi_suspicious'}}]},
rally_names:{scene:'청수리 광장 · 궐기대회', on:{ws:2, flag:['rally_done','rally_names','choi_shaken'], pale:-2, morale:2}, text:G=>[
  '너는 원고를 접는다. 수첩을 연다. 그리고 부른다.',
  `"${G.names.join('. ')}."`,
  '광장이 조용해진다. 구호판을 든 손들이 내려간다. 너는 계속 부른다. 처음엔 너 혼자. 그다음 — 군중 속에서 누군가 따라 부른다. "한복실 할머니." 또 누군가. "문태식이." 그리고 박순녀가, 아주 크게. "정명수!"',
  '광장 북쪽의 창백이 멈춘다. 그리고 — 한 걸음, 물러난다.',
  '최경철은 단상 위에서 굳어 있다. 그의 장갑 낀 손이 떨린다. 그는 너를 체포하지 않는다. 체포할 수 없다. 군중 속에서 자기 딸의 이름을 부르고 싶은 얼굴을 하고 있으니까.',
], options:[{t:'단상에서 내려온다.', go:'square2'}]},
rally_names_fail:{scene:'청수리 광장 · 궐기대회', on:{flag:['rally_done','choi_hostile'], hp:-1, morale:-1}, text:[
  '너는 원고를 접고 이름을 부르기 시작한다. "리용남…" 그러나 목소리가 너무 작다. 군중은 그게 무슨 소리인지 모른다.',
  '최경철의 병사 두 명이 너를 단상에서 끌어내린다. 개머리판이 옆구리에 박힌다. 최경철이 마이크를 잡는다. 짓부시자! 짓부시자!',
  '@march: 갈비뼈. 아마 금이 갔다. 괜찮다. 1997년보다는 낫다.',
], options:[{t:'흙바닥에서 일어난다.', go:'square2'}]},
rally_silence:{scene:'청수리 광장 · 궐기대회', on:{ws:1, flag:['rally_done','rally_silent']}, text:[
  '너는 원고를 들고 서 있는다. 아무 말도 하지 않는다. 10초. 30초. 1분.',
  '군중의 구호가 하나씩 멈춘다. 그들은 네가 무언가를 기다린다고 생각한다. 아니면 — 누군가 속삭인다 — 묵념이다. 사라진 사람들을 위한.',
  '광장 전체가 고개를 숙인다. 창백도 멈춰 있다. 먹을 것이 없으니까.',
  '#최경철: (낮게) …이게 뭐요, 소좌.',
  '"묵념입니다, 중좌 동지. 미제의 공격으로 희생된 인민들을 위한."',
  '그는 아무 말도 하지 못한다. 묵념을 처벌할 수는 없다. 그건 공화국의 문법 안에 있으니까.',
], options:[{t:'단상에서 내려온다.', go:'square2'}]},
rally_silence_fail:{scene:'청수리 광장 · 궐기대회', on:{ws:-1, flag:['rally_done','choi_hostile'], pale:2, morale:-1}, text:[
  '너는 침묵하려 한다. 하지만 군중의 시선, 최경철의 시선이 쏟아진다. 네 얼굴이 무너진다. 땀, 떨림, 공포.',
  '최경철이 너를 밀치고 마이크를 잡는다. 그의 구호는 더 크고 더 길다. 창백이 광장 끝의 김치움을 먹는다.',
], options:[{t:'단상에서 밀려난다.', go:'square2'}]},

night2:{scene:'청수리 초대소 · 밤', on:{hp:1}, text:G=>[
  '밤. 초대소. 창문 밖 북쪽 하늘이 희미하게 빛난다. 오늘은 그 빛이 마을 지붕들 위에 걸려 있다.',
  G.flags.choi_hostile ? '문이 열린다. 노크 없이. 최경철이 남포등을 들고 들어온다. 병사 하나가 문 밖에 선다.' :
  '문을 두드리는 소리. 최경철이다. 손에 술병 하나. 장갑 낀 손으로.',
], options:[
  {t:'(심문) "앉으시오, 소좌."', go:'night2_interro', req:['choi_hostile']},
  {t:'그를 들인다.', go:'night2_drink', not:['choi_hostile']},
]},
night2_interro:{scene:'청수리 초대소 · 밤', text:[
  '그가 남포등을 탁자에 놓는다. 불빛이 네 얼굴로 온다. 13국 취조실의 배치다. 너도 수백 번 해본.',
  '#최경철: 이름.',
  '#최경철: 이름을 대시오, 소좌. 이름이 없는 자는 공화국 공민이 아니오. 공민이 아닌 자는 반역자요. 간단한 논리요.',
], options:[
  {t:'버틴다. 아무것도 내주지 않는다.', check:{s:'volition', dc:12}, ok:'interro_ok', no:'interro_no'},
  {t:'"중좌 동지의 이름은 무엇입니까? 전부 말해 보십시오."', go:'interro_turn', req:['choi_fading']},
]},
interro_ok:{scene:'청수리 초대소 · 밤', on:{morale:1, flag:'choi_writes'}, text:[
  '너는 남포등 불빛을 똑바로 본다. 아무 말도 하지 않는다. 너는 이 의자의 반대편을 너무 잘 안다. 무엇을 말하든 그것이 자백서가 된다는 걸.',
  '한 시간 후 그가 일어선다.',
  '#최경철: 좋소. 보고서는 내가 쓰겠소. 동무는 서명만 하시오. 모레… 아니, 내일 밤.',
], options:[{t:'그가 나가는 것을 본다.', go:'night2_end'}]},
interro_no:{scene:'청수리 초대소 · 밤', on:{morale:-1, hp:-1, flag:'choi_writes'}, text:[
  '너는 버티려 한다. 하지만 불빛, 질문, 반복. 이름, 이름, 이름. 결국 너는 말한다. "모르겠습니다. 기억이 나지 않습니다." 그 말이 자백처럼 방에 걸린다.',
  '#최경철: 그렇겠지. 보고서는 내가 쓰겠소. 동무는 서명만 하시오.',
], options:[{t:'그가 나가는 것을 본다.', go:'night2_end'}]},
interro_turn:{scene:'청수리 초대소 · 밤', on:{flag:['choi_shaken'], unflag:'choi_hostile', sp:1}, text:[
  '그의 질문이 멈춘다.',
  '#최경철: …뭐라고 했소?',
  '"성과 이름. 끝까지. 출장 증명서에 적힌 대로."',
  '긴 침묵. 남포등 심지가 지글거린다.',
  '#최경철: 최경… 최경…',
  '그는 남포등을 끈다. 어둠 속에서 그의 목소리가 처음으로 사람의 목소리다.',
  '#최경철: 내일 아침에 다시 이야기합시다, 소좌.',
], options:[{t:'어둠 속에 앉아 있는다.', go:'night2_end'}]},
night2_drink:{scene:'청수리 초대소 · 밤', text:G=>[
  '그가 술병을 탁자에 놓는다. 평양 소주. 이 마을에서는 볼 수 없는 술.',
  '#최경철: 마시오. 오늘 고생했소.',
  G.flags.rally_names ? '#최경철: …아까 그 이름들. 동무가 부른 것. 그걸 듣는데 내 딸 이름이 생각나지 않았소. 그게 무서웠소. 미제보다, 평양보다.' :
  '#최경철: 혜산에서 오는 길에 말이오. 길가 마을 세 개가 지도에 있는데 없었소. 운전수는 원래 없었다고 하더군. 나는 지도를 믿어야 하오, 운전수를 믿어야 하오?',
], options:[
  {t:'그의 이야기를 듣는다. 끝까지.', check:{s:'empathy', dc:10}, ok:'drink_ok', no:'drink_no'},
  {t:'함께 마신다. 많이.', check:{s:'stomach', dc:10}, ok:'drink_heavy_ok', no:'drink_heavy_no'},
]},
drink_ok:{scene:'청수리 초대소 · 밤', on:{ws:1, flag:'choi_ally', morale:1}, text:[
  '너는 묻지 않는다. 그냥 듣는다. 그는 말한다. 혜산의 아파트. 열두 살 딸. 딸이 그린 그림 — 노란 해, 파란 강, 강 건너의 불빛.',
  '#최경철: 그 애 이름을… 그 애가 태어났을 때 내가 지었소. 그런데 이제…',
  '그는 장갑을 벗는다. 손목까지 하얗다. 그리고 운다. 평양에서 온 검열원이, 이름 없는 보위원 앞에서.',
  '#최경철: 내일 보고서 말이오. 동무가 쓰는 대로 서명하겠소. 어차피 그걸 받을 평양이 남아 있는지도 모르겠소.',
], options:[{t:'잔을 채워준다.', go:'night2_end'}]},
drink_no:{scene:'청수리 초대소 · 밤', text:[
  '너는 듣는 척하지만 생각은 다른 데 가 있다. 그도 그걸 안다. 그는 잔을 비우고 일어선다.',
  '#최경철: 됐소. 내일 보고서나 잘 쓰시오.',
], options:[{t:'…', go:'night2_end', fx:{flag:'truck_offer'}}]},
drink_heavy_ok:{scene:'청수리 초대소 · 밤', on:{hp:1, morale:1, flag:'truck_offer'}, text:[
  '한 잔, 두 잔, 한 병. 너는 버틴다. 그는 무너진다.',
  '#최경철: 소좌… 내일 밤에 트럭이 혜산으로 떠나오. 내 보고서에 서명하고 같이 갑시다. 여기 남으면 동무도 하얘지오. 거기서 누가 이름을 물어보면, 나는 동무 이름을 지어서라도 말해주겠소.',
  '@jangmadang: 평양 소주! 오랜만이야! …근데 이 사람, 도망치자는 거잖아.',
], options:[{t:'잠든 그를 침대에 눕힌다.', go:'night2_end'}]},
drink_heavy_no:{scene:'청수리 초대소 · 밤', on:{hp:-1, flag:'truck_offer'}, text:[
  '세 잔째에서 세상이 돈다. 다섯 잔째에서 너는 바닥에 있다. 그가 무언가를 말한다. 트럭, 혜산, 서명. 너는 고개를 끄덕인다. 무엇에 끄덕였는지 모른다.',
], options:[{t:'어둠.', go:'night2_end'}]},
night2_end:{scene:'청수리 초대소 · 밤', text:[
  '혼자 남는다. 창밖의 빛이 조금 더 가깝다.',
  '@volition: 하루 남았다. 내일 밤에는 써야 한다.',
  '@baekdu: 아니면 내일 밤에는 쓸 사람이 없거나.',
], options:[{t:'잠든다.', go:'day3_start', fx:{day:3}}]},

// ================= 3일째 =================
day3_start:{scene:'청수리 초대소', text:G=>[
  '— 3일째 —',
  '확성기가 울리지 않는다. 고장이 아니다. 확성기 자체가 하얗다. 기둥 위에 확성기 모양의 빈 곳.',
  '창백은 이제 마을의 북쪽 절반에 있다. 초대소에서 스무 걸음.',
  '#박순녀: (밖에서) 보위원 동지! 전화가 안 돼요! 혜산으로 간 연락 트럭이 빈 채로 돌아왔어요. 운전수 말이, 남쪽 길이 이십 리쯤 가면 하얗대요.',
  G.flags.wrote_myeongsu ? '그리고 그 뒤로, 맨발의 젊은이가 서 있다. 군복이 젖어 있다. 명수다. 그는 어머니의 손을 잡고 있다.' : '',
  G.flags.wrote_myeongsu ? '#정명수: 하얀 데서… 누가 제 이름을 불렀습니다. 장부에서. 그래서 따라왔습니다.' : '',
], options:[
  {t:'광장으로.', go:'square3', fx:G=>G.flags.wrote_myeongsu ? {morale:2, flag:'myeongsu_back'} : null},
]},
square3:{scene:'청수리 광장 · 3일째', text:G=>[
  G.visited.square3>1 ? '광장의 절반이 하얗다. 남은 절반에 사람들이 모여 있다.' :
  '광장의 북쪽 절반이 없다. 구호판, 김치움, 상점이 있던 자리가 하얀 면이 되었다. 남은 절반에 마을 사람들이 보따리를 들고 서 있다. 갈 곳이 없다는 걸 알면서.',
  G.flags.village_names ? '집집마다 문에 숯으로 이름이 적혀 있다. 그 문들 앞에서 창백이 머뭇거린다.' : '',
  G.visited.square3>1 ? '' : '@logic: 남쪽 길도 하얗다. 전화도 없다. 평양에 보고서를 보낼 방법이 있기는 한가? 그래도 보고서는 써야 한다. 그것이 13국이다. 아니면 그것이 너다.',
], options:[
  {t:'최경철을 찾는다.', go:'choi3'},
  {t:'박순녀의 집 앞, 사람들에게 간다.', go:'park3'},
  {t:'기상관측소로 올라간다.', go:'station3', req:['know_station']},
  {t:'창백의 경계로 간다.', go:'edge3'},
  {t:'구류실의 고양이에게 간다.', go:'lockup', req:['cat_arrested'], not:['cat_released']},
  {t:'[밤이 온다. 보고서를 쓴다.]', go:'finale', req:['met_choi3']},
]},

choi3:{scene:'광장 · 군용 트럭', on:{flag:'met_choi3'}, text:G=>[
  '최경철이 트럭 발판에 앉아 있다. 외투 깃이 반쯤 하얗다. 오늘은 장갑을 끼지 않았다. 숨길 의미가 없어서.',
  G.flags.choi_ally ? '#최경철: 소좌. 어젯밤 일은… 아니, 잊지 마시오. 잊을 게 너무 많은 마을이니.' :
  G.flags.choi_hostile ? '#최경철: 보고서 초안은 내가 썼소. 동무는 서명만 하면 되오. 오늘 밤, 트럭이 떠나기 전에.' :
  '#최경철: 오늘 밤 트럭이 남쪽으로 출발하오. 길이 하얗다고들 하는데, 나는 지도를 믿소. 내 보고서에 서명하고 같이 갑시다.',
], options:[
  {t:'"중좌 동지와 함께 진실을 쓰겠습니다. 같이 서명해 주십시오."', go:'choi_cosign', req:['choi_ally'], not:['choi_cosign']},
  {t:'관측 기록과 수첩의 이름들로 그를 설득한다.', check:{s:'logic', dc:12}, ok:'choi_convinced', no:'choi_unmoved', cond:G=>(G.flags.log_truth||G.flags.names_resist) && !G.flags.choi_ally, once:true},
  {t:'"중좌 동지의 이름도 지워지고 있습니다. 끝까지 말해 보십시오."', check:{s:'rhet', dc:10}, ok:'choi_convinced', no:'choi_unmoved', req:['choi_fading'], not:['choi_ally','choi_shaken'], once:true},
  {t:'"딸 이야기를 해주십시오."', go:'choi_daughter', req:['choi_shaken'], not:['choi_ally']},
  {t:'"트럭 이야기, 생각해 보겠습니다."', go:'square3', fx:{flag:'truck_offer'}},
]},
choi_cosign:{scene:'광장 · 군용 트럭', on:{flag:'choi_cosign'}, text:[
  '#최경철: …좋소. 검열국 중좌와 13국 소좌의 공동 서명. 평양에서도 쉽게 지우지 못할 거요. 평양이 아직 지우는 쪽이라면.',
  '그가 하얀 손을 내민다. 너는 잡는다. 차갑지 않다. 아무것도 아니다. 하지만 악수는 악수다.',
], options:[{t:'…', go:'square3'}]},
choi_convinced:{scene:'광장 · 군용 트럭', on:{ws:1, flag:['choi_ally','choi_cosign'], sp:1}, text:[
  '너는 펼쳐 놓는다. 기압 "없음". 모레의 날짜가 적힌 기록. 구호부터, 초상화부터 하얘진 순서. 이름을 부르면 물러나는 경계.',
  '그는 오래 읽는다. 하얀 손가락으로 한 줄씩 짚어가며.',
  '#최경철: …내가 혜산에서 출발할 때 받은 지시는 "미제의 무기로 결론 내릴 것"이었소. 결론부터 받고 조사하러 왔지. 30년 동안 그렇게 일했소.',
  '#최경철: 내 서명도 넣으시오. 내 이름이 다 지워지기 전에, 한 번쯤은 맞는 문서에 들어가 있고 싶소.',
], options:[{t:'고개를 숙인다.', go:'choi3'}]},
choi_unmoved:{scene:'광장 · 군용 트럭', on:{flag:'truck_offer', morale:-1}, text:[
  '#최경철: 그만하시오. 그런 걸 평양에 보내면 동무도 나도 끝이오. 아니, 하얘지는 것보다 그게 낫다는 거요? …나는 아니오.',
  '#최경철: 트럭은 밤에 떠나오. 마음이 바뀌면 오시오.',
], options:[{t:'…', go:'choi3'}]},
choi_daughter:{scene:'광장 · 군용 트럭', text:[
  '#최경철: 딸… 열두 살. 그림을 잘 그리오. 이름은…',
  '그가 멈춘다. 입술이 첫 글자 모양을 만들다가 멈춘다.',
], options:[
  {t:'"천천히. 그 아이를 처음 안았을 때를 떠올려 보십시오."', check:{s:'empathy', dc:10}, ok:'daughter_ok', no:'daughter_no'},
  {t:'더 묻지 않는다.', go:'choi3'},
]},
daughter_ok:{scene:'광장 · 군용 트럭', on:{ws:1, flag:['choi_ally'], name:'최은별'}, text:[
  '#최경철: 혜산 산원. 새벽. 하늘에 별이 하나… 은별. 최은별. 내가 지었소. 별처럼 작고 은처럼 오래가라고.',
  '그의 외투 깃에 색이 조금 돌아온다. 그는 그것을 보고, 너를 본다.',
  '#최경철: 동무가 쓰는 보고서에 내 서명이 필요하면, 말하시오.',
], options:[{t:'…', go:'choi3'}]},
daughter_no:{scene:'광장 · 군용 트럭', on:{morale:-1, flag:'truck_offer'}, text:[
  '그는 끝내 떠올리지 못한다. 그는 일어서서 트럭 운전석 쪽으로 간다.',
  '#최경철: 혜산에 가면 기억나겠지. 집에 가면. …오늘 밤 트럭이 떠나오, 소좌.',
], options:[{t:'…', go:'choi3'}]},

park3:{scene:'박순녀의 집 앞', text:G=>[
  '박순녀의 집 앞에 마을 사람 서른 명쯤이 모여 있다. 그들이 너를 본다. 보위원을. 처음으로, 두려움이 아니라 기대로.',
  '#박순녀: 동지. 우리 어떻게 합네까. 남쪽 길도 막혔고. 위에서는 아무 지시도 없고.',
  G.flags.names_resist ? '@logic: 너는 답을 알고 있다. 이름은 버틴다. 단 한 사람을 가리키는 말은.' : '@baekdu: 그들은 지시를 기다려. 평생 그랬어. 넌 지시를 줄 수 있어. 어떤 지시든.',
], options:[
  {t:'"집집마다 문에 식구들 이름을 쓰시오. 크게. 그리고 서로 불러주시오."', check:{s:'rhet', dc:10}, ok:'village_ok', no:'village_no', req:['names_resist'], not:['village_names','village_tried']},
  {t:'사람들 하나하나에게 이름을 묻고, 불러준다.', check:{s:'empathy', dc:12}, ok:'village_ok', no:'village_no', not:['village_names','village_tried']},
  {t:'"당의 지시를 기다리시오. 동요하지 마시오."', go:'village_wait', not:['village_names','village_tried']},
  {t:'돌아간다.', go:'square3'},
]},
village_ok:{scene:'박순녀의 집 앞', on:{ws:2, flag:['village_names','village_tried'], pale:-2, morale:2, name:['한씨네 막내','박순녀']}, text:[
  '처음엔 아무도 움직이지 않는다. 그러다 박순녀가 숯 조각을 집어 자기 집 문에 쓴다. 박순녀. 정명수.',
  '그리고 옆집이. 그 옆집이. 아이들이 숯을 들고 뛰어다닌다. 누군가 이웃의 이름을 부르고, 그 이웃이 대답한다. "여기 있소!"',
  '창백이 다가오다가, 이름이 적힌 첫 번째 문 앞에서 — 멈춘다.',
  '@empathy: 이 마을은 처음으로 구호가 아닌 것을 함께 외치고 있다.',
], options:[{t:'…', go:'square3'}]},
village_no:{scene:'박순녀의 집 앞', on:{flag:'village_tried', morale:-1}, text:[
  '너는 말한다. 하지만 사람들은 서로를 본다. 보위원이 이름을 쓰라고? 명단을 만들라는 건가? 끌려갈 사람들 명단?',
  '사람들이 하나둘 흩어진다. 공화국에서 이름을 적으라는 말은 오직 한 가지 뜻이었다.',
], options:[{t:'…', go:'square3'}]},
village_wait:{scene:'박순녀의 집 앞', on:{ws:-1, flag:'village_tried', pale:1}, text:[
  '사람들이 고개를 끄덕인다. 익숙한 말이다. 그들은 기다린다. 보따리를 든 채, 하얀 쪽을 등지고.',
  '@baekdu: 기다림. 이 나라 사람들이 가장 잘하는 것. 창백도 기다리는 걸 좋아해.',
], options:[{t:'…', go:'square3'}]},

station3:{scene:'기상관측소 · 3일째', text:G=>[
  '관측소가 있는 언덕 기슭까지 창백이 와 있다. 오영희는 백엽상 옆에 접이식 의자를 놓고 앉아 있다. 마지막 담배를 피우며.',
  '#오영희: 오늘 관측: 하얌. 내일 관측: 아마 관측자 없음.',
  G.flags.cat_gone ? '관측소 안 라디오에서 젊은 여자 목소리가 들린다. 잡음 사이로.' : '',
  G.flags.cat_helped ? '#라디오: 보위원? 들려? 나 설화야. 강 한가운데야. 여기 사람들이 있어. 이름 없는 사람들이 이름을 물어봐. 나는 김설화라고 대답했어. 누가 날 기억하고 있다고. 그랬더니 길을 비켜줬어. 이모가 저기 보여.' :
  G.flags.cat_gone ? '#라디오: …보위원… 하얘… 이름을 물어보는데… 대답을 못 하겠어… (잡음)' : '',
  G.flags.cat_arrested ? '#오영희: 고양이는? 그 애가 담배를 대줬는데. …구류실이라고? 그래. 거기라면 안 하얘지겠네. 적어도 당분간은.' : '',
], options:[
  {t:'"기록부를 주시오. 평양에 가져가겠소."', go:'oh_logbook', not:['logbook']},
  {t:'"같이 내려갑시다. 관측은 끝났소."', check:{s:'empathy', dc:10}, ok:'oh_saved', no:'oh_stays', not:['oh_saved','oh_stays']},
  {t:'돌아간다.', go:'square3'},
]},
oh_logbook:{scene:'기상관측소 · 3일째', on:{flag:['logbook','log_truth']}, text:G=>[
  '그녀가 기록부를 건넨다. 숫자 칸은 전부 하얗다. 하지만 그 위에 덧쓴 이름들은 아직 있다.',
  G.flags.oh_shared ? '그중엔 네가 불러준 이름들도 있다.' : '',
  '#오영희: 맨 마지막 장 봐요.',
  '마지막 장에는 오늘 날짜, 그리고 그녀의 글씨: 「관측 결과: 사람이 있음. 관측자: 오영희. 이것은 거짓이 아님. — 오창근의 마지막 기록을 정정함.」',
], options:[{t:'기록부를 품에 넣는다.', go:'station3'}]},
oh_saved:{scene:'기상관측소 · 3일째', on:{flag:'oh_saved', morale:1}, text:[
  '#오영희: …관측자가 없으면 관측이 안 되는데.',
  '"마을에 관측할 게 많소. 사람들이 문에 이름을 쓰고 있소. 누군가 그걸 기록해야 하오."',
  '그녀가 담배를 끈다. 백엽상 문을 닫는다. 그리고 너를 따라 내려온다.',
], options:[{t:'…', go:'square3'}]},
oh_stays:{scene:'기상관측소 · 3일째', on:{flag:'oh_stays'}, text:[
  '#오영희: 아니. 누군가 끝까지 봐야 해요. 창근이가 못 한 거. 하얘지는 순간까지 정직하게 적는 거.',
  '#오영희: 가요, 보위원 동지. 동지 보고서는 동지가 쓰고. 내 건 내가 쓸게.',
], options:[{t:'그녀를 남겨둔다.', go:'square3'}]},

edge3:{scene:'창백의 경계', text:G=>[
  '마을 북쪽 길이 하얀 면 속으로 끊겨 있다. 경계에 서면, 창백 안에 무언가가 보인다.',
  '사람들. 희미한 형체들. 서 있다. 기다리고 있다. 보따리를 든 가족. 지팡이를 짚은 노파. 다리를 저는 소년.',
  '@baekdu: 이사 간 사람들이야. 이동한 사람들. 장부에서 지워진 사람들. 아무도 부르지 않아서 돌아오지 못하는 사람들.',
  G.flags.returned ? '경계 이쪽에 리용남네 가족이 앉아 있다. 마을 사람들이 그들에게 강냉이죽을 나르고 있다.' : '',
], options:[
  {t:'수첩의 이름들을 소리 내 부른다.', check:{s:'baekdu', dc:10, red:true}, ok:'edge_call', no:'edge_fail', cond:G=>G.names.length>=3, not:['returned']},
  {t:'창백 안으로 손을 뻗는다.', check:{s:'march', dc:12, red:true}, ok:'edge_hand', no:'edge_hand_no', not:['returned']},
  {t:'돌아간다.', go:'square3'},
]},
edge_call:{scene:'창백의 경계', on:{ws:2, flag:'returned', pale:-2, morale:2, sp:1}, text:G=>[
  '너는 부른다. 수첩의 첫 장부터.',
  `"${G.names.join('. ')}."`,
  '형체들이 고개를 든다. 몇몇이 — 전부는 아니다 — 경계 쪽으로 걸어온다. 다리를 저는 소년이 먼저. 그 뒤로 그의 부모, 형.',
  '리용남네 가족이 하얀 면을 넘어 흙길 위에 선다. 그들은 춥다고 말한다. 배고프다고 말한다. 살아 있는 사람만 하는 말이다.',
  G.names.includes('단추') ? '그리고 맨 뒤에, 외투에 단추 하나만 달린 아이가 경계 바로 안쪽에 서 있다. 넘어오지는 않는다. 손을 흔든다. 그것으로 충분하다는 듯이.' : '',
], options:[{t:'무릎에 힘이 빠진다.', go:'square3'}]},
edge_fail:{scene:'창백의 경계', on:{morale:-2, pale:1}, text:[
  '너는 부르려 한다. 그런데 이름이 혀끝에서 하얘진다. 수첩을 보면 글자가 보이는데, 소리로 나오지 않는다.',
  '형체들이 다시 고개를 숙인다. 기다림으로 돌아간다.',
], options:[{t:'물러난다.', go:'edge3'}]},
edge_hand:{scene:'창백의 경계', on:{flag:'saw_other', pale:1}, text:[
  '손을 넣는다. 이번에는 무언가 잡힌다. 손. 작고 차가운 손. 너는 그것을 당긴다. 하지만 손은 놓는다. 부드럽게. "아직이야"라고 말하듯.',
  '그 순간 너는 창백 저편을 본다. 강 건너편의 경계에도 사람들이 서 있다. 중국 군복의 병사, 보따리를 든 단둥 사람들. 양쪽 모두 같은 하얀 면을 바라보고 있다.',
], options:[{t:'손을 뺀다.', go:'edge3'}]},
edge_hand_no:{scene:'창백의 경계', on:{hp:-2, pale:2}, text:[
  '손을 넣는다. 그리고 너는 30년을 잃는다. 아주 잠깐. 다시 돌아왔을 때 너는 네가 몇 살인지, 지금이 몇 년인지 확신할 수 없다.',
  '@march: 숨 쉬어. 심장 뛰지? 그럼 아직 여기야.',
], options:[{t:'비틀거리며 물러난다.', go:'edge3'}]},

lockup:{scene:'초대소 구류실', text:[
  '초대소 뒤 창고를 개조한 구류실. 자물쇠는 아직 색이 있다. 쇠는 오래 버틴다.',
  '#고양이: 보위원. 밖은 어때? 여기선 소리만 들려. 사람들이 이름을 부르는 소리. 그게 무슨 소리야?',
], options:[
  {t:'자물쇠를 연다. "가라. 강 한가운데로."', go:'lockup_free'},
  {t:'"아직은 안 된다."', go:'square3'},
]},
lockup_free:{scene:'초대소 구류실', on:{ws:1, flag:['cat_released','cat_gone'], name:'김설화', morale:1}, text:[
  '#고양이: …왜 마음이 바뀌었어?',
  '"지킬 국경이 없다. 그럼 가둘 이유도 없다."',
  '#고양이: 김설화. 내 이름이야. 저쪽에서 물어보면 보위원이 기억하고 있다고 할게. 웃기지. 보위원이 내 이름을 기억하는 게 처음으로 좋은 일이네.',
], options:[{t:'그녀를 보낸다.', go:'square3'}]},

// ================= 피날레 (3일째 밤) =================
finale:{scene:'밤의 압록강', text:G=>[
  '3일째 밤. 너는 마지막 남은 초소 — 이제 마을 한가운데에 있다 — 의 빈 탁자에 앉는다. 창백이 스스로 희미하게 빛나며 사방을 비춘다.',
  '몽당연필과 보고서 양식. 「국가보위성 13국 귀중.」',
  G.flags.draft ? '첫날 밤 네가 쓴 초안이 옆에 있다. 줄 그어진 진실과 줄 그어진 거짓.' : '',
  G.flags.logbook ? '오영희의 기록부. 숫자 대신 이름이 적힌.' : '',
  G.names.length ? `수첩에는 기억한 이름이 ${G.names.length}개.` : '수첩은 비어 있다.',
  G.flags.choi_cosign ? '최경철이 맞은편에 앉아 있다. 하얀 손으로 펜을 쥐고, 네가 쓰기를 기다린다.' :
  G.flags.truck_offer ? '멀리서 트럭 엔진 소리. 최경철이 기다리고 있다. 그의 보고서는 이미 써져 있다. 서명란만 비어 있다.' : '',
  '@logic: 이 문서는 평양으로 간다. 평양에서 읽힌다. 그리고 그 내용대로 세상이 정해진다. 공화국에서는 늘 그래왔다.',
  '@baekdu: 아니면 아무도 안 읽을 수도 있지. 평양도 하얘지고 있다면. 그래도 쓰는 거야. 누구를 위해서?',
], options:[
  {t:'「미제의 기상침략 무기로 판단됨. 단호한 대응을 요청함.」', go:'rep_lie'},
  {t:'최경철과 함께 진실을 쓰고, 둘이 서명한다.', go:'rep_truth', req:['choi_cosign']},
  {t:'「창백은 무기가 아님. 반복된 거짓부터 지우고, 불린 이름 앞에서 멈춤.」', check:{s:'volition', dc:12, red:true}, ok:'rep_truth', no:'finale_shaken', cond:G=>G.flags.log_truth||G.flags.names_resist||G.flags.both_sides, not:['shaken','choi_cosign']},
  {t:'최경철의 보고서에 서명하고, 남쪽으로 가는 트럭에 오른다.', go:'rep_truck', req:['truck_offer'], not:['choi_cosign']},
  {t:'보고서 대신, 기억한 모든 이름을 적는다.', go:'rep_names', cond:G=>G.names.length>=6 || (G.flags.th_names && G.names.length>=4)},

// ===== 보관 중인 결말 (아직 연결하지 않음 — 7일째 최종 결말을 정할 때 다시 쓴다) =====
end_lie:{scene:'결말 — 표창', ending:true, text:G=>[
  '너는 쓴다. 공화국의 문장으로. 매끄럽고, 확신에 차 있고, 한 글자도 틀리지 않게.',
  G.flags.rally_lie ? '궐기대회에서 읽었던 원고와 거의 같은 문장이다. 쓰는 동안 그날 사라진 노파의 얼굴이 떠오르려 하다가, 떠오르지 않는다.' : '',
  '보고서는 다음 날 새벽 연락병의 손에 들려 남쪽 길로 떠난다. 연락병은 돌아오지 않는다. 보고서가 평양에 닿았는지는 아무도 모른다.',
  '그날 밤 창백은 광장의 나머지 절반을 넘었다. 다음 날은 초대소를. 인민반 명단이, 초상화의 금테가, 사람들이 하얘졌다.',
  G.flags.village_names ? '이름을 적은 문들만 한동안 버텼다. 문 하나, 문 둘. 그러나 보고서의 거짓이 마을 한가운데 놓여 있었고, 창백은 거기서부터 먹어 들어갔다.' : '',
  G.flags.lies_feed ? '@jangmadang: 고양이가 말했잖아. 거짓말부터 먹는다고. 넌 방금 그것에게 잔칫상을 차려줬어.' : '@baekdu: 거짓말은 가장 하얀 것이야. 넌 그걸 몰랐어?',
  '몇 달 후 — 아니면 몇 년 후, 창백 안에서는 알 수 없다 — 평양에서 훈장 증서가 왔다. 수여자 성명 칸은 비어 있었다. 받을 사람도 없었다.',
  '— 결말: 공화국 영웅 (이름 없음) —',
]},
end_truth:{scene:'결말 — 기록', ending:true, text:G=>[
  '너는 쓴다. 떨리는 손으로, 그러나 멈추지 않고. 기압이 없다는 것. 양쪽 강둑에 같은 것이 있다는 것. 구호부터, 초상화부터 하얘진 순서. 불린 이름 앞에서 멈추는 경계.',
  G.flags.choi_cosign ? '마지막 줄 아래, 두 개의 서명. 13국 소좌와 검열국 중좌. 최경철의 서명은 "최경"에서 끊겨 있다. 그는 그 옆에 덧붙인다. 「— 최은별의 아버지.」' : '',
  G.names.length ? `부록으로 이름 ${G.names.length}개를 붙인다. ${G.names.join(', ')}.` : '',
  '문장을 하나 쓸 때마다 창백이 한 뼘씩 물러나는 것 같다. 마지막 줄을 쓰고 고개를 들었을 때, 강 건너에 불빛 하나가 보인다. 단둥의 불빛. 사흘 만에 처음으로.',
  G.flags.village_names ? '마을 쪽에서도, 이름이 적힌 문마다 불이 켜진다.' : '',
  G.flags.myeongsu_remember || G.flags.myeongsu_back ? '박순녀의 집. 명수가 마당을 쓸고 있다. 어머니의 빗자루로.' : '',
  G.flags.oh_saved ? '오영희가 마을 공회당에 앉아 새 기록부를 펼친다. 첫 줄: 「관측 결과: 맑음. 이것은 정말 맑음.」' : G.flags.oh_stays ? '관측소 언덕은 아직 하얗다. 하지만 백엽상 문이 열려 있다. 누군가 안에서 계속 기록하고 있는 것처럼.' : '',
  '보고서는 다음 날 떠난다. 남쪽 길은 이제 하얗지 않다. 열흘 후 평양에서 너를 소환하는 명령이 온다. 너는 그것이 무슨 뜻인지 안다. 13국에서 너도 같은 명령서를 수백 번 썼다.',
  G.flags.heard_self ? '트럭에 오르기 전 신분증을 꺼낸다. 이름 칸에 첫 글자가 돌아와 있다. 「한」. 어머니가 지어준 이름의 첫 글자. 나머지는 평양까지 가는 길에 기억해 내면 된다.' :
  '트럭에 오르기 전, 너는 신분증을 꺼낸다. 이름 칸에 희미하게 — 아주 희미하게 — 잉크가 돌아와 있다. 첫 글자만. 그거면 충분하다.',
  '— 결말: 기록하는 자 —',
]},
end_walk:{scene:'결말 — 창백', ending:true, text:G=>[
  '너는 일어선다. 하얀 면 속으로. 아무것도 아닌 것 속으로.',
  '창백 안에서 모든 것이 동시에 있다. 1994년의 방송. 1997년의 함흥역. 첫날 밤의 농태기. 네가 지운 이름들, 네가 서명한 명령서들, 국경을 넘다 잡혀온 사람들의 얼굴.',
  G.names.includes('은실') ? '그리고 함흥역 대합실에, 열두 살 소녀가 앉아 있다. 은실이. 그 아이가 손을 흔든다. 배고프다는 말은 하지 않는다.' : '',
  G.flags.cat_helped || G.flags.cat_released ? '저 멀리 강 한가운데, 손전등 불빛 하나. 설화다. 그녀 옆에 중년 여자 하나. 이모. 설화가 너를 보고 외친다. "보위원! 여기도 사람 있어!"' :
  G.flags.saw_other ? '강 저편에서 걸어오는 중국 병사. 너희는 강 한가운데서 만난다. 언어가 없는 곳에서. 그가 담배를 권한다. 너는 받는다.' : '그리고 아무도 없다. 너는 혼자다. 그것이 생각보다 무섭지 않다.',
  '국경은 여기서 끝난다. 아니, 처음부터 여기에는 없었다.',
  '— 결말: 국경 없음 —',
]},
end_names:{scene:'결말 — 명부', ending:true, text:G=>[
  '너는 보고서 양식을 뒤집는다. 뒷면은 비어 있다. 그리고 쓴다. 보고서가 아니라 명부를.',
  `${G.names.join('. ')}.`,
  '하나를 쓸 때마다 그 사람의 얼굴이 떠오른다. 본 적 없는 얼굴까지. 다리를 저는 소년. 두부를 잘 만들던 할머니. 단추 하나 달린 외투.',
  '양식 뒷면이 다 차자 너는 초소 벽에 쓴다. 벽이 차자 바닥에. 마을 사람들이 와서 숯을 집어 든다. 그들도 쓴다. 자기가 기억하는 이름을. 1997년의 이름을. 오늘 아침의 이름을.',
  '새벽이 왔을 때, 초소 주변 백 걸음 안의 모든 표면이 이름으로 덮여 있다. 창백은 그 경계에서 멈춰 있다. 물러나지도, 들어오지도 않는다. 읽고 있는 것처럼.',
  '평양에는 아무것도 보내지 않았다. 너는 그것을 후회하지 않는다. 이것은 평양을 위한 문서가 아니었다.',
  '— 비밀 결말: 명부 —',
]},
end_wake:{scene:'결말 — 깨어남', ending:true, text:G=>[
  '연필이 움직인다. 너는 성명 칸에 쓴다. 네 이름을. 기억나지 않던 이름이, 쓰는 순간 기억난다. 아니 — 쓰는 순간 생겨난다.',
  G.flags.heard_self ? '첫 글자는 「한」. 라디오 속 네가 말했던. 나머지 글자는 네가 직접 짓는다.' : '',
  '@baekdu: 국가가 꾸던 꿈이 스스로 이름을 지었어. 이건 반역이야. 가장 아름다운 반역.',
  '창백이 숨을 멈춘다. 그것은 너를 본다. 이름을 가진 것을. 그리고 처음으로, 그것이 망설인다.',
  '너는 보고서를 쓰지 않는다. 대신 마을로 내려가 인민반 명단을 펼치고, 하얘진 이름들을 기억나는 대로 — 박순녀에게 묻고, 오영희에게 묻고, 묘지의 노인에게 묻고 — 다시 쓴다. 볼펜 홈을 따라, 한 글자씩.',
  '창백은 아직 강에 있다. 하지만 이 마을에는 이제 이름이 있다.',
  '— 비밀 결말: 이름을 쓰는 자 —',
]},

rep_lie:{scene:'밤의 압록강', on:{ws:-4, flag:['report_done','report_lie'], thought:'hero_blank'}, text:G=>[
  '너는 쓴다. 공화국의 문장으로. 매끄럽고, 확신에 차 있고, 한 글자도 틀리지 않게. 「미제의 기상침략 무기로 판단됨. 단호한 대응을 요청함.」',

rep_truck:{scene:'밤의 압록강', on:{ws:-4, flag:['report_done','report_lie','report_truck','choi_with'], thought:'trust_map'}, text:[

  '트럭이 출발한다. 짐칸에 너, 운전석에 최경철. 이십 리. 길이 하얘진다. "지도대로 가라." 삼십 리. 길이 없다.',
  '운전병이 브레이크를 밟는다. 앞에 아무것도 없다. 하얀 면뿐. 트럭은 한참을 서 있다가, 천천히 후진한다.',

], options:[{t:'청수리로 돌아간다.', go:'night3'}]},
rep_truth:{scene:'밤의 압록강', on:{ws:3, flag:['report_done','report_truth'], thought:'weight_record'}, text:G=>[
  '너는 쓴다. 떨리는 손으로, 그러나 멈추지 않고. 기압이 없다는 것. 양쪽 강둑에 같은 것이 있다는 것. 구호부터, 초상화부터 하얘진 순서. 불린 이름 앞에서 멈추는 경계.',
  G.flags.choi_cosign ? '마지막 줄 아래, 두 개의 서명. 최경철의 서명은 "최경"에서 끊겨 있다. 그는 그 옆에 덧붙인다. 「— 최은별의 아버지.」' : '',
  '문장을 하나 쓸 때마다 창백이 한 뼘씩 물러나는 것 같다. 아니면 그렇게 믿고 싶은 것이다.',

rep_names:{scene:'밤의 압록강', on:{ws:4, flag:['report_done','report_names'], thought:'grammar_names'}, text:G=>[

  `${G.names.join('. ')}.`,
  '양식 뒷면이 다 차자 초소 벽에 쓴다. 마을 사람 몇이 와서 숯을 집어 든다. 그들도 쓴다.',

], options:[{t:'숯을 내려놓는다.', go:'night3', fx:G=>G.flags.choi_ally ? {flag:'choi_with'} : null}]},
rep_wake:{scene:'밤의 압록강', on:{ws:3, flag:['report_done','report_wake'], thought:'named_one'}, text:G=>[
  '연필이 움직인다. 너는 성명 칸에 쓴다. 네 이름을. 기억나지 않던 이름이, 쓰는 순간 생겨난다.',

  '너는 연필을 내려놓고 일어선다. 철조망 사이로, 둑 아래로, 소리 없는 강물 속으로.',

night3:{scene:'청수리 초대소 · 밤', on:{hp:1}, text:G=>[
  '초대소로 돌아온다. 사흘째 밤. 봉투는 아침 연락병에게 넘기기로 되어 있다.',

  '@volition: 사흘의 마감은 끝났다. 이제 무슨 일이 일어나든, 그건 네가 쓴 것의 결과다.',
], options:[{t:'잠든다.', go:'day4_start', fx:{day:4}}]},

// ================= 4일째: 결과의 아침 =================
day4_start:{scene:'청수리 · 4일째 새벽', text:G=>[
  '— 4일째 —',
  G.ws >= 3 ? '창밖이 어둡다. 진짜 어둠이다. 사흘 만에 처음으로 하얗지 않은 새벽.' : '창밖이 하얗다. 새벽인데도. 밤새 무언가가 마을 안쪽으로 걸어 들어왔다.',
  G.ws >= 7 ? '그리고 소리. 강물 소리. 사흘 동안 먹혀 있던 소리가 돌아왔다.' : G.ws <= -3 ? '그리고 침묵. 개 짖는 소리도, 닭 우는 소리도, 확성기의 잔향도 없다.' : '',
], options:[
  {t:'밖으로 나간다.', go:'r4_dawn', cond:G=>G.ws>=3},
