<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>창백한 청수리</title>
<style>
:root{
  --bg:#141312; --panel:#1d1b19; --ink:#e4dccd; --dim:#8f877a; --line:#3a352f;
  --int:#5fb0d0; --psy:#a68be0; --fys:#d0625a; --mot:#d8b54c;
  --pale:#dfe3e3; --red:#b8322a; --ok:#7fbf6a; --npc:#e8c890;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Nanum Myeongjo","Batang","Noto Serif KR",serif;font-size:17px;line-height:1.7}
button{font:inherit;color:inherit;cursor:pointer}
#app{display:grid;grid-template-columns:300px 1fr;height:100vh;max-width:1200px;margin:0 auto}
#side{border-right:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:16px;background:linear-gradient(180deg,#1b1a18,#121110)}
#scene{font-size:24px;letter-spacing:.05em}
#clock{color:var(--dim);font-size:14px}
.bar{display:flex;align-items:center;gap:8px;font-size:14px}
.bar .pips{display:flex;gap:3px}
.pip{width:14px;height:14px;border:1px solid var(--line)}
.pip.on.hp{background:var(--fys)} .pip.on.mo{background:var(--psy)}
.side-btns{display:flex;flex-direction:column;gap:6px;margin-top:auto}
.side-btns button{background:transparent;border:1px solid var(--line);padding:6px 10px;text-align:left}
.side-btns button:hover{border-color:var(--ink)}
#paleMeter{font-size:13px;color:var(--dim)}
#paleMeter b{color:var(--pale)}
#main{display:flex;flex-direction:column;height:100vh;min-width:0}
#log{flex:1;overflow-y:auto;padding:28px 36px 12px}
#log p{margin:0 0 14px}
.narr{color:var(--ink)}
.voice b{letter-spacing:.03em}
.npc b{color:var(--npc)}
.you{color:var(--dim);font-style:italic}
.roll{font-size:14px;color:var(--dim);border-left:2px solid var(--line);padding-left:10px}
.roll.ok b{color:var(--ok)} .roll.no b{color:var(--red)}
.sys{color:var(--pale);font-size:14px;text-align:center;opacity:.8}
.fx{font-size:14px;color:var(--dim)}
#opts{border-top:1px solid var(--line);padding:14px 36px 22px;display:flex;flex-direction:column;gap:6px;max-height:45vh;overflow-y:auto}
#opts button{background:transparent;border:none;text-align:left;padding:4px 0;color:#d9c08a}
#opts button:hover:not(:disabled){color:#fff}
#opts button:disabled{color:var(--dim);cursor:not-allowed}
#opts .n{color:var(--dim);margin-right:8px}
.tag{font-size:14px;padding:0 6px;border:1px solid currentColor;margin-right:6px}
.tag.red{background:rgba(184,50,42,.2)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal.show{display:flex}
.card{background:var(--panel);border:1px solid var(--line);max-width:760px;width:100%;max-height:90vh;overflow-y:auto;padding:24px}
.card h2{margin:0 0 4px;font-weight:normal}
.card h3{margin:18px 0 6px;font-weight:normal;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 20px}
.sk{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:15px;border-bottom:1px solid var(--line);padding:3px 0}
.sk small{display:block;color:var(--dim);font-size:12px;line-height:1.4}
.sk button{border:1px solid var(--line);background:transparent;padding:0 8px}
.arch{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.arch button{background:transparent;border:1px solid var(--line);padding:12px;text-align:left}
.arch button:hover{border-color:var(--ink)}
.arch small{color:var(--dim);display:block;font-size:13px;line-height:1.5}
.thought{border:1px solid var(--line);padding:10px;margin:6px 0;font-size:15px}
.thought small{color:var(--dim)}
.close{float:right;background:transparent;border:1px solid var(--line);padding:2px 10px}
@media (max-width:760px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto;min-height:100vh}
  #side{border-right:none;border-bottom:1px solid var(--line);padding:12px 16px;flex-direction:row;flex-wrap:wrap;gap:8px 16px;align-items:center}
  #scene{font-size:19px}
  .side-btns{flex-direction:row;flex-wrap:wrap;margin-top:0;width:100%}
  #main{height:auto;min-height:80vh}
  #log{padding:16px}
  #opts{padding:12px 16px 18px;max-height:none}
  .grid,.arch{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div>
      <div id="scene">—</div>
      <div id="clock"></div>
    </div>
    <div class="bar"><span>체력</span><span class="pips" id="hp"></span></div>
    <div class="bar"><span>사기</span><span class="pips" id="mo"></span></div>
    <div id="paleMeter"></div>
    <div class="side-btns">
      <button onclick="openSheet()">인물 · 기술 <span id="spBadge"></span></button>
      <button onclick="openThoughts()">사상함 <span id="thBadge"></span></button>
      <button onclick="saveGame()">저장</button>
      <button onclick="loadGame()">불러오기</button>
      <button onclick="openStart()">새 게임</button>
    </div>
  </aside>
  <main id="main">
    <div id="log"></div>
    <div id="opts"></div>
  </main>
</div>
<div class="modal" id="modal"><div class="card" id="card"></div></div>

<!-- ============================================================
     세계 데이터: 속성 · 기술 · 출신 · 사상
     ============================================================ -->
<script>
const ATTRS = {
  int:{name:'사상', color:'var(--int)'},
  psy:{name:'정신', color:'var(--psy)'},
  fys:{name:'육체', color:'var(--fys)'},
  mot:{name:'동작', color:'var(--mot)'},
};
const SKILLS = {
  logic:   {name:'주체논리',   attr:'int', desc:'모든 것은 설명될 수 있다. 수령의 교시로.'},
  rhet:    {name:'웅변',       attr:'int', desc:'구호로 사람을 움직이고, 구호로 사람을 멈춘다.'},
  history: {name:'당력사',     attr:'int', desc:'모든 날짜, 모든 교시, 모든 숙청을 기억한다.'},
  volition:{name:'자아비판',   attr:'psy', desc:'너를 붙잡아 두는 목소리. 생활총화의 기술.'},
  baekdu:  {name:'내면의 백두', attr:'psy', desc:'혁명전설이 속삭인다. 소나무가, 눈보라가, 초상화가.'},
  empathy: {name:'인민감정',   attr:'psy', desc:'굶주린 얼굴 뒤의 마음을 읽는다.'},
  stomach: {name:'강냉이 위장', attr:'fys', desc:'버티는 몸. 풀죽과 농태기를 견딘다.'},
  march:   {name:'고난의 행군', attr:'fys', desc:'고통을 기억하는 몸. 1996년을 잊지 않았다.'},
  jangmadang:{name:'장마당 본능',attr:'fys', desc:'담배, 술, 중국산 무엇이든. 욕망의 냄새를 맡는다.'},
  eye:     {name:'보위원의 눈', attr:'mot', desc:'누가 거짓말하는지, 무엇이 사라졌는지 본다.'},
  hands:   {name:'손재주',     attr:'mot', desc:'자물쇠, 라디오, 중국 손전화.'},
  composure:{name:'평정',      attr:'mot', desc:'표정을 지키는 기술. 동요는 반동의 시작이다.'},
};
const ARCHETYPES = [
  {id:'ideo', name:'사상 일꾼', attrs:{int:4,psy:3,fys:1,mot:2}, desc:'정치대학 출신. 논리와 구호로 무장했다. 몸은 약하다.'},
  {id:'feel', name:'감성 보위원', attrs:{int:2,psy:4,fys:2,mot:2}, desc:'사람의 마음과 혁명전설의 목소리를 듣는다. 너무 잘 듣는다.'},
  {id:'body', name:'제대 군관', attrs:{int:1,psy:2,fys:4,mot:3}, desc:'인민군 10년. 고난의 행군을 몸으로 넘었다.'},
  {id:'eye',  name:'현장 수사관', attrs:{int:2,psy:2,fys:2,mot:4}, desc:'장마당과 국경을 30년 지켜봤다. 아무것도 놓치지 않는다.'},
];
// 사상함: 내면화하면 기술 보너스와 플래그를 준다.
const THOUGHTS = {
  reaction:{name:'창백은 반동인가', time:5,
    q:'수령님의 초상화마저 바래게 하는 것. 그것은 적인가, 아니면 그냥… 날씨인가?',
    a:'창백은 계급이 없다. 그것은 미제도 아니고 우리도 아니다. 너는 그것을 적으로 부르기를 그만둔다.',
    bonus:{logic:1, rhet:-1}, flag:'th_reaction'},
  ration:{name:'배급표의 형이상학', time:6,
    q:'1997년, 배급표에는 쌀이 적혀 있었지만 쌀은 없었다. 종이가 거짓이면, 무엇이 남는가?',
    a:'이름만 남고 실체가 빠진 것들. 창백은 그런 것들부터 먹는다. 너는 이제 그것을 본다.',
    bonus:{empathy:1, march:1, composure:-1}, flag:'th_ration'},
  dream:{name:'나는 누구의 꿈인가', time:7,
    q:'신분증의 이름이 지워졌다. 그럼 너는 누구지? 혹시 처음부터 아무도 아니었던 건?',
    a:'너는 국가가 꾸는 꿈이다. 국가가 잠에서 깬다면 너도 사라진다. 아니면… 네가 먼저 깨어날 수도 있다.',
    bonus:{baekdu:2, volition:-1}, flag:'th_dream'},
};
const DIFF = {6:'사소함', 8:'쉬움', 10:'보통', 12:'도전적', 14:'어려움', 16:'극한'};
</script>

<!-- ============================================================
     시나리오: 창백한 청수리
     텍스트 규칙:  "@기술키: 대사" = 기술의 목소리,  "#이름: 대사" = 인물,  그 외 = 서술
     선택지: {t, go} | {t, check:{s,dc,red}, ok, no}  + req/not(플래그 배열), fx(효과), once
     효과(fx/on): {flag, unflag, hp, morale, sp, thought, pale}
     ============================================================ -->
<script>
const STORY = {
start:{scene:'어둠', text:[
  '어둠. 끝없는, 따뜻한 어둠.',
  '그리고 — 확성기.',
  '#확성기: …위대한 수령님과 장군님의 유훈을 받들어, 오늘도 온 인민은 일떠서자! 일떠서자! 일떠서…',
  '@volition: 일어나야 한다, 동무. 지금 누워 있는 것은 생활총화에서 세 번은 비판받을 일이다.',
  '@baekdu: 아니면 계속 누워 있어도 돼. 바깥은 하얗거든. 아주, 아주 하얗거든.',
], options:[
  {t:'눈을 뜬다.', go:'room'},
  {t:'[계속 잔다]', go:'sleep'},
]},
sleep:{scene:'어둠', on:{morale:-1}, text:[
  '너는 더 깊이 가라앉는다. 확성기 소리가 멀어진다. 그 아래, 아주 오래된 방송이 들린다. 1994년 여름, 떨리는 아나운서의 목소리.',
  '@baekdu: 들리지? 시간이 새고 있어. 어딘가에 구멍이 났어.',
  '@volition: 그만. 일어나. 당장.',
], options:[{t:'억지로 눈을 뜬다.', go:'room'}]},

room:{scene:'청수리 초대소', text:G=>[
  G.visited.room>1 ? '초대소 방. 곰팡이 냄새와 석탄 냄새.' :
  '량강도 백수군 청수리 초대소. 얇은 이불, 꺼진 석탄난로, 바닥에 굴러다니는 농태기 빈 병 두 개. 머리가 깨질 것 같다.',
  '벽에는 두 개의 초상화가 걸려 있다. 그런데 — 얼굴이 없다. 액자 안이 우유처럼 하얗다.',
], passives:[
  {s:'stomach', dc:8, t:'속이 뒤집힌다. 어젯밤 마신 건 옥수수 농태기 — 적어도 한 병 반. 누구와 마셨지?'},
  {s:'eye', dc:12, t:'창문 너머가 이상하게 밝다. 해가 뜬 밝기가 아니다. 종이의 밝기다.'},
], options:[
  {t:'초상화를 살펴본다.', go:'portrait'},
  {t:'신분증과 서류를 찾는다.', check:{s:'eye', dc:8}, ok:'idcard', no:'idcard_fail', req:[], not:['has_orders']},
  {t:'깨진 거울을 들여다본다.', go:'mirror', not:['saw_mirror']},
  {t:'밖으로 나간다.', go:'square'},
]},
portrait:{scene:'청수리 초대소', text:[
  '가까이서 보니 초상화는 찢기거나 더럽혀진 게 아니다. 색이 빠졌다. 금테 액자와 유리는 그대로인데, 그 안의 얼굴만 눈 내린 들판이 되었다.',
], passives:[
  {s:'baekdu', dc:8, t:'그분들은 지워진 게 아니야. 너를 보지 않기로 한 거지. 처음으로.'},
  {s:'history', dc:10, t:'초상화 훼손은 최고 존엄 모독이다. 발견 즉시 보고하지 않은 자도 같은 죄. 너는 지금 몇 분째 보고하지 않고 있다.'},
], options:[
  {t:'"이건… 보지 않은 것이다." 시선을 돌린다.', check:{s:'volition', dc:8}, ok:'portrait_ignore', no:'portrait_panic'},
  {t:'손수건으로 유리를 닦아본다.', go:'portrait_wipe', not:['pale_touch']},
  {t:'물러난다.', go:'room'},
]},
portrait_ignore:{scene:'청수리 초대소', on:{morale:1}, text:[
  '너는 정확하게, 군대식으로 돌아선다. 보지 않은 것은 보고할 필요가 없다. 이것이 공화국에서 30년을 살아남은 기술이다.',
  '@volition: 잘했다. 하지만 기억해 둬. 보지 않기로 한 것들이 쌓이면, 그것도 하얘진다.',
], options:[{t:'방으로.', go:'room'}]},
portrait_panic:{scene:'청수리 초대소', on:{morale:-1}, text:[
  '너는 시선을 돌리려 하지만 하얀 얼굴이 눈꺼풀 안쪽에 남는다. 심장이 뛴다. 누가 이 방에 들어오면? 누가 이걸 보면?',
  '@composure: 숨 쉬어. 표정. 표정을 지켜.',
], options:[{t:'방으로.', go:'room'}]},
portrait_wipe:{scene:'청수리 초대소', on:{flag:'pale_touch', hp:-1, thought:'reaction', pale:1}, text:[
  '손수건이 유리에 닿는 순간 — 차갑다. 얼음이 아니라, 아무것도 아닌 것의 차가움.',
  '손수건을 떼어보니 검지 끝이 하얗다. 지문이 없다. 마치 원래 없었던 것처럼.',
  '@march: 아프지 않다. 그게 더 나쁘다. 고통은 적어도 네가 여기 있다는 증거니까.',
  '@logic: 액자 안의 현상이 액자 밖으로 전이되었다. 이것은 기상현상이 아니다.',
], options:[{t:'손을 주머니에 넣고 물러난다.', go:'room'}]},
idcard:{scene:'청수리 초대소', on:{flag:'has_orders', sp:1}, text:[
  '군복 안주머니. 붉은 수첩. 국가보위성 신분증.',
  '계급: 소좌. 소속: 국가보위성 13국. 성명: ',
  '이름 칸이 하얗다. 잉크가 번진 게 아니다. 그 자리에 처음부터 아무것도 쓰인 적 없는 것처럼.',
  '수첩 사이에 지령서가 끼워져 있다: 「청수리 기상관측소 보고 이상현상 조사. 국경 경비 상황 확인. 3일 내 평양에 보고할 것. — 미제의 기상침략 무기 여부를 규명하라.」',
  '@logic: 결론이 이미 지령서에 적혀 있다. 조사는 형식이다. 아니면, 형식이어야 했다.',
  '@baekdu: 이름이 없어진 사람에게 보고서를 쓰라고? 재밌지 않아?',
], options:[{t:'수첩을 챙긴다.', go:'room'}]},
idcard_fail:{scene:'청수리 초대소', text:[
  '너는 군복을, 이불을, 가방을 뒤진다. 손이 떨리고 눈앞이 흐리다. 아무것도 없다. 아니면 있는데 못 보는 것이다.',
  '@eye: 침대 아래… 아니, 모르겠다. 머리가 너무 아프다.',
  '@empathy: 인민반장이라면 알 거다. 이런 마을에서는 인민반장이 모든 걸 안다.',
], options:[{t:'포기한다.', go:'room'}]},
mirror:{scene:'청수리 초대소', on:{flag:'saw_mirror'}, text:[
  '금 간 거울 속에 남자가 있다. 마흔다섯쯤. 광대뼈, 면도하지 않은 턱, 충혈된 눈. 왼쪽 가슴의 수령님 배지는… 하얗다.',
  '@composure: 이것이 공화국 보위원의 얼굴이다. 적어도 그래야 한다.',
], options:[
  {t:'거울 속 자신에게 말한다. "동무는 조국이 선택한 사람이다."', check:{s:'rhet', dc:10}, ok:'mirror_ok', no:'mirror_no'},
  {t:'그냥 돌아선다.', go:'room'},
]},
mirror_ok:{scene:'청수리 초대소', on:{morale:1}, text:[
  '목소리가 단단하게 나온다. 거울 속 남자가 등을 편다. 그래. 너는 선택받았다. 무엇에 의해서든.',
], options:[{t:'방으로.', go:'room'}]},
mirror_no:{scene:'청수리 초대소', on:{morale:-1}, text:[
  '"동무는… 조국이…" 목소리가 갈라진다. 거울 속 남자가 너를 불쌍하다는 듯 본다. 그가 먼저 눈을 돌린다.',
], options:[{t:'방으로.', go:'room'}]},

square:{scene:'청수리 광장', text:G=>[
  G.visited.square>1 ? '광장. 확성기는 쉬지 않는다.' :
  '광장이라고 부르기엔 작은 흙바닥. 김치움 몇 개, 문 닫힌 상점, 「위대한 수령님과 장군님은 영원히 우리와 함께 계신다」 구호판. 구호판의 글자 몇 개가 빠져 있다 — "위대한 … 은 영원히 … 계신다."',
  '북쪽 하늘 — 압록강 쪽 — 이 하얗다. 안개가 아니다. 눈도 아니다. 세상이 거기서 끝난다.',
  '#확성기: …미제와 남조선 괴뢰의 비렬한 기상침략 책동을 단호히 짓부시자! 인민들은 강 쪽으로 접근하지 말라…',
  !G.flags.met_park ? '완장을 찬 중년 여인이 빗자루를 들고 너를 노려본다. 인민반장이다.' : '',
], passives:[
  {s:'history', dc:10, t:'구호판에서 빠진 글자는 정확히 존함이다. 창백은 가장 많이 반복된 말부터 먹는 것 같다.'},
  {s:'empathy', dc:8, t:'마을 사람들은 창문 틈으로 너를 본다. 두려움. 하지만 너에 대한 두려움만은 아니다.'},
], options:[
  {t:'인민반장에게 말을 건다.', go:'park'},
  {t:'압록강 둑으로 간다.', go:'river'},
  {t:'기상관측소로 간다.', go:'station', req:['know_station']},
  {t:'장마당 뒷골목으로 간다.', go:'market'},
  {t:'[보고서를 쓸 시간이다. 밤의 강으로 간다.]', go:'finale', req:['visited_station','seen_pale']},
]},

park:{scene:'청수리 광장', on:{flag:'met_park'}, text:G=>[
  G.visited.park>1 ? '#박순녀: 또 무슨 일이십네까, 보위원 동지.' :
  '#박순녀: 보위원 동지! 이제야 일어나셨습네까? 어제 그렇게 취하셔서 관측소 오 동무랑 강가에서 노래를 부르시고… 아이구, 말을 말아야지.',
  G.visited.park>1 ? '' : '그녀의 이름은 박순녀. 인민반장 20년. 완장의 붉은색이 이 마을에서 가장 선명한 색이다.',
], options:[
  {t:'"내가 왜 이 마을에 왔는지 아시오?"', go:'park_why', not:['know_station']},
  {t:'그녀가 숨기는 것이 있다.', check:{s:'empathy', dc:8}, ok:'park_son', no:'park_closed'},
  {t:'"인민반 세대 명단을 넘기시오. 지금."', check:{s:'rhet', dc:12, red:true}, ok:'park_list', no:'park_hostile'},
  {t:'"초상화가… 초대소의 초상화가 하얗소."', go:'park_portrait', req:['pale_touch'], once:true},
  {t:'"그만 가보겠소."', go:'square'},
]},
park_why:{scene:'청수리 광장', on:{flag:'know_station'}, text:[
  '#박순녀: 기상관측소 일 때문에 오셨지요. 오영희 관측원이 평양에 이상한 보고를 올렸다고. 강 너머 중국이 안 보인다고, 기압이 "없다"고. 기압이 없다는 게 말이 됩네까?',
  '#박순녀: 관측소는 마을 동쪽 언덕 위입니다. 오 동무는 거기서 안 내려와요. 담배만 피우고.',
], options:[{t:'"고맙소."', go:'park'}]},
park_son:{scene:'청수리 광장', on:{flag:'know_son', sp:1}, text:[
  '그녀의 손이 빗자루를 너무 꽉 쥐고 있다. 시선이 자꾸 강 쪽으로 간다.',
  '@empathy: 누군가를 기다리고 있다. 아들이다. 확실하다.',
  '#박순녀: …제 아들 명수가 강 초소에 있습네다. 나흘째 교대가 안 왔어요. 집에 안 와요. 밥도 안 먹고 그냥 서 있대요. 동지, 이건 보고하지 마시라요. 우리 명수가 근무 이탈하는 게 아니라, 근무를 너무 해서 그런 거니까.',
], options:[{t:'"알겠소."', go:'park'}]},
park_closed:{scene:'청수리 광장', text:[
  '#박순녀: 숨기긴 뭘 숨깁네까. 인민반장이 보위원 동지한테 뭘 숨기겠습네까.',
  '그녀의 얼굴에 문이 닫힌다. 공화국 사람들이 평생 연습한 표정이다.',
], options:[{t:'물러난다.', go:'park'}]},
park_list:{scene:'청수리 광장', on:{flag:'list', pale:1}, text:[
  '#박순녀: …예, 예. 드리지요.',
  '그녀가 꼬깃꼬깃한 공책을 내민다. 48세대. 너는 넘겨본다. 그리고 멈춘다.',
  '세 세대의 이름이 하얗다. 지워진 게 아니다. 볼펜 자국의 홈만 남고 잉크가 없다. 그 옆에 그녀의 글씨: 「이사 감」, 「이사 감」, 「이사 감」.',
  '#박순녀: 이사 갔습네다. 그렇게 적으라고… 아무도 안 시켰는데, 그렇게 적었습네다.',
  '@logic: 국경 마을에서 무단 이사는 불가능하다. 그들은 이사 간 게 아니다.',
], options:[{t:'공책을 돌려준다.', go:'park'}]},
park_hostile:{scene:'청수리 광장', on:{morale:-1, flag:'park_hostile'}, text:[
  '#박순녀: 명단이요? 동지 신분증부터 보여주시라요. 어제 술 취해서 이름도 못 대시던데.',
  '그녀 뒤로 창문 몇 개가 조용히 닫힌다. 네 권위가 바닥에 떨어지는 소리가 들린다.',
], options:[{t:'물러난다.', go:'park'}]},
park_portrait:{scene:'청수리 광장', text:[
  '그녀의 얼굴에서 핏기가 빠진다. 그리고 그녀는 아무 말 없이 자기 집 쪽을 본다. 열린 문 안쪽, 벽에 걸린 초상화 두 개 — 역시 하얗다.',
  '#박순녀: 마을 집집마다 다 그래요. 사흘 전부터. 아무도 보고 안 했습네다. 보고하면 집집마다 다 끌려가니까. 동지도… 동지도 보고 안 하실 거지요?',
  '@volition: 대답하지 마. 대답하는 순간 공범이다.',
  '@empathy: 대답하지 않는 것도 대답이야.',
], options:[{t:'침묵한다.', go:'park', fx:{flag:'complicit'}}]},

river:{scene:'압록강 둑', on:{flag:'seen_pale', pale:1}, text:G=>[
  G.visited.river>1 ? '강둑. 창백이 어제보다 가까운 것 같다.' :
  '둑 위에 선다. 철조망. 감시초소. 그리고 강.',
  G.visited.river>1 ? '' : '강물은 흐른다. 너는 그것을 본다. 그런데 소리가 없다. 그리고 강의 한가운데부터 — 중국이 있어야 할 곳에 — 아무것도 없다. 하얀 것. 안개처럼 움직이지 않고, 벽처럼 단단하지 않은, 의미가 다 빠져나간 공간.',
  G.visited.river>1 ? '' : '@baekdu: 창백이야. 세상의 가장자리. 기억과 이름이 녹아 흐르는 곳. 그게 왜 하필 여기 나타났을까? 가장 많은 것을 지운 나라에.',
  G.flags.soldier_freed ? '초소는 비어 있다. 명수는 집에 갔다.' : '초소 앞에 어린 하전사 한 명이 총을 메고 강을 향해 서 있다. 그의 군복 끝자락이 반쯤 투명하다.',
], passives:[
  {s:'eye', dc:8, t:'강물 소리가 들리지 않는다. 물은 흐르는데. 소리가 먼저 먹혔다.'},
  {s:'logic', dc:10, t:'이것은 기상현상이 아니다. 기상현상에는 날씨가 있어야 한다. 이건 날씨가 없다. 기압이 없다는 보고는 정확했다.'},
  {s:'march', dc:12, t:'이 냄새. 아니, 냄새가 없음. 1997년 겨울, 배고픔이 극에 달하면 세상이 이렇게 하얘졌었다.'},
], options:[
  {t:'하전사에게 말을 건다.', go:'soldier', not:['soldier_freed']},
  {t:'창백에 손을 넣어본다.', check:{s:'march', dc:10, red:true}, ok:'pale_hand_ok', no:'pale_hand_no'},
  {t:'창백을 정면으로 응시한다.', check:{s:'baekdu', dc:12}, ok:'pale_gaze_ok', no:'pale_gaze_no', req:['th_dream']},
  {t:'마을로 돌아간다.', go:'square'},
]},
soldier:{scene:'압록강 초소', text:G=>[
  '#하전사: 초…초소 근무 중입니다! 정명수 하전사! 교대가 안 옵니다. 며칠째인지 모르겠습니다.',
  '그의 눈은 창백에서 떨어지지 않는다. 입술이 갈라져 있다. 그는 먹지도 자지도 않은 것 같다. 아니면 그럴 필요가 없어졌거나.',
  G.flags.pale_touch ? '@march: 그의 손가락 끝도 너처럼 하얗다. 하지만 그의 것은 손목까지 올라왔다.' : '',
], options:[
  {t:'"강 건너에 뭐가 보이나?"', go:'soldier_see'},
  {t:'"보위원으로서 명령한다. 근무를 해제하고 집에 가라."', check:{s:'rhet', dc:10}, ok:'soldier_free', no:'soldier_refuse'},
  {t:'"어머니가 기다리신다, 명수."', go:'soldier_mother', req:['know_son']},
  {t:'물러난다.', go:'river'},
]},
soldier_see:{scene:'압록강 초소', text:[
  '#정명수: 중국이 안 보입니다. 처음엔… 처음엔 다행이라고 생각했습니다. 이제 넘어가는 놈들도 없을 테니까. 근무가 편해지겠다고.',
  '#정명수: 그런데 어제부터는 우리 쪽도 안 보이기 시작했습니다. 뒤를 돌아보면 마을이 흐려요. 그래서 안 돌아봅니다. 앞만 봅니다. 앞을 지키면 뒤는 있을 거 같아서.',
  '@empathy: 이 아이는 국경이 되어가고 있다. 아무도 넘지 못하게, 자기 자신도.',
], options:[{t:'…', go:'soldier'}]},
soldier_free:{scene:'압록강 초소', on:{flag:'soldier_freed', sp:1}, text:[
  '네 목소리가 공화국의 목소리로 나온다. 쇠처럼, 확성기처럼.',
  '#정명수: …알겠습니다! 근무 해제!',
  '그는 경례하고, 비틀거리며, 마을 쪽으로 돌아선다. 몇 걸음 후 그는 무릎을 꿇고 토한다. 그리고 다시 일어나 걷는다. 군복 끝자락에 색이 조금 돌아온 것 같다.',
], options:[{t:'그를 보낸다.', go:'river'}]},
soldier_refuse:{scene:'압록강 초소', on:{morale:-1}, text:[
  '#정명수: 명령서… 명령서 없이는 초소를 떠날 수 없습니다. 죄송합니다. 동지 이름이 뭡니까? 이름을 대주시면…',
  '너는 입을 연다. 아무것도 나오지 않는다.',
], options:[{t:'물러난다.', go:'soldier'}]},
soldier_mother:{scene:'압록강 초소', on:{flag:'soldier_freed', morale:2}, text:[
  '그의 어깨가 흔들린다. 총이 내려간다.',
  '#정명수: 어머니가… 우리 어머니가 아직 거기 있습니까? 마을이 아직 있습니까?',
  '"있다. 빗자루를 들고 있다."',
  '그는 운다. 열아홉 살처럼, 아니 아홉 살처럼 운다. 그리고 처음으로 뒤를 돌아본다. 마을이 거기 있다. 그는 달려간다.',
  '@empathy: 이름을 불러주는 것. 창백에 맞서는 방법이 그것일지도 모른다.',
], options:[{t:'강가에 혼자 남는다.', go:'river'}]},
pale_hand_ok:{scene:'창백의 가장자리', on:{thought:'ration', sp:1, pale:1}, text:[
  '손을 넣는다. 아무 감각이 없다. 그리고 — 1997년.',
  '너는 열여섯 살이다. 함흥역 대합실. 꽃제비 아이들. 한 아이가 네 배급표를 훔쳐가고, 너는 쫓아가지 않는다. 배급표로 받을 쌀이 없다는 걸 둘 다 알기 때문이다.',
  '@march: 기억해 냈다. 그해 너는 아무것도 먹지 못했고, 그래도 살았다. 고통은 사라지지 않는다. 그것이 고통의 좋은 점이다.',
  '너는 손을 뺀다. 손은 그대로다. 하지만 머릿속에 하나의 생각이 남았다.',
], options:[{t:'물러난다.', go:'river'}]},
pale_hand_no:{scene:'창백의 가장자리', on:{hp:-2, pale:1}, text:[
  '손을 넣는다. 그리고 너는 잊는다. 네 어머니의 얼굴. 네 첫 근무지. 네가 좋아하던 노래. 하나씩, 연필 자국처럼.',
  '너는 비명을 지르며 손을 빼낸다. 몇 개는 돌아오고, 몇 개는 돌아오지 않는다. 어떤 게 돌아오지 않았는지는 모른다. 그게 창백이다.',
], options:[{t:'비틀거리며 물러난다.', go:'river'}]},
pale_gaze_ok:{scene:'창백의 가장자리', on:{flag:'saw_other', pale:1}, text:[
  '너는 본다. 하얀 것의 안쪽을. 거기에도 누군가 서 있다. 강의 저쪽 편 둑에. 중국 군복을 입은 젊은 병사가, 똑같이 반쯤 투명해진 채, 너를 — 아니, 창백을 — 응시하고 있다.',
  '@baekdu: 저쪽에서도 이게 우리의 무기라고 생각해. 그리고 저쪽에서도, 아무도 보고하지 않아.',
], options:[{t:'시선을 거둔다.', go:'river'}]},
pale_gaze_no:{scene:'창백의 가장자리', on:{morale:-2}, text:[
  '너는 응시한다. 창백도 너를 응시한다. 그리고 너는 깨닫는다. 너를 들여다보는 쪽에 비해, 너는 너무 작다.',
], options:[{t:'눈을 감는다.', go:'river'}]},

station:{scene:'기상관측소', on:{flag:'visited_station'}, text:G=>[
  G.visited.station>1 ? '관측소. 담배 연기와 라디오 잡음.' :
  '언덕 위의 콘크리트 건물. 백엽상, 풍향계, 녹슨 안테나. 안에는 담배 연기가 구름처럼 차 있고, 그 속에 쉰 살쯤의 여자가 앉아 있다. 관측원 오영희.',
  G.visited.station>1 ? '' : '#오영희: 일어나셨구만. 해장은 했어요? 아니지, 해장할 게 없지. 이 마을엔.',
  '구석의 낡은 라디오에서 무언가 흘러나온다. 지금 방송이 아니다. 아나운서의 억양이 30년 전 것이다.',
], passives:[
  {s:'hands', dc:8, t:'라디오는 전원 코드가 뽑혀 있다. 그래도 소리가 난다.'},
  {s:'jangmadang', dc:10, t:'그녀가 피우는 건 "7.27"이 아니다. 중국산 "홍타산". 밀수품이다. 어디서 났을까?'},
], options:[
  {t:'관측 기록부를 본다.', check:{s:'logic', dc:12}, ok:'log_ok', no:'log_no'},
  {t:'라디오에 귀를 기울인다.', check:{s:'baekdu', dc:10}, ok:'radio_ok', no:'radio_no'},
  {t:'"어젯밤 내가 무슨 말을 했소?"', go:'oh_lastnight'},
  {t:'"담배 한 대 주시오."', check:{s:'jangmadang', dc:8}, ok:'oh_smoke', no:'oh_smoke_no'},
  {t:'마을로 내려간다.', go:'square'},
]},
log_ok:{scene:'기상관측소', on:{flag:'log_truth', sp:1}, text:[
  '숫자들. 기온, 기압, 풍속, 습도. 사흘 전부터 기압 칸에 "—". 그리고 그 다음 날부터 기온 칸도 "—". 그리고 마지막 줄, 오영희의 글씨:',
  '「관측 불가. 관측 대상 불가. 관측자 불가.」',
  '그 아래, 날짜가 적혀 있다. 모레의 날짜다.',
  '@logic: 그녀는 미래의 기록을 미리 적었다. 아니면 창백 안에서는 순서가 의미가 없다. 어느 쪽이든, 이 기록은 미제의 무기를 증명하지 않는다. 이것은 무기가 아니다. 이것은 끝이다. 아니면 시작.',
], options:[{t:'기록부를 덮는다.', go:'station'}]},
log_no:{scene:'기상관측소', text:[
  '숫자들이 헤엄친다. 머리가 아프다. 어쩌면 농태기 때문이고, 어쩌면 숫자들이 정말로 움직이고 있기 때문이다.',
], options:[{t:'포기한다.', go:'station'}]},
radio_ok:{scene:'기상관측소', on:{thought:'dream', pale:1}, text:[
  '잡음 사이로 목소리가 선명해진다. 아나운서가 너에게 직접 말한다.',
  '#라디오: …보위원 동무. 동무는 1996년 겨울 함경북도에서 이미 한 번 죽었습니다. 동무의 이름은 그때 지워졌습니다. 지금 걷고 있는 것은 국가가 동무를 계속 필요로 했기 때문입니다. 날씨를 알려드리겠습니다. 내일은 하얗겠습니다. 모레도 하얗겠습니다…',
  '@baekdu: 들었지? 이제 알겠어? 너는 이미 창백의 일부였어. 그래서 여기 보내진 거야.',
  '@volition: 라디오는 거짓말을 한다. 라디오는 늘 거짓말을 했다. 그것만은 확실하다.',
], options:[{t:'라디오에서 물러난다.', go:'station'}]},
radio_no:{scene:'기상관측소', on:{morale:-1}, text:[
  '잡음뿐이다. 그런데 그 잡음 속에서 네 이름이 들린 것 같다. 하지만 무슨 이름이었는지 듣지 못했다.',
], options:[{t:'물러난다.', go:'station'}]},
oh_lastnight:{scene:'기상관측소', on:{flag:'draft'}, text:[
  '#오영희: 많은 말을 했지. 평양에서 바라는 대로 "미제의 기상무기"라고 써주면 동지는 승진하고 나는 표창 받는다고. 그런데 그렇게 쓰고 나서 울었어요. 이 종이가 거짓말이면 창백이 더 빨리 온다고.',
  '그녀가 서랍에서 구겨진 종이를 꺼낸다. 네 글씨다. 술 취한 글씨.',
  '「보고서 초안. 창백은 무기가 아니다. 창백은 우리가 지운 모든 것이 돌아오는 것이다. 우리는 너무 많이 지웠다.」',
  '그 아래에 줄이 그어져 있고, 다시 쓰여 있다: 「미제의 기상침략 무기로 판단됨.」 그리고 그 위에 또 줄이.',
  '#오영희: 어느 쪽을 보낼지는 동지가 정해요. 나는 숫자만 적어요. 숫자가 남아 있는 동안은.',
], options:[{t:'초안을 챙긴다.', go:'station'}]},
oh_smoke:{scene:'기상관측소', on:{flag:'know_cat', hp:1}, text:[
  '그녀가 피식 웃으며 홍타산 한 개비를 내민다. 연기가 폐 깊숙이 들어온다. 아, 이 맛. 공화국에서 가장 정직한 것은 밀수 담배다.',
  '@jangmadang: 좋아. 아주 좋아. 이제 좀 사람 같네.',
  '#오영희: 이거 어디서 났는지 묻지 마요. …아니, 물어요. 어차피 다 끝나가는데. 장마당 뒷골목에 "고양이"라는 애가 있어. 중국 손전화를 가지고 있지. 그 애 말로는 강 건너에서도 문자가 온대. 강 건너에서도 하얗대.',
], options:[{t:'연기를 내뿜는다.', go:'station'}]},
oh_smoke_no:{scene:'기상관측소', text:[
  '#오영희: 보위원 동지가 담배를 구걸해요? 이 마을도 진짜 끝났나 보다.',
  '그녀는 담배갑을 서랍에 넣고 잠근다.',
], options:[{t:'헛기침한다.', go:'station'}]},

market:{scene:'장마당 뒷골목', text:G=>[
  '장마당은 닫혀 있다. 단속 때문인지, 창백 때문인지. 뒷골목에는 비닐 천막과 빈 매대만 남았다.',
  G.flags.met_cat ? '고양이가 매대 뒤에 쪼그려 앉아 있다.' : '아무도 없다. 적어도 그렇게 보인다.',
], options:[
  {t:'숨어 있는 사람을 찾는다.', check:{s:'eye', dc:10}, ok:'cat', no:'market_none', not:['met_cat']},
  {t:'"오영희 동무가 보냈소. 고양이 있나?"', go:'cat', req:['know_cat'], not:['met_cat']},
  {t:'고양이에게 말을 건다.', go:'cat', req:['met_cat']},
  {t:'광장으로 돌아간다.', go:'square'},
]},
market_none:{scene:'장마당 뒷골목', text:[
  '천막 사이로 바람이 분다. 어딘가에서 누군가 숨을 참는 소리가 나는 것 같기도 하다. 확실하지 않다.',
], options:[{t:'돌아선다.', go:'market'}]},
cat:{scene:'장마당 뒷골목', on:{flag:'met_cat'}, text:G=>[
  G.visited.cat>1 ? '#고양이: 또 왔네, 보위원.' :
  '매대 아래에서 스무 살쯤 된 여자가 기어 나온다. 짧은 머리, 중국산 패딩, 눈빛이 고양이다.',
  G.visited.cat>1 ? '' : '#고양이: 보위원? 날 잡으러? 잡을 국경이 아직 남아 있나 보지.',
  G.visited.cat>1 ? '' : '그녀가 손전화를 흔든다. 화면에 중국어와 조선어가 섞인 문자. 단둥에 사는 그녀의 이모에게서 온 것이다:',
  G.visited.cat>1 ? '' : '「여기도 하얘. 강 건너가 안 보여. 너희 쪽에서 무슨 폭탄 쏜 거야? 사람들이 다 그렇게 말해. 근데 아무도 신고 안 해.」',
], options:[
  {t:'"양쪽 다 상대가 했다고 생각한다면…"', check:{s:'logic', dc:10}, ok:'cat_both', no:'cat_confused', not:['both_sides']},
  {t:'손전화를 압수한다.', go:'cat_seize', not:['phone']},
  {t:'"농태기 있나? 거래하지."', check:{s:'jangmadang', dc:12, red:true}, ok:'cat_deal', no:'cat_deal_no'},
  {t:'"창백에 대해 아는 걸 말해."', check:{s:'empathy', dc:10}, ok:'cat_talk', no:'cat_shrug'},
  {t:'떠난다.', go:'square'},
]},
cat_both:{scene:'장마당 뒷골목', on:{flag:'both_sides', sp:1}, text:[
  '"…그럼 누구의 무기도 아니다."',
  '고양이가 너를 처음으로 제대로 본다.',
  '#고양이: 보위원 입에서 그런 말이 나오네. 맞아. 저쪽은 우리가 했다 하고, 우리는 미제가 했다 하고. 근데 창백은 국적이 없어. 밀수꾼처럼.',
  '@logic: 지령서의 결론은 틀렸다. 증거가 있다. 다만 그 증거를 쓰는 사람이 살아남을지는 별개의 문제다.',
], options:[{t:'고개를 끄덕인다.', go:'cat'}]},
cat_confused:{scene:'장마당 뒷골목', text:[
  '"…그건 즉 미제가 양쪽 다를 공격했다는…" 말하면서도 무언가 이상하다. 생각이 매듭지어지지 않는다.',
  '#고양이: 보위원 머리는 그렇게밖에 안 돌아가나 봐.',
], options:[{t:'물러난다.', go:'cat'}]},
cat_seize:{scene:'장마당 뒷골목', on:{flag:'phone', morale:-1}, text:[
  '너는 손을 내민다. 그녀는 잠깐 망설이다가 손전화를 건넨다. 그 망설임 안에 네가 이 마을에서 본 모든 체념이 들어 있다.',
  '#고양이: 가져가. 어차피 내일이면 화면도 하얄 거야.',
  '화면 속 마지막 문자: 「살아 있어?」 답장은 없다.',
], options:[{t:'주머니에 넣는다.', go:'cat'}]},
cat_deal:{scene:'장마당 뒷골목', on:{flag:'lies_feed', hp:1, morale:1}, text:[
  '그녀가 웃는다. 매대 밑에서 페트병 하나가 나온다. 투명한 농태기. 너는 한 모금 마신다. 목이 타고, 세상이 잠깐 선명해진다.',
  '@jangmadang: 그래! 이거야! 색이 돌아온다!',
  '#고양이: 하나 알려줄게, 공짜로. 이 마을에서 제일 먼저 하얘진 게 뭔지 알아? 구호판. 그다음은 초상화. 그다음은 배급 장부. 사람은 그다음이야.',
  '#고양이: 창백은 거짓말부터 먹어. 제일 많이 반복된 거짓말부터. 그러니까 보위원, 보고서 쓸 때 조심해.',
], options:[{t:'병을 돌려준다.', go:'cat'}]},
cat_deal_no:{scene:'장마당 뒷골목', on:{hp:-1}, text:[
  '너는 거래를 시도하지만, 네 손이 너무 떨린다. 그녀는 병을 내밀고, 너는 그것을 떨어뜨린다. 바닥에 고인 농태기를 둘 다 바라본다.',
  '#고양이: …보위원 동지, 술 끊으시라요.',
], options:[{t:'창피함을 삼킨다.', go:'cat'}]},
cat_talk:{scene:'장마당 뒷골목', text:[
  '#고양이: 우리 할머니가 그랬어. 고난의 행군 때 사람이 죽으면 이름을 장부에서 지웠대. 배급 하나라도 더 타려면 안 지우는 게 나은데, 위에서 지우라고 했대. 숫자가 맞아야 하니까.',
  '#고양이: 그때 지운 이름이 얼마나 많은데. 그게 다 어디 갔겠어? 나는 그게 돌아오는 거라고 생각해. 이름 없는 채로.',
], options:[{t:'침묵한다.', go:'cat'}]},
cat_shrug:{scene:'장마당 뒷골목', text:[
  '#고양이: 보위원한테 내가 아는 걸 말하는 게 이 나라에서 제일 멍청한 짓이야. 하얘지기 전에도, 하얘진 다음에도.',
], options:[{t:'물러난다.', go:'cat'}]},

finale:{scene:'밤의 압록강', text:G=>[
  '밤. 하지만 강은 어둡지 않다. 창백이 스스로 희미하게 빛난다. 그것은 이제 강을 넘어 둑의 철조망까지 와 있다.',
  '너는 초소의 빈 탁자에 앉는다. 손에는 몽당연필과 보고서 양식. 「국가보위성 13국 귀중.」',
  G.flags.draft ? '어젯밤 네가 쓴 초안이 옆에 있다. 줄 그어진 진실과 줄 그어진 거짓.' : '',
  '@logic: 이 문서는 평양으로 간다. 평양에서 읽힌다. 그리고 그 내용대로 세상이 정해진다. 공화국에서는 늘 그래왔다.',
  '@baekdu: 아니면 아무도 안 읽을 수도 있지. 평양도 하얘지고 있다면.',
], options:[
  {t:'「미제의 기상침략 무기로 판단됨. 단호한 대응을 요청함.」', go:'end_lie'},
  {t:'「창백은 무기가 아님. 우리가 지운 것들이 돌아오는 현상임.」', check:{s:'volition', dc:12, red:true}, ok:'end_truth', no:'finale_shaken', req:['log_truth'], not:['shaken']},
  {t:'「창백은 무기가 아님. 양쪽 모두에 나타남. 국적 없음.」', check:{s:'logic', dc:10, red:true}, ok:'end_truth', no:'finale_shaken', req:['both_sides'], not:['shaken']},
  {t:'연필을 내려놓고, 창백 속으로 걸어간다.', go:'end_walk'},
  {t:'[나는 누구의 꿈인가] 보고서 양식에 네 이름을 쓴다.', go:'end_wake', req:['th_dream']},
]},
finale_shaken:{scene:'밤의 압록강', on:{flag:'shaken', morale:-2}, text:[
  '연필이 종이에 닿는다. 「창백은 무기가—」',
  '손이 멈춘다. 13국 취조실의 냄새가 떠오른다. 네가 직접 앉혀 놓았던 사람들의 얼굴. 그들이 쓰던 자백서. 이제 그 의자에 네가 앉는다.',
  '@volition: 못하겠어. 미안하다. 못하겠어.',
  '연필 끝이 부러진다. 남은 선택지는 많지 않다.',
], options:[
  {t:'「미제의 기상침략 무기로 판단됨.」', go:'end_lie'},
  {t:'창백 속으로 걸어간다.', go:'end_walk'},
]},
end_lie:{scene:'결말 — 표창', ending:true, text:G=>[
  '너는 쓴다. 공화국의 문장으로. 매끄럽고, 확신에 차 있고, 한 글자도 틀리지 않게.',
  '보고서는 다음 날 아침 군용 트럭에 실려 떠난다. 일주일 후 평양에서 회신이 온다: 공화국 영웅 칭호. 수여식 날짜는 미정.',
  '그날 밤 창백은 둑을 넘었다. 그다음 날은 광장을. 구호판이, 확성기가, 인민반 명단이 하얘졌다. 확성기는 하얘진 다음에도 한동안 계속 울렸다. 내용 없는 소리로.',
  G.flags.lies_feed ? '@jangmadang: 고양이가 말했잖아. 거짓말부터 먹는다고. 넌 방금 그것에게 잔칫상을 차려줬어.' : '@baekdu: 거짓말은 가장 하얀 것이야. 넌 그걸 몰랐어?',
  '훈장 증서가 도착했을 때, 수여자 성명 칸은 비어 있었다. 아무도 그것을 이상하게 여기지 않았다.',
  '— 결말: 공화국 영웅 (이름 없음) —',
]},
end_truth:{scene:'결말 — 기록', ending:true, text:G=>[
  '너는 쓴다. 떨리는 손으로, 그러나 멈추지 않고. 기압이 없다는 것. 양쪽 강둑에 같은 것이 있다는 것. 지워진 세 세대. 하얀 초상화들. 1997년의 장부.',
  '문장을 하나 쓸 때마다 창백이 한 뼘씩 물러나는 것 같다. 착각일 수도 있다. 하지만 마지막 줄을 쓰고 고개를 들었을 때, 강 건너에 불빛 하나가 보인다. 단둥의 불빛. 사흘 만에 처음으로.',
  G.flags.soldier_freed ? '마을 쪽에서도 불빛이 켜진다. 박순녀의 집이다. 명수가 집에 있다.' : '',
  '보고서는 다음 날 떠난다. 열흘 후 평양에서 너를 소환하는 명령이 온다. 너는 그것이 무슨 뜻인지 안다. 13국에서 너도 같은 명령서를 수백 번 썼다.',
  '트럭에 오르기 전, 너는 신분증을 꺼낸다. 이름 칸에 희미하게 — 아주 희미하게 — 잉크가 돌아와 있다. 첫 글자만. 그거면 충분하다.',
  '— 결말: 기록하는 자 —',
]},
end_walk:{scene:'결말 — 창백', ending:true, text:G=>[
  '너는 일어선다. 철조망 사이로, 둑 아래로, 소리 없는 강물 속으로. 물은 차갑지 않다. 아무것도 아니다.',
  '창백 안에서 모든 것이 동시에 있다. 1994년의 방송. 1997년의 함흥역. 어젯밤의 농태기. 네가 지운 이름들, 네가 서명한 명령서들, 국경을 넘다 잡혀온 사람들의 얼굴.',
  G.flags.saw_other ? '그리고 강 저편에서 걸어오는 중국 병사. 너희는 강 한가운데서 만난다. 언어가 없는 곳에서. 그가 담배를 권한다. 너는 받는다.' : '그리고 아무도 없다. 너는 혼자다. 그것이 생각보다 무섭지 않다.',
  '국경은 여기서 끝난다. 아니, 처음부터 여기에는 없었다.',
  '— 결말: 국경 없음 —',
]},
end_wake:{scene:'결말 — 깨어남', ending:true, text:[
  '연필이 움직인다. 너는 성명 칸에 쓴다. 네 이름을. 기억나지 않던 이름이, 쓰는 순간 기억난다. 아니 — 쓰는 순간 생겨난다.',
  '@baekdu: 국가가 꾸던 꿈이 스스로 이름을 지었어. 이건 반역이야. 가장 아름다운 반역.',
  '창백이 숨을 멈춘다. 그것은 너를 본다. 이름을 가진 것을. 그리고 처음으로, 그것이 망설인다.',
  '너는 보고서를 쓰지 않는다. 대신 마을로 내려가 인민반 명단을 펼치고, 하얘진 세 세대의 이름을 기억나는 대로 — 박순녀에게 묻고, 오영희에게 묻고, 고양이에게 묻고 — 다시 쓴다. 볼펜 홈을 따라, 한 글자씩.',
  '창백은 아직 강에 있다. 하지만 이 마을에는 이제 이름이 있다.',
  '— 비밀 결말: 이름을 쓰는 자 —',
]},

dead_hp:{scene:'결말 — 정지', ending:true, text:[
  '@march: 몸이 멈췄다. 1997년에도 버틴 몸이, 오늘 멈췄다.',
  '너는 쓰러진다. 눈 위가 아닌, 아무것도 아닌 것 위로. 마을 사람들이 너를 발견했을 때 군복만 있었다. 그들은 그것을 보고하지 않았다.',
  '— 결말: 보고되지 않은 자 —',
]},
dead_morale:{scene:'결말 — 자아비판', ending:true, text:[
  '@volition: 미안하다. 더 붙잡을 수가 없어.',
  '너는 초대소 방으로 돌아가 앉는다. 하얀 초상화 아래에서 스스로에 대한 비판서를 쓰기 시작한다. 한 장, 열 장, 백 장. 잘못을 하나 적을 때마다 너는 조금씩 옅어진다. 마지막 장에는 서명이 없다.',
  '— 결말: 완전한 자아비판 —',
]},
};
</script>

<!-- ============================================================
     엔진
     ============================================================ -->
<script>
let G = null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function newGame(arch){
  G = {arch:arch.id, attrs:{...arch.attrs}, bought:{}, sp:2, hp:0, morale:0,
       node:null, flags:{}, visited:{}, checks:{}, used:{}, pale:0, ticks:0,
       thoughts:{known:[], active:null, progress:0, done:[]}, log:[]};
  G.hp = maxHp(); G.morale = maxMorale();
  closeModal();
  $('log').innerHTML = '';
  sys(`— ${arch.name} —`);
  go('start');
}
const maxHp = () => G.attrs.fys + 2;
const maxMorale = () => G.attrs.psy + 2;

function thoughtBonus(k){
  let b = 0;
  for (const id of G.thoughts.done) b += THOUGHTS[id].bonus[k] || 0;
  return b;
}
const level = k => Math.max(0, G.attrs[SKILLS[k].attr] + (G.bought[k]||0) + thoughtBonus(k));

function chance(lvl, dc){
  let ok = 0;
  for (let a=1;a<=6;a++) for (let b=1;b<=6;b++){
    if (a===6&&b===6) ok++;
    else if (!(a===1&&b===1) && a+b+lvl >= dc) ok++;
  }
  return Math.round(ok/36*100);
}

// ---------- log ----------
function push(cls, html){ G.log.push([cls, html]); if (G.log.length>300) G.log.shift(); appendP(cls, html); }
function appendP(cls, html){ const p=document.createElement('p'); p.className=cls; p.innerHTML=html; $('log').appendChild(p); }
const sys = t => push('sys', esc(t));
function skillTag(k){ const s=SKILLS[k]; return `<b style="color:${ATTRS[s.attr].color}">${esc(s.name)}</b>`; }
function line(raw){
  if (!raw) return;
  let m;
  if ((m = raw.match(/^@(\w+):\s*(.*)$/))) push('voice', `${skillTag(m[1])} — ${esc(m[2])}`);
  else if ((m = raw.match(/^#([^:]+):\s*(.*)$/))) push('npc', `<b>${esc(m[1])}</b> — ${esc(m[2])}`);
  else push('narr', esc(raw));
}

// ---------- effects ----------
function apply(fx){
  if (!fx) return;
  const f = x => Array.isArray(x) ? x : [x];
  if (fx.flag) f(fx.flag).forEach(k => G.flags[k] = true);
  if (fx.unflag) f(fx.unflag).forEach(k => delete G.flags[k]);
  if (fx.hp){ G.hp = Math.min(maxHp(), G.hp + fx.hp); push('fx', fx.hp>0 ? `체력 +${fx.hp}` : `체력 ${fx.hp}`); }
  if (fx.morale){ G.morale = Math.min(maxMorale(), G.morale + fx.morale); push('fx', fx.morale>0 ? `사기 +${fx.morale}` : `사기 ${fx.morale}`); }
  if (fx.sp){ G.sp += fx.sp; push('fx', `기술 점수 +${fx.sp}`); }
  if (fx.pale){ G.pale += fx.pale; }
  if (fx.thought && !G.thoughts.known.includes(fx.thought) && !G.thoughts.done.includes(fx.thought)){
    G.thoughts.known.push(fx.thought);
    push('fx', `새 사상: 「${THOUGHTS[fx.thought].name}」 — 사상함에서 내면화할 수 있다.`);
  }
}
function tick(){
  G.ticks++;
  const t = G.thoughts;
  if (t.active){
    t.progress++;
    if (t.progress >= THOUGHTS[t.active].time){
      const th = THOUGHTS[t.active];
      t.done.push(t.active); t.known = t.known.filter(x => x!==t.active);
      G.flags[th.flag] = true;
      push('voice', `<b style="color:var(--pale)">사상 내면화 완료: 「${esc(th.name)}」</b> — ${esc(th.a)}`);
      t.active = null; t.progress = 0;
    }
  }
}

// ---------- flow ----------
function go(id){
  const n = STORY[id];
  if (!n){ sys(`[오류: 노드 ${id} 없음]`); return; }
  G.node = id;
  G.visited[id] = (G.visited[id]||0) + 1;
  if (G.visited[id]===1) apply(n.on);
  const text = typeof n.text==='function' ? n.text(G) : n.text;
  text.forEach(line);
  (n.passives||[]).forEach(p => {
    if (level(p.s) + 6 >= p.dc) push('voice', `<span class="tag" style="color:${ATTRS[SKILLS[p.s].attr].color}">${esc(SKILLS[p.s].name)} ${DIFF[p.dc]}: 성공</span>${esc(p.t)}`);
  });
  if (!n.ending){
    if (G.hp <= 0) return go('dead_hp');
    if (G.morale <= 0) return go('dead_morale');
  }
  render();
}

function optState(n, o, i){
  const id = G.node + '#' + i;
  if (o.req && !o.req.every(f => G.flags[f])) return null;
  if (o.not && o.not.some(f => G.flags[f])) return null;
  if (o.once && G.used[id]) return null;
  if (o.check){
    const c = G.checks[id];
    const lv = level(o.check.s);
    if (c && c.ok) return null;
    if (c && o.check.red) return null;
    if (c && lv <= c.lvl) return {id, locked:true, lv};
    return {id, lv};
  }
  return {id};
}

function render(){
  renderSide();
  const n = STORY[G.node], box = $('opts');
  box.innerHTML = '';
  if (n.ending){
    const b = document.createElement('button');
    b.textContent = '— 새 게임 —'; b.onclick = openStart; box.appendChild(b);
    scrollLog(); return;
  }
  let k = 0;
  n.options.forEach((o, i) => {
    const st = optState(n, o, i);
    if (!st) return;
    k++;
    const b = document.createElement('button');
    let pre = '';
    if (o.check){
      const s = SKILLS[o.check.s], col = ATTRS[s.attr].color;
      pre = `<span class="tag${o.check.red?' red':''}" style="color:${col}">${esc(s.name)} · ${DIFF[o.check.dc]} ${o.check.dc} · ${st.locked ? '잠김' : chance(st.lv, o.check.dc)+'%'}</span>`;
      if (st.locked) b.disabled = true, b.title = '이 기술의 레벨이 오르면 다시 시도할 수 있다.';
    }
    b.innerHTML = `<span class="n">${k}.</span>${pre}${esc(o.t)}`;
    b.onclick = () => choose(o, st);
    box.appendChild(b);
  });
  scrollLog();
}
function scrollLog(){ const l=$('log'); l.scrollTop = l.scrollHeight; }

function choose(o, st){
  push('you', '— ' + esc(o.t));
  G.used[st.id] = true;
  tick();
  apply(o.fx);
  if (o.check){
    const a = 1+Math.floor(Math.random()*6), b = 1+Math.floor(Math.random()*6);
    const lv = level(o.check.s);
    const ok = (a===6&&b===6) || (!(a===1&&b===1) && a+b+lv >= o.check.dc);
    G.checks[st.id] = {ok, lvl:lv};
    const crit = a===6&&b===6 ? ' (결정적 성공)' : a===1&&b===1 ? ' (결정적 실패)' : '';
    push('roll ' + (ok?'ok':'no'), `${skillTag(o.check.s)} [${a}+${b}+${lv} = ${a+b+lv} / ${o.check.dc}] <b>${ok?'성공':'실패'}${crit}</b>`);
    go(ok ? o.ok : o.no);
  } else go(o.go);
}

// ---------- side panel ----------
function pips(el, cur, max, cls){ el.innerHTML = Array.from({length:max}, (_,i)=>`<span class="pip ${cls} ${i<cur?'on':''}"></span>`).join(''); }
function renderSide(){
  const n = STORY[G.node];
  $('scene').textContent = n.scene;
  const m = 6*60+40 + G.ticks*10, h = Math.floor(m/60)%24, mm = m%60;
  const day = 1 + Math.floor(m/1440);
  $('clock').textContent = `${day}일째 · ${String(h).padStart(2,'0')}:${String(mm).padStart(2,'0')} · 주체 ??년`;
  pips($('hp'), G.hp, maxHp(), 'hp');
  pips($('mo'), G.morale, maxMorale(), 'mo');
  const p = ['희미함','번짐','침식','잠식','백색'][Math.min(4, Math.floor(G.pale/2))];
  $('paleMeter').innerHTML = `창백 노출: <b>${p}</b>`;
  $('spBadge').textContent = G.sp ? `(+${G.sp})` : '';
  $('thBadge').textContent = G.thoughts.active ? '(내면화 중)' : G.thoughts.known.length ? `(${G.thoughts.known.length})` : '';
}

// ---------- modals ----------
function openModal(html){ $('card').innerHTML = html; $('modal').classList.add('show'); }
function closeModal(){ $('modal').classList.remove('show'); }
const closeBtn = () => G ? `<button class="close" onclick="closeModal()">닫기</button>` : '';

function openStart(){
  openModal(`${closeBtn()}<h2>창백한 청수리</h2>
  <p style="color:var(--dim);font-size:15px">량강도 백수군 청수리. 압록강 너머가 사라졌다. 평양은 그것을 "미제의 기상무기"라 부른다. 당신은 조사를 위해 파견된 국가보위성 소좌다. 그리고 당신의 이름이 지워지고 있다.</p>
  <h3>출신을 고르시오</h3>
  <div class="arch">${ARCHETYPES.map((a,i)=>`<button onclick="newGame(ARCHETYPES[${i}])"><b>${a.name}</b>
    <small>${a.desc}</small>
    <small>${Object.entries(a.attrs).map(([k,v])=>`<span style="color:${ATTRS[k].color}">${ATTRS[k].name} ${v}</span>`).join(' · ')}</small></button>`).join('')}</div>
  <p style="color:var(--dim);font-size:13px;margin-top:16px">판정: 2d6 + 기술 레벨 ≥ 난이도. 흰 판정은 기술이 오르면 재시도 가능, 붉은 판정은 단 한 번.</p>`);
}

function openSheet(){
  if (!G) return;
  const rows = a => Object.entries(SKILLS).filter(([,s])=>s.attr===a).map(([k,s])=>{
    const b = G.bought[k]||0, tb = thoughtBonus(k), can = G.sp>0 && b < G.attrs[a];
    return `<div class="sk"><span>${esc(s.name)} <b>${level(k)}</b>${tb?` <small style="display:inline">(${tb>0?'+':''}${tb} 사상)</small>`:''}<small>${esc(s.desc)}</small></span>
      ${can?`<button onclick="buy('${k}')">+</button>`:''}</div>`;
  }).join('');
  openModal(`${closeBtn()}<h2>보위원 소좌 [이름 없음]</h2>
    <p style="color:var(--dim);font-size:14px">기술 점수: ${G.sp} · 각 기술은 속성 값만큼 추가로 올릴 수 있다.</p>
    <div class="grid">${Object.entries(ATTRS).map(([a,A])=>`<div><h3 style="color:${A.color}">${A.name} ${G.attrs[a]}</h3>${rows(a)}</div>`).join('')}</div>`);
}
function buy(k){ if (G.sp<=0) return; G.sp--; G.bought[k]=(G.bought[k]||0)+1; push('fx', `${SKILLS[k].name} → ${level(k)}`); openSheet(); render(); }

function openThoughts(){
  if (!G) return;
  const t = G.thoughts;
  const bon = th => Object.entries(th.bonus).map(([k,v])=>`${SKILLS[k].name} ${v>0?'+':''}${v}`).join(', ');
  const card = (id, state) => { const th = THOUGHTS[id]; return `<div class="thought"><b>「${esc(th.name)}」</b><br>
    <small>${esc(state==='done'?th.a:th.q)}</small><br><small>효과: ${bon(th)} · 내면화 ${th.time}턴</small><br>
    ${state==='known' && !t.active ? `<button class="close" style="float:none;margin-top:6px" onclick="internalize('${id}')">내면화한다</button>`:''}
    ${state==='active' ? `<small style="color:var(--pale)">내면화 중… ${t.progress}/${th.time}</small>`:''}</div>`; };
  openModal(`${closeBtn()}<h2>사상함</h2>
    <p style="color:var(--dim);font-size:14px">생각을 품고 있으면 선택을 할 때마다 내면화가 진행된다. 한 번에 하나만.</p>
    ${t.active?card(t.active,'active'):''}
    ${t.known.filter(x=>x!==t.active).map(x=>card(x,'known')).join('')}
    ${t.done.length?'<h3>내면화된 사상</h3>'+t.done.map(x=>card(x,'done')).join(''):''}
    ${!t.active && !t.known.length && !t.done.length ? '<p>아직 품은 사상이 없다. 생각은 위험한 곳에서 온다.</p>':''}`);
}
function internalize(id){ G.thoughts.active=id; G.thoughts.progress=0; push('fx', `「${THOUGHTS[id].name}」을(를) 품기 시작한다.`); openThoughts(); renderSide(); }

// ---------- save ----------
function saveGame(){
  if (!G) return;
  try { localStorage.setItem('pale_chungsu_save', JSON.stringify(G)); sys('— 저장됨 —'); }
  catch(e){ sys('— 저장 실패: 브라우저 저장소를 쓸 수 없음 —'); }
}
function loadGame(){
  let s = null;
  try { s = localStorage.getItem('pale_chungsu_save'); } catch(e){}
  if (!s){ if (G) sys('— 저장된 게임 없음 —'); return; }
  G = JSON.parse(s);
  closeModal();
  $('log').innerHTML = '';
  G.log.forEach(([c,h]) => appendP(c,h));
  sys('— 불러옴 —');
  render();
}

$('modal').addEventListener('click', e => { if (e.target.id==='modal' && G) closeModal(); });
document.addEventListener('keydown', e => {
  if ($('modal').classList.contains('show')) { if (e.key==='Escape' && G) closeModal(); return; }
  const n = parseInt(e.key, 10);
  if (n>=1 && n<=9){ const b = $('opts').querySelectorAll('button')[n-1]; if (b && !b.disabled) b.click(); }
});
openStart();
</script>
