]},

// ---------- 물러남 분기: 길이 열린다 ----------
r4_dawn:{scene:'압록강 둑 · 4일째', on:{flag:'pale_receded'}, text:G=>[
  '강둑에 선다. 창백이 강 한가운데까지 물러나 있다. 그리고 그 너머 — 희미하게 — 단둥의 불빛. 공장 굴뚝. 강변 아파트. 사흘 만에 보는 다른 나라.',
  '물러난 창백이 남기고 간 것이 있다. 둑 아래, 몇 년 동안 하얀 것에 묻혀 있던 녹슨 협궤 철길. 강을 따라 상류로, 백두산 쪽으로 이어진다.',
  '철길 위에 손으로 미는 궤도차 한 대. 그 위에 철도원 제복을 입은 남자가 앉아 있다. 제복의 단추가 낡은 디자인이다. 아주 오래된.',
  '#철도원: 아, 동지! 여기가 청수리 맞습니까? 보천까지 가야 하는데 길이 하얘서… 지금 몇 시입니까? 아니, 몇 년입니까?',
], passives:[
  {s:'history', dc:10, t:'저 제복은 90년대 중반까지 쓰던 철도성 제복이다. 이 협궤선은 1998년에 운행이 끊겼다.'},
  {s:'eye', dc:8, t:'그의 신발에 묻은 흙이 하얗다. 창백에서 걸어 나온 사람이다.'},
], options:[
  {t:'"지금은… 너무 오래 지났소. 당신은 누구요?"', go:'r4_mun'},
  {t:'그의 손을 살핀다.', check:{s:'empathy', dc:10}, ok:'r4_mun_card', no:'r4_mun'},
]},
r4_mun_card:{scene:'압록강 둑 · 4일째', on:{name:'문봉식'}, text:[
  '그의 손이 주머니 속 무언가를 꽉 쥐고 있다. 너는 조용히 묻는다. 그가 꺼낸다. 배급표. 1997년 3월분. 쌀 칸에 도장이 찍혀 있다. 받지 못한 쌀.',
  '#철도원: 문봉식입니다. 보천 기관구. 이거 받으러 가는 길이었는데…',
  '@empathy: 그는 아직 1997년 3월에 있다. 배급소 문이 열리기를 기다리면서.',
], options:[{t:'"문봉식 동무, 앉으시오."', go:'r4_mun'}]},
r4_mun:{scene:'압록강 둑 · 4일째', on:{flag:'met_mun', name:'문봉식'}, text:[
  '#문봉식: 문봉식입니다. 보천 기관구 협궤 운전수. 혜산에서 보천, 보천에서 삼지연까지 다니는 선입니다. 아니, 다니던 선이지요.',
  '#문봉식: 하얀 데서 오래 있었던 것 같습니다. 거기선 시간이 없어서 배도 안 고프고 늙지도 않습디다. 그런데 어젯밤에 누가 이름을 막 부르는 소리가 들려서, 그 소리 따라 나왔더니 여깁니다.',
  '#문봉식: 이상한 건, 하얀 데 안에서 이 철길만은 끝까지 보였다는 겁니다. 삼지연까지. 거기서도 누가 이름을 부르고 있었어요. 아이 목소리로.',
], options:[
  {t:'"그 철길로 삼지연까지 갈 수 있소?"', go:'r4_mun_line'},
  {t:'마을로 돌아간다.', go:'r4_village'},
]},
r4_mun_line:{scene:'압록강 둑 · 4일째', on:{flag:'rail_open'}, text:[
  '#문봉식: 갈 수 있지요. 궤도차로 하루. 하얀 게 물러난 데까지는 확실히 됩니다. 그 너머는… 모르지요. 그래도 철길이 보이는 데까지는 가 봐야겠습니다. 내 일이 그거니까.',
  '#문봉식: 동지도 같이 가시렵니까? 보위원 동지가 타면 검문이 편하겠습니다. 검문할 사람이 남아 있다면 말이지요.',
  '@logic: 삼지연. 창백의 근원을 알고 싶다면, 이름을 부르는 목소리가 있는 곳으로 가야 한다.',
], options:[{t:'"준비하겠소. 마을에 들렀다 오겠소."', go:'r4_village'}]},
r4_village:{scene:'청수리 광장 · 4일째', text:G=>[
  G.visited.r4_village>1 ? '광장. 떠날 채비를 해야 한다.' : '광장의 하얀 절반이 물러나 있다. 무너진 김치움, 젖은 구호판, 그리고 — 그 자리에 서 있는 사람들. 사흘 전 "이사 간" 사람들 몇이 어리둥절한 얼굴로 자기 집을 찾고 있다.',
  G.flags.village_names ? '숯으로 이름을 쓴 문들이 아침 햇빛에 선명하다. 누군가 그 위에 다시 덧쓰고 있다.' : '',
  G.flags.returned ? '리용남네 막내가 다리를 절며 광장을 뛰어다닌다.' : '',
  G.flags.choi_with ? '최경철이 트럭 발판에 앉아 단둥 쪽을 바라보고 있다.' : '',
], options:[
  {t:'박순녀의 집에 들른다.', go:'r4_park', once:true},
  {t:'관측소에 올라간다.', go:'r4_oh', req:['know_station'], once:true},
  {t:'강가로 가서 건너편에 말을 걸어본다.', go:'r4_shore', once:true},
  {t:'[동행] 최경철과 이야기한다.', go:'choi_talk', req:['choi_with']},
  {t:'[출발] 협궤 철길로 간다.', go:'r4_rail', req:['met_mun']},
  {t:'강둑의 궤도차로 간다.', go:'r4_mun', not:['met_mun']},
]},
r4_park:{scene:'박순녀의 집', text:G=>[
  G.flags.myeongsu_remember || G.flags.myeongsu_back || G.flags.soldier_freed ? '박순녀가 마당을 쓸고 있다. 명수가 옆에서 물을 긷는다. 군복이 아니라 낡은 작업복 차림이다.' : '박순녀가 마당을 쓸고 있다. 명수의 군화는 여전히 방 구석에 있다.',
  G.flags.myeongsu_lost && !G.flags.myeongsu_back ? '#박순녀: 하얀 게 물러났다길래 강가에 가봤어요. 명수는 없었어요. 그래도… 물러났으니까, 언젠가는.' : '#박순녀: 떠나신다면서요. 이 마을에 와서 이름을 불러준 보위원은 동지가 처음입니다.',
  '#박순녀: 이거 가져가세요. 우리 인민반 명단. 하얘졌던 세 집 이름, 제가 다시 썼습니다. 삼지연에도 하얀 게 있다면, 이게 쓸모가 있을지도 모르지요.',
], options:[{t:'명단을 받는다.', go:'r4_village', fx:{item:'ledger', morale:1}}]},
r4_oh:{scene:'기상관측소 · 4일째', text:G=>[
  G.flags.oh_saved ? '오영희는 이제 마을 공회당에서 기록한다. 그래도 라디오는 관측소에 두고 왔다며, 너를 데리고 올라간다.' : '오영희가 백엽상 옆에서 담배를 피우고 있다. 그녀의 오른손 손톱 끝이 하얗다. 하지만 그녀는 아직 여기 있다.',
  '#오영희: 들어봐요. 어젯밤부터 잡혀요.',
  '라디오. 잡음 사이로 아이의 목소리. 이름을 읽고 있다. 「김철, 리은정, 박명호, 최순옥…」 한 반의 출석부처럼. 끝나면 처음부터 다시.',
  '#오영희: 방향을 재봤는데, 삼지연 쪽이에요. 혁명전적지 답사 온 학생들 아닐까. 누가 저렇게 밤새 이름을 부르고 있다는 건… 거기도 하얗다는 뜻이겠지요.',
  '#오영희: 이거 가져가요. 창근이가 쓰던 휴대용 단파 라디오. 원래는 신고해야 하는 물건이지만, 신고받을 데가 남아 있나요.',
], options:[
  {t:'"기록해 두시오. 내가 가서 확인하겠소."', go:'r4_village', fx:{flag:'heard_cheol', item:'radio'}},
]},
r4_shore:{scene:'압록강 둑 · 4일째', on:{ws:1, flag:'spoke_across'}, text:G=>[
  '강이 다시 강이다. 폭은 백 미터 남짓. 건너편 둑에 사람들이 나와 있다. 이쪽을 보고 있다.',
  G.flags.cat_helped || G.flags.cat_released ? '건너편에서 누군가 손전등을 흔든다. 그리고 낯익은 목소리가 물 위로 건너온다. "보위원! 나 설화야! 도착했어! 이모도 찾았어!"' :
  G.flags.phone ? '주머니 속 고양이의 손전화가 진동한다. 문자. 「여기 단둥. 강 건너가 보여. 너희도 보여? 살아 있어?」' :
  '건너편에서 중국 국경수비대 병사 하나가 손을 흔든다. 너도 모르게 손을 든다. 사흘 전이라면 둘 다 군법회의감이다.',
  '건너편 목소리가 계속 이어진다. 조선말과 중국말이 섞인다. 「여기도 하얬어! 근데 어젯밤에 물러났어! 거기서 누가 이름 불렀어?」',
  '그리고 하나 더. 「상류 쪽, 백두산 쪽은 아직 하얗대! 거기로 사람들이 몰려가! 연구한다는 사람들, 무슨 짐승 잡는다는 사람들… 다 미쳤어!」',
], options:[
  {t:'"우리 쪽에서 이름을 불렀다!" 크게 외친다.', go:'r4_village', fx:{morale:1}},
]},
r4_rail:{scene:'협궤 철길 · 궤도차', on:{flag:'traveling'}, text:G=>[
  '궤도차가 녹슨 레일 위를 덜컹거리며 미끄러진다. 문봉식이 손잡이를 밀고 당긴다. 강은 오른쪽에서 반짝이고, 단둥 쪽 둑이 계속 따라온다.',
  G.flags.choi_with ? '최경철은 맨 뒤에 앉아 하얀 손을 외투 주머니에 넣고 있다. 그가 처음으로 장갑을 끼지 않았다.' : '',
  '이따금 철길 옆에 하얀 얼룩이 남아 있다. 물러나다 만 창백. 그 안에 낡은 역 간판, 1990년대 표어, 반쯤 지워진 사람의 그림자.',
  '#문봉식: 저기 보이는 게 가림역입니다. 아니, 가림역이었던 곳. 저 역장 동무가 나한테 담배를 꾸고 안 갚았는데. 지금도 저 안에 있을까요.',
], passives:[
  {s:'march', dc:10, t:'이 철길. 1997년에 너는 이런 화물칸 지붕에 매달려 북쪽으로 갔다. 먹을 것을 찾아서. 기억이 레일 소리처럼 돌아온다.'},
], options:[
  {t:'문봉식에게 1997년 이야기를 묻는다.', go:'r4_mun_1997', once:true},
  {t:'[동행] 최경철과 이야기한다.', go:'choi_talk', req:['choi_with']},
  {t:'[저녁] 보천 간이역에 도착한다.', go:'night4'},
]},
r4_mun_1997:{scene:'협궤 철길 · 궤도차', on:{sp:1}, text:[
  '#문봉식: 그해 봄엔 기차가 다녀도 탈 사람만 있고 실을 게 없었지요. 화물칸 지붕마다 사람이 매달려서. 떨어지는 사람도 많았고.',
  '#문봉식: 나는 운전수니까, 사람이 떨어져도 멈추면 안 된다고 배웠어요. 시간표대로 가야 한다고. 그래서 안 멈췄어요. 한 번도.',
  '#문봉식: 하얀 데서 내가 제일 많이 본 게 그 얼굴들입니다. 지붕에서 떨어지던. 이름은 하나도 몰라요. 물어본 적이 없으니까.',
  '@empathy: 그가 창백에서 나온 이유. 누군가 이름을 불러서. 그가 아직 돌아가지 못하는 이유. 아무의 이름도 부르지 못해서.',
], options:[{t:'말없이 손잡이를 같이 민다.', go:'r4_rail'}]},

// ---------- 확장 분기: 중앙의 호출 ----------
e4_dawn:{scene:'청수리 광장 · 4일째', on:{flag:'pale_expanded', pale:1}, text:G=>[
  '광장은 이제 광장이 아니다. 하얀 면 위에 집 몇 채가 섬처럼 떠 있다. 초대소에서 광장까지 스무 걸음이 열 걸음이 되었다.',
  G.flags.village_names ? '이름을 쓴 문들만 남아 있다. 그 문 안에 사람들이 웅크리고 있다. 숯으로 쓴 이름이 성벽처럼 그들을 둘러싸고 있다.' : '박순녀의 집 쪽에서 빗자루 소리가 난다. 쓱, 쓱. 쓸 마당이 반밖에 남지 않았는데도.',
  '그리고 남쪽, 하얀 길 위로 — 엔진 소리. 군용 지프 한 대가 확성기를 단 채 달려온다. 확성기에서 구호가 쉬지 않고 흘러나온다. 구호가 울리는 동안만 지프 앞의 길이 잠깐씩 회색으로 돌아온다.',
], passives:[
  {s:'logic', dc:10, t:'구호로 길을 잠깐 붙잡고 있다. 그 구호는 창백의 먹이이기도 하다. 저 지프는 길을 열면서 동시에 길을 먹이고 있다.'},
], options:[{t:'지프를 맞는다.', go:'e4_yoon'}]},
e4_yoon:{scene:'광장 · 군용 지프', on:{flag:'met_yoon'}, text:G=>[
  '지프에서 여자가 내린다. 서른 중반. 검은 솜외투, 가슴에 작은 붉은 배지 — 아직 색이 있다. 그녀는 하얀 땅을 밟을 때 한 번도 내려다보지 않는다.',
  '#윤해란: 중앙당 조직지도부 지도원 윤해란입니다. 국가보위성 13국 소좌 동무지요. 이름은 묻지 않겠습니다. 저도 보고서를 읽었으니까.',
  G.flags.report_lie ? '#윤해란: 훌륭한 보고서였습니다. 결론이 명확했어요. 위에서 높이 평가합니다. 그래서 동무가 필요합니다.' :
  G.flags.report_names ? '#윤해란: 보고서가 오지 않았지요. 마감을 어긴 보위원. 원래라면 제가 동무를 데려가는 방향이 달랐을 겁니다. 하지만 지금은 사람이 부족합니다.' :
  '#윤해란: 흥미로운 보고서였습니다. 위험할 정도로. 위에서는 동무를 처리할지 쓸지 의견이 갈렸어요. 쓰기로 했습니다. 당분간은.',
  '#윤해란: 어제 새벽, 삼지연 혁명전적지에 같은 현상이 나타났습니다. 이 나라에서 가장 신성한 곳에. 창백을 직접 겪고 살아 있는 보위원은 동무가 유일합니다. 한 시간 안에 출발합니다.',
], passives:[
  {s:'empathy', dc:12, t:'그녀의 오른손 검지가 외투 단추를 계속 만지작거린다. 단추 하나가 하얗다. 그녀는 그걸 숨기지 않는다. 그냥 모르는 척한다.'},
  {s:'history', dc:10, t:'조직지도부. 13국보다 위, 검열국보다도 위. 그녀가 "처리"라고 말하면 그건 비유가 아니다.'},
], options:[
  {t:'"알겠습니다, 지도원 동지." 표정을 지킨다.', check:{s:'composure', dc:12}, ok:'e4_yoon_ok', no:'e4_yoon_no'},
  {t:'"마을 사람들은 어떻게 됩니까?"', go:'e4_yoon_village', once:true},
  {t:'"최경철 중좌도 함께 가야 합니다."', go:'e4_yoon_choi', req:['choi_with'], once:true},
]},
e4_yoon_ok:{scene:'광장 · 군용 지프', on:{flag:'yoon_trust'}, text:[
  '너는 경례한다. 아무것도 담지 않은 얼굴. 그녀가 너를 오래 본다.',
  '#윤해란: 좋습니다. 동무 같은 사람은 쓸모가 있어요. 감정이 없는 사람. …아니, 감정을 숨길 줄 아는 사람.',
], options:[{t:'짐을 챙기러 간다.', go:'e4_village'}]},
e4_yoon_no:{scene:'광장 · 군용 지프', on:{morale:-1, flag:'yoon_watch'}, text:[
  '"알겠습—" 목소리 끝이 흔들린다. 그녀의 눈이 그 흔들림을 정확히 잡는다.',
  '#윤해란: 피곤하신가 보군요. 지프에서 주무세요. 저는 안 잡니다.',
  '@composure: 이제 그녀는 너를 감시할 것이다. 아니, 처음부터 그럴 생각이었다.',
], options:[{t:'짐을 챙기러 간다.', go:'e4_village'}]},
e4_yoon_village:{scene:'광장 · 군용 지프', text:G=>[
  '#윤해란: 이 마을은 지도에서 정리됩니다. 원래 국경 경비 구역이라 주민 수가 적었어요. 문서상으로는 더 적었고요.',
  G.flags.village_names ? '그녀가 숯으로 이름을 쓴 문들을 본다. 처음으로 무언가 그녀의 얼굴을 스친다. 그리고 사라진다.' : '',
  '#윤해란: 동무가 걱정할 일이 아닙니다. 걱정한다고 하얀 게 멈추지 않아요. 동무 보고서에 따르면.',
  '@empathy: 그녀는 이 말을 믿는다. 믿어야 한다. 믿지 않으면 그녀가 지금까지 정리한 모든 마을이 돌아올 테니까.',
], options:[{t:'…', go:'e4_yoon'}]},
e4_yoon_choi:{scene:'광장 · 군용 지프', text:G=>[
  '#윤해란: 최경철 중좌. 검열국. 평양에서는 그가 사흘째 보고를 안 한다고 찾고 있던데요.',
  G.flags.choi_hostile ? '' : '최경철이 다가온다. 하얀 손을 숨기지 않고. 두 사람이 서로를 본다. 검열하는 자와 검열하는 자를 검열하는 자.',
  '#최경철: 지도원 동지. 소좌와 나는 같이 이 마을을 봤소. 내가 같이 가야 보고서가 두 장이 되오. 두 장이면 평양도 쉽게 못 버리지.',
  '#윤해란: …좋습니다. 지프는 넷이 탑니다. 운전병, 저, 소좌, 그리고 중좌. 중좌는 뒷자리. 제 시야 안에.',
], options:[{t:'…', go:'e4_yoon'}]},
e4_village:{scene:'청수리 광장 · 4일째', text:G=>[
  '한 시간. 이 마을과 작별할 시간이 한 시간이다.',
  G.flags.choi_with ? '최경철이 지프 뒷자리에 이미 앉아 있다. 윤해란이 운전석 옆에서 서류를 넘긴다.' : '',
], options:[
  {t:'박순녀에게 간다.', go:'e4_park', once:true},
  {t:'오영희에게 간다.', go:'e4_oh', req:['know_station'], once:true},
  {t:'[동행] 최경철과 이야기한다.', go:'choi_talk', req:['choi_with']},
  {t:'[출발] 지프에 오른다.', go:'e4_road'},
]},
e4_park:{scene:'박순녀의 집 앞', text:G=>[
  '박순녀가 빗자루를 든 채 서 있다. 그녀의 마당은 반쯤 하얗다. 그녀는 하얀 쪽을 쓸지 않는다.',
  G.flags.myeongsu_remember || G.flags.myeongsu_back || G.flags.soldier_freed ? '명수가 그녀 뒤에 서 있다. 그는 어머니의 옷자락을 잡고 있다. 열아홉 살이 아니라 아홉 살처럼.' : '',
  '#박순녀: 데려가 주세요, 라고는 안 하겠습니다. 저 지도원 눈을 보니 안 될 거 알아요.',
  '#박순녀: 대신 하나만. 동지가 어디를 가든, 거기서 우리 마을 이름을 한 번 불러주세요. 청수리. 지도에서 지워져도, 누가 한 번 부르면 있는 거니까.',
], options:[
  {t:'"청수리." 지금 한 번 부르고, 그녀가 내민 인민반 명단을 받는다.', go:'e4_village', fx:{name:'청수리', morale:1, flag:'promised_park', item:'ledger'}},
]},
e4_oh:{scene:'기상관측소 · 4일째', text:G=>[
  G.flags.oh_saved ? '오영희는 마을 공회당에 있다. 기록부를 무릎에 올려놓고.' : '관측소 언덕은 이제 섬이다. 오영희가 하얀 면 건너편에서 손을 흔든다. 그녀는 내려오지 않는다.',
  '#오영희: 삼지연이라고요? 거기 날씨는 원래 미쳤어요. 하루에 사계절이 다 지나가요. 기록하기 좋은 곳이지.',
  '#오영희: 라디오에 어젯밤부터 이상한 게 잡혀요. 아이가 이름을 읽어요. 한 반 출석부처럼. 방향이 삼지연이에요. 가면 그 애를 찾아봐요.',
  G.flags.oh_saved ? '#오영희: 그리고 이거. 창근이가 쓰던 단파 라디오. 지도원 눈에 띄지 않게 품에 넣어요.' : '그녀가 하얀 면 너머로 무언가를 던진다. 네 발 앞에 떨어진다. 낡은 휴대용 단파 라디오. "창근이 거예요! 지도원한테 들키지 말고!"',
], options:[
  {t:'"기록을 계속하시오." 라디오를 외투 안에 넣는다.', go:'e4_village', fx:{flag:'heard_cheol', item:'radio'}},
]},
e4_road:{scene:'하얀 길 · 군용 지프', on:{flag:'traveling'}, text:G=>[
  '지프가 하얀 길을 달린다. 지붕의 확성기가 구호를 쉬지 않고 토해낸다. 구호가 울리는 동안 앞바퀴 앞에 회색 길이 몇 미터씩 생겨난다. 구호가 끊기면 길도 끊긴다.',
  '운전병은 열여덟쯤 되어 보인다. 그는 구호를 따라 입술을 움직인다. 소리 없이. 계속.',
  G.flags.choi_with ? '최경철은 뒷자리에서 눈을 감고 있다. 윤해란의 시선이 백미러로 그를 향해 있다.' : '',
  '#윤해란: 구호가 길을 만든다는 걸 처음 발견한 건 혜산 공병대였습니다. 동무 보고서에 이 얘기는 없더군요.',
], passives:[
  {s:'logic', dc:12, t:'구호가 지나간 자리는 회색이 되지만, 지프가 지나가고 나면 더 하얘진다. 길을 여는 게 아니라 빌려 쓰고 있다. 이자를 붙여서.'},
], options:[
  {t:'"구호는 창백의 먹이입니다. 길을 열면서 길을 먹이고 있습니다."', check:{s:'rhet', dc:12}, ok:'e4_road_argue', no:'e4_road_silenced', once:true},
  {t:'윤해란에게 그녀의 하얀 단추에 대해 묻는다.', go:'e4_yoon_button', once:true},
  {t:'[동행] 최경철과 이야기한다.', go:'choi_talk', req:['choi_with']},
  {t:'[저녁] 보천 군 초소에 도착한다.', go:'night4'},
]},
e4_road_argue:{scene:'하얀 길 · 군용 지프', on:{flag:'yoon_doubt', sp:1}, text:[
  '#윤해란: …뒤를 보세요, 라고요?',
  '그녀가 돌아본다. 지프가 지나온 길이 처음보다 더 하얗다. 회색 자국조차 없다. 그녀는 오래 본다.',
  '#윤해란: 그럼 우리는 갈 길을 먹으면서 가고 있는 거군요. 돌아갈 길은 없는 거고.',
  '#윤해란: …운전병, 계속 가. 구호 멈추지 마.',
  '@empathy: 그녀는 알아들었다. 그리고 계속 가기로 했다. 그게 그녀가 할 줄 아는 유일한 방식이니까.',
], options:[{t:'…', go:'e4_road'}]},
e4_road_silenced:{scene:'하얀 길 · 군용 지프', on:{morale:-1}, text:[
  '#윤해란: 동무 보고서에 그런 내용은 없었습니다. 보고서에 없는 이론은 개인 의견이지요. 개인 의견은 생활총화 때 말하세요.',
  '확성기의 구호가 한층 커진다. 운전병이 볼륨을 올렸다.',
], options:[{t:'…', go:'e4_road'}]},
e4_yoon_button:{scene:'하얀 길 · 군용 지프', text:G=>[
  '#윤해란: 이거요? 혜산에서 출발할 때부터 그랬습니다.',
  '#윤해란: 아버지가 주신 외투예요. 아버지는 함경북도 도당 비서였습니다. 1997년에 정리되셨지요. 이 단추는 아버지가 직접 달아주신 거고.',
  '#윤해란: 아버지 이름은 말하지 않겠습니다. 정리된 사람 이름을 부르면 안 되니까. 동무가 제일 잘 알 텐데요, 13국 소좌 동무.',
  G.flags.th_ration || G.flags.th_names ? '@empathy: 그녀의 단추가 하얀 이유. 그녀가 그 이름을 30년 동안 한 번도 부르지 않았기 때문이다.' : '',
], options:[{t:'아무 말도 하지 않는다.', go:'e4_road', fx:{flag:'yoon_father'}}]},

// ---------- 합류: 보천 ----------
night4:{scene:'보천 갈림길 · 밤', on:{hp:1, morale:1, flag:'at_bocheon'}, text:G=>[
  G.flags.pale_receded ? '보천 간이역. 지붕이 내려앉은 대합실. 문봉식이 난로에 불을 피운다. 역 시계는 1997년 3월 14일 오후 4시 12분에 멈춰 있다.' :
  '보천 군 초소. 초소병들은 사흘째 보급을 못 받았다. 윤해란이 서류 한 장으로 그들의 저녁밥을 해결한다. 확성기는 밤새 구호를 튼다. 끄면 초소가 하얘진다고 한다.',
  '여기서부터 삼지연까지 반나절. 북쪽 하늘이 하얗다. 청수리의 하얀 것과 다르다. 더 높고, 더 조용하고, 더 오래된 하얀 것.',
  G.flags.heard_cheol ? '라디오를 켜면 아직도 그 아이의 목소리가 잡힌다. 출석부. 처음부터 다시.' : '',
  G.flags.choi_with ? '최경철이 난로 맞은편에 앉는다. 오늘 밤 그는 무언가 말하고 싶어 하는 얼굴이다.' : '',
  '@baekdu: 내일이면 백두산이야. 혁명의 성지. 이 나라에서 가장 많이 반복된 이야기가 태어난 곳. 창백에게 거기는 어떤 곳일까? 잔칫상일까, 아니면 이미 다 먹고 남은 빈 그릇일까?',
], options:[
  {t:'[동행] 최경철이 내미는 압수품 상자를 연다.', go:'box_choi', req:['choi_with'], not:['item_notel']},
  {t:'구석의 비닐 꾸러미를 살핀다.', check:{s:'eye', dc:10}, ok:'box_found', no:'box_miss', not:['choi_with','item_notel']},
  {t:'노텔에 알판을 넣고 튼다.', go:'watch_dvd', req:['item_notel','item_dvd'], once:true},
  {t:'단파 라디오의 주파수를 천천히 돌린다.', go:'radio_tune', req:['item_radio'], once:true},
  {t:'[동행] 최경철과 이야기한다.', go:'choi_talk', req:['choi_with']},
  {t:'문봉식이 난로에 굽는 알감자를 얻어먹는다.', go:'night4', fx:{item:['potato','potato']}, req:['pale_receded'], once:true},
  {t:'초소병이 나눠주는 통조림을 받는다.', go:'night4', fx:{item:'canned'}, req:['pale_expanded'], once:true},
  {t:'잠든다.', go:'d5_arrive', fx:{day:5}},
]},
box_choi:{scene:'보천 갈림길 · 밤', on:{item:['notel','dvd']}, text:G=>[
  '#최경철: 혜산에서 압수한 물건들이오. 검열국 창고로 보내려던 거지. 이제 보낼 창고가 있는지도 모르겠고.',
  '상자 안에 휴대용 DVD 플레이어 — 장마당에서 "노텔"이라 부르는 것 — 와, 손글씨로 「혁명가요 모음」이라고 적힌 알판 한 장. 물론 혁명가요가 아니다.',
  '#최경철: 남조선 드라마요. 열여섯 회짜리. 압수하면서 나도 두 회를 봤소. 검열 목적으로. …주인공 여자 이름이 아직도 기억나오. 이상하지. 내 오른손은 다 잊었는데.',
], options:[{t:'상자를 받는다.', go:'night4'}]},
box_found:{scene:'보천 갈림길 · 밤', on:{item:['notel','dvd']}, text:G=>[
  G.flags.pale_receded ? '대합실 의자 밑, 비닐로 몇 겹이나 싼 꾸러미. 누군가 국경을 넘다 버리고 간 것이다.' : '초소 탄약 상자 뒤, 비닐로 몇 겹이나 싼 꾸러미. 초소병 누군가가 숨겨둔 것이다.',
  '안에는 휴대용 DVD 플레이어 — "노텔" — 와 알판 한 장. 겉에 「혁명가요 모음」이라고 써 있다. 장마당에서 남조선 드라마를 그렇게 싸서 판다.',
  '@jangmadang: 이야, 이거 장마당 시세로 쌀 반 가마니야. 보위원이 이걸 주웠다? 신고할 거야, 볼 거야?',
], options:[{t:'꾸러미를 챙긴다.', go:'night4'}]},
box_miss:{scene:'보천 갈림길 · 밤', text:['구석은 어둡고, 너는 피곤하다. 먼지와 쥐똥뿐이다. 아마도.'], options:[{t:'…', go:'night4'}]},
watch_dvd:{scene:'보천 갈림길 · 밤', on:{ws:1, thought:'foreign_names', morale:1}, text:G=>[
  '작은 화면이 켜진다. 색. 너무 많은 색. 서울이라는 도시의 밤거리, 간판, 우산, 버스. 사람들이 서로를 부른다. 이름으로. 끊임없이. "지수야." "민재 씨." "엄마!"',
  '아무도 구호를 외치지 않는다. 누구도 같은 말을 두 번 하지 않는다. 대사 하나하나가 단 한 사람을 향해 있다.',
  G.flags.choi_with ? '최경철이 어깨 너머로 본다. "그 여자요. 내가 말한 주인공." 그가 이름을 말한다. 처음 듣는 이름이다. 그는 그 이름을 부를 때 웃는다.' : '',
  '그리고 너는 깨닫는다. 창밖의 하얀 빛이 조금 물러나 있다. 화면의 빛이 닿는 데까지만.',
  '@baekdu: 반복되지 않는 이야기. 원본만 있는 이야기. 창백은 이걸 못 먹어. 아니, 먹는 법을 몰라.',
  '@volition: 이건 반동 매체다. 네가 13국에서 이걸 보다 걸린 사람을 몇이나 보냈는지 기억해라. …그리고 지금 네가 뭘 하고 있는지도.',
], options:[{t:'화면을 끈다. 눈을 감아도 색이 남는다.', go:'night4'}]},
radio_tune:{scene:'보천 갈림길 · 밤', on:{thought:'between_stations'}, text:G=>[
  '다이얼을 천천히 돌린다. 잡음. 잡음. 그리고 —',
  '첫 번째 주파수: 아이의 목소리. 「김철, 리은정, 박명호, 최순옥, 한경수…」 출석부. 마지막에 아이가 자기 이름을 덧붙인다. 「…그리고 리철.」 철이. 그게 그 아이의 이름이다.',
  '두 번째 주파수: 아주 또렷한, 낯선 억양의 여자 목소리. 「…오늘 서울은 맑고, 낮 최고 기온은…」 남쪽 방송이다. 날씨를 알려준다. 맑음. 정말 맑음.',
  '세 번째 주파수: 1994년 여름. 떨리는 목소리. 너는 다이얼을 급히 돌려 지나친다.',
  '@hands: 이 라디오, 단파 대역이 개조돼 있다. 오창근이 직접 손본 거다. 평생 정직한 기록만 하던 사람이, 몰래 남쪽 날씨를 듣고 있었다.',
], options:[{t:'라디오를 품에 안고 눕는다.', go:'night4', fx:{flag:'heard_cheol', name:'리철'}}]},

// ---------- 최경철 동행 대화 (어느 장면에서든) ----------
choi_talk:{scene:'동행 · 최경철', text:G=>[
  '#최경철: 무슨 일이오, 소좌.',
  '그의 하얀 손은 이제 팔꿈치 근처까지 올라와 있다. 그는 그걸 숨기지 않는다.',
], options:[
  {t:'"손은 괜찮습니까?"', go:'choi_t_hand', once:true},
  {t:'"은별이 이야기를 해주십시오."', go:'choi_t_daughter', cond:G=>G.names.includes('최은별'), once:true},
  {t:'"30년 동안 검열하면서 무엇을 지웠습니까?"', go:'choi_t_past', once:true},
  {t:'"윤해란 지도원을 어떻게 보십니까?"', go:'choi_t_yoon', req:['met_yoon'], once:true},
  {t:'"문봉식 동무 같은 사람이 또 돌아올까요?"', go:'choi_t_mun', req:['met_mun'], once:true},
  {t:'이야기를 마친다.', go:'choi_back'},
]},
choi_t_hand:{scene:'동행 · 최경철', text:[
  '#최경철: 아프지 않소. 그게 문제지. 처음엔 손끝, 그다음 손목, 이제 팔꿈치. 하얀 데가 올라올수록 거기 있던 기억이 같이 빠지오.',
  '#최경철: 오른손으로 처음 서명한 명령서가 뭐였는지 기억이 안 나오. 마흔 해 동안 그 손으로 수천 장에 서명했는데. …어쩌면 다행인지도 모르지.',
], options:[{t:'…', go:'choi_talk'}]},
choi_t_daughter:{scene:'동행 · 최경철', on:{morale:1}, text:[
  '#최경철: 은별이. 열두 살. 그림을 그리오. 지난달에 압록강을 그렸는데, 강 건너에 불빛을 잔뜩 그려 넣었더군. 선생이 그거 보고 지우라고 했다고 울면서 왔소.',
  '#최경철: 나는 선생 편을 들었소. 국경 건너에 불빛을 그리면 안 된다고. …그 그림, 집에 가면 다시 그려달라고 할 거요. 불빛 잔뜩 넣어서.',
  '그가 하얀 손을 펴 본다. 손바닥 한가운데, 아주 작게, 색이 돌아와 있다.',
], options:[{t:'…', go:'choi_talk'}]},
choi_t_past:{scene:'동행 · 최경철', text:G=>[
  '#최경철: 지웠냐고? 나는 지운 적 없소. 검열은 지우는 게 아니오. 고치는 거지. 문장 하나, 숫자 하나, 이름 하나. 맞게.',
  '#최경철: 98년에 함경북도 사망자 통계를 고쳤소. 원래 숫자에서 0을 하나 뺐지. 그 0 하나에 몇 명이 들어 있었는지는… 계산해 본 적 없소.',
  G.flags.pale_receded ? '#최경철: 문봉식이 말한 지붕에서 떨어진 사람들. 그 사람들도 내 0 안에 있었을 거요.' : '#최경철: 저 지도원의 아버지. 그분 정리 서류도 내가 고쳤소. 그녀는 모르오. 아직은.',
  '@volition: 그는 고백하고 있다. 네가 받아줄 수 있는 고백인지 생각해라. 너도 13국이다.',
], options:[{t:'…', go:'choi_talk', fx:{flag:'choi_confessed'}}]},
choi_t_yoon:{scene:'동행 · 최경철', text:G=>[
  '#최경철: 조직지도부. 저 사람들은 사람을 안 보오. 구조를 보지. 그래서 무섭고, 그래서 정확하오.',
  G.flags.choi_confessed ? '#최경철: 그녀 아버지 서류 얘기는… 언젠가 내가 직접 하겠소. 하얘지기 전에.' : '#최경철: 그래도 저 사람 단추 하나가 하얗더군. 구조도 하얘질 수 있다는 뜻이지.',
], options:[{t:'…', go:'choi_talk'}]},
choi_t_mun:{scene:'동행 · 최경철', text:[
  '#최경철: 돌아오겠지. 누가 이름을 불러준다면. 문제는 돌아온 다음이오. 1997년의 배급표를 든 사람에게 2020년대의 배급소가 뭘 줄 수 있소.',
  '#최경철: 창백이 물러나면 지워진 게 돌아오오. 좋은 일이지. 그런데 그 사람들이 다 돌아오면, 지운 사람들은 어떻게 되겠소. 나 같은.',
], options:[{t:'…', go:'choi_talk'}]},
choi_back:{scene:'동행 · 최경철', text:['최경철이 고개를 끄덕이고 다시 창밖을 본다.'], options:[
  {t:'돌아간다.', go:'d5_night', req:['d5_evening']},
  {t:'돌아간다.', go:'d5_hub', req:['in_samjiyon'], not:['d5_evening']},
  {t:'돌아간다.', go:'night4', req:['at_bocheon'], not:['in_samjiyon']},
  {t:'돌아간다.', go:'r4_village', req:['pale_receded'], not:['traveling','at_bocheon']},
  {t:'돌아간다.', go:'r4_rail', req:['pale_receded','traveling'], not:['at_bocheon']},
  {t:'돌아간다.', go:'e4_village', req:['pale_expanded'], not:['traveling','at_bocheon']},
  {t:'돌아간다.', go:'e4_road', req:['pale_expanded','traveling'], not:['at_bocheon']},
]},

// ================= 5일째: 삼지연 =================
d5_arrive:{scene:'삼지연 · 5일째 아침', on:{flag:'in_samjiyon'}, text:G=>[
  '— 5일째 —',
  G.flags.pale_receded ? '궤도차가 협궤의 마지막 레일 위에서 멈춘다. 삼지연역. 플랫폼에 눈이 쌓여 있다. 아니, 눈이 아니다.' :
  '지프가 마지막 구호와 함께 멈춘다. 확성기가 꺼지자 운전병이 숨을 몰아쉰다. 삼지연 읍 입구, 정리반 검문소.',
  '삼지연은 하얗다. 그런데 청수리의 하얀 것과 다르다. 이곳의 하얀 것은 먹지 않는다. 이미 다 먹고 남은 그릇처럼, 조용히 놓여 있다.',
  '읍 한가운데 거대한 기념비 광장. 동상이 서 있어야 할 자리에 받침대만 남았다. 받침대 위는 비어 있다. 그 둘레를 사람들이 원을 그리며 돌고 있다. 구호인지 해설인지 모를 소리가 쉬지 않고 들린다.',
  G.flags.pale_receded ? '#문봉식: 철길은 여기까지입니다. 나는 궤도차랑 역에 있겠습니다. 돌아갈 때 부르세요. 이름으로.' :
  '#윤해란: 저는 정리반 지휘소에 보고하러 갑니다. 동무는 오늘 하루 읍을 조사하세요. 밤에 지휘소로 오십시오.',
  G.flags.choi_with ? '최경철이 받침대를 올려다본다. "여기 있던 게 뭐였는지 기억나오, 소좌?" 너는 대답하지 못한다. 그도 마찬가지다.' : '',
], passives:[
  {s:'baekdu', dc:8, t:'봐. 이 나라에서 가장 많이 반복된 이야기가 태어난 곳이야. 창백은 여기서 이미 배불리 먹었어. 남은 건 이야기를 외우는 사람들뿐이지.'},
  {s:'logic', dc:12, t:'청수리에서 창백은 반복된 것부터 먹었다. 여기는 모든 것이 반복된 곳이다. 그렇다면 여기서 살아남은 것은 — 반복되지 않은 무언가다.'},
], options:[{t:'읍으로 들어간다.', go:'d5_hub'}]},
d5_hub:{scene:'삼지연 읍 · 갈림길', text:G=>[
  G.visited.d5_hub>1 ? '삼지연 읍. 기념비 광장의 소리가 바람을 타고 온다.' :
  '읍은 생각보다 사람이 많다. 저마다 다른 이유로 하얀 곳을 향해 온 무리들. 연구 장비를 실은 썰매, 붉은 넥타이를 맨 아이들, 총을 멘 포수, 기름통에 무언가를 태우는 군인들, 얼음판 위의 밀수꾼들.',
  G.flags.choi_with ? '최경철이 외투 깃을 세운다. "다들 뭔가를 지키거나 뭔가를 지우러 왔군."' : '',
], options:[
  {t:'기념비 광장 — 끝없이 외우는 사람들', go:'d5_plaza'},
  {t:'답사숙영소 — 붉은 넥타이의 아이들', go:'d5_pioneers'},
  {t:'삼지연 못가의 천막 — 측정 장비들', go:'d5_lab'},
  {t:'숲 가장자리의 모닥불 — 쑥 냄새', go:'d5_bear'},
  {t:'군 막사 — 기름통의 불', go:'d5_purge'},
  {t:'못 위 얼음판 — 썰매와 밧줄', go:'d5_caravan'},
  {t:'[동행] 최경철과 이야기한다.', go:'choi_talk', req:['choi_with']},
  {t:'[저녁] 하루를 마친다.', go:'d5_night', req:['met_chant','met_pioneers']},
]},

// ---------- 낭송대 ----------
d5_plaza:{scene:'삼지연 기념비 광장', on:{flag:'met_chant', rep:{chant:0}}, text:G=>[
  G.visited.d5_plaza>1 ? '광장. 원은 쉬지 않고 돈다.' :
  '마흔 명쯤이 빈 받침대 둘레를 돈다. 교대로, 쉬지 않고. 그들이 외우는 것은 혁명전적지 해설문이다. 한 글자도 틀리지 않게. 수십 년 동안 수만 번 반복된 문장.',
  G.visited.d5_plaza>1 ? '' : '원의 맨 앞에서 지시봉을 든 여자가 해설을 이끈다. 해설강사 김선희. 그녀의 목소리가 이따금 끊긴다. 문장 한가운데에서. 그리고 같은 자리를 맴돈다. "백두산 밀영은… 밀영은… 밀영은…"',
  '#김선희: …동무도 해설에 동참하시겠습니까? 해설이 멈추면 하얀 것이 들어옵니다. 우리는 사흘째 한 번도 멈추지 않았습니다.',
], passives:[
  {s:'logic', dc:10, t:'원 바깥은 오히려 덜 하얗다. 원 안쪽, 해설이 가장 많이 반복되는 받침대 주변이 가장 하얗다. 그들은 막고 있는 게 아니다. 먹이고 있다.'},
  {s:'empathy', dc:12, t:'김선희는 해설을 할 때만 눈이 살아 있다. 해설이 끊기는 순간, 그녀의 얼굴에는 아무도 없다.'},
], options:[
  {t:'김선희에게 해설 말고 그녀 자신에 대해 묻는다.', check:{s:'empathy', dc:10}, ok:'d5_kimsh_open', no:'d5_kimsh_loop', not:['kimsh_open']},
  {t:'"그 해설이 창백의 먹이입니다." 원을 멈추게 한다.', check:{s:'rhet', dc:12, red:true}, ok:'d5_chant_stop', no:'d5_chant_angry'},
  {t:'원에 끼어 한 바퀴 함께 외운다.', check:{s:'composure', dc:8}, ok:'d5_chant_join', no:'d5_chant_stumble', once:true},
  {t:'노텔로 김선희에게 드라마 한 장면을 보여준다.', go:'d5_kimsh_dvd', req:['item_notel','item_dvd','kimsh_open'], not:['kimsh_awake']},
  {t:'[낭송대 호감 1] 김선희가 품에서 무언가를 꺼낸다.', go:'d5_chant_r1', cond:G=>G.rep.chant>=1, once:true},
  {t:'[낭송대 호감 2] 해설 원고를 청한다.', go:'d5_chant_r2', cond:G=>G.rep.chant>=2, once:true},
  {t:'[낭송대 호감 3] 전적지 안쪽으로 들어갈 수 있는지 묻는다.', go:'d5_chant_r3', cond:G=>G.rep.chant>=3, once:true},
  {t:'갈림길로 돌아간다.', go:'d5_hub'},
]},
d5_kimsh_open:{scene:'삼지연 기념비 광장', on:{flag:['kimsh_open'], rep:{chant:1}}, text:[
  '너는 원 바깥에서 그녀를 기다린다. 교대 시간. 그녀가 지시봉을 내려놓는다. 너는 묻는다. 해설 말고, 당신은 누구냐고.',
  '#김선희: 저요? 저는… 혁명전적지 해설강사 김선희입니다. 1998년부터. 해설을 만 이천 번 넘게 했습니다.',
  '#김선희: 딸이 하나 있어요. 혜산에. 이름이… 이름이…',
  '그녀의 입술이 움직인다. 소리가 나지 않는다. 그녀는 다시 지시봉을 잡는다. "백두산 밀영은 1936년…" 그 문장은 한 글자도 틀리지 않는다.',
  '@empathy: 그녀는 해설 만 이천 번을 외우는 동안, 딸의 이름은 한 번도 크게 부르지 않았다.',
], options:[{t:'…', go:'d5_plaza'}]},
d5_kimsh_loop:{scene:'삼지연 기념비 광장', text:[
  '#김선희: 저에 대해서요? 해설강사는 해설로 말합니다. 백두산 밀영은… 밀영은… 밀영은…',
  '그녀의 문장이 같은 자리를 맴돈다. 너는 그녀를 그 고리 밖으로 꺼내지 못한다.',
], options:[{t:'물러난다.', go:'d5_plaza'}]},
d5_chant_stop:{scene:'삼지연 기념비 광장', on:{rep:{chant:-1, pioneers:1}, flag:'chant_doubt', sp:1}, text:[
  '너는 원 한가운데로 걸어 들어가 소리친다. 보위원의 목소리로. "멈추시오! 저 받침대를 보시오!"',
  '몇 사람이 멈춘다. 그리고 본다. 해설이 끊긴 순간, 받침대 주변의 하얀 것이 — 아주 조금 — 옅어진다.',
  '원이 흔들린다. 누군가 울기 시작한다. 김선희가 지시봉을 떨어뜨린다. 그리고 다시 줍는다. 그녀는 해설을 이어가지만, 목소리가 작아졌다.',
  '#김선희: …동무는 우리가 사흘 동안 한 일을 부정하는 겁니다. 그게 얼마나 무서운 일인지 아세요?',
], options:[{t:'…', go:'d5_plaza'}]},
d5_chant_angry:{scene:'삼지연 기념비 광장', on:{rep:{chant:-2}, morale:-1}, text:[
  '너는 소리치지만 마흔 명의 해설이 너를 덮는다. 사람들이 너를 원 밖으로 밀어낸다. 누군가 "반동"이라고 속삭인다.',
  '@composure: 이곳에서 해설을 끊으려는 자는 하얀 것보다 더 큰 적이다.',
], options:[{t:'물러난다.', go:'d5_plaza'}]},
d5_chant_join:{scene:'삼지연 기념비 광장', on:{rep:{chant:2, purge:1, bear:-1}, pale:1}, text:[
  '너는 원에 끼어 걷는다. 문장들이 입에서 저절로 나온다. 너도 이 해설을 안다. 이 나라 사람이라면 누구나 안다.',
  '한 바퀴를 돌고 원에서 빠져나왔을 때, 손끝이 차갑다. 장갑 속 손가락 하나가 하얘져 있다.',
  '#김선희: 잘하셨습니다, 동무. 한 글자도 틀리지 않으셨어요.',
], options:[{t:'손을 주머니에 넣는다.', go:'d5_plaza'}]},
d5_chant_stumble:{scene:'삼지연 기념비 광장', on:{rep:{chant:-1}}, text:[
  '너는 원에 끼지만 세 번째 문장에서 막힌다. 다음 단어가 하얗다. 사람들이 너를 피해 돈다.',
], options:[{t:'물러난다.', go:'d5_plaza'}]},
d5_kimsh_dvd:{scene:'삼지연 기념비 광장', on:{flag:'kimsh_awake', rep:{chant:-1}, name:'수향', morale:1}, text:[
  '교대 시간, 광장 구석. 너는 노텔을 펴서 그녀에게 보여준다. 처음에 그녀는 거부한다. 이건 반동 매체라고. 그러나 눈을 떼지 못한다.',
  '화면 속 엄마가 딸을 부른다. 이름으로. 몇 번이고. 김선희의 입술이 따라 움직인다. 그리고 —',
  '#김선희: …수향이. 우리 딸 이름은 수향이에요. 김수향.',
  '그녀가 울면서 웃는다. 원 쪽에서 누군가 그녀를 부른다. 해설강사 동지, 교대입니다. 그녀는 일어서지 않는다.',
  '@baekdu: 반복되지 않는 이야기 하나가, 만 이천 번 반복된 이야기를 이겼어.',
], options:[{t:'노텔을 접는다.', go:'d5_plaza'}]},
d5_chant_r1:{scene:'삼지연 기념비 광장', on:{item:'ttok'}, text:['#김선희: 해설하다 쓰러지지 말라고 나눠주는 겁니다. 강냉이떡. 동무도 하나 드세요.'], options:[{t:'받는다.', go:'d5_plaza'}]},
d5_chant_r2:{scene:'삼지연 기념비 광장', on:{item:'script'}, text:['#김선희: 제 해설 원고입니다. 저는 이제 안 봐도 외워요. 아니… 외우는 것 말고는 남은 게 없어요. 가져가세요.'], options:[{t:'받는다.', go:'d5_plaza'}]},
d5_chant_r3:{scene:'삼지연 기념비 광장', on:{item:'pass_site'}, text:['#김선희: 전적지 출입증이에요. 밀영 해설관 안쪽까지 들어갈 수 있어요. 거기는… 우리도 사흘째 못 들어갔지만요.'], options:[{t:'받는다.', go:'d5_plaza'}]},

// ---------- 철이와 소년단 ----------
d5_pioneers:{scene:'삼지연 답사숙영소', on:{flag:'met_pioneers', rep:{pioneers:0}}, text:G=>[
  G.visited.d5_pioneers>1 ? '숙영소. 아이들이 둘러앉아 있다.' :
  '답사숙영소의 큰방. 붉은 넥타이를 맨 아이들 서른 명 남짓이 둥글게 앉아 있다. 가운데 한 소년이 낡은 출석부를 들고 이름을 읽는다. 「김철.」 「예!」 「리은정.」 「예!」 이름이 불릴 때마다 아이 하나가 손을 든다.',
  G.visited.d5_pioneers>1 ? '' : '출석부를 든 소년이 너를 본다. 열두 살쯤. 볼이 텄고, 눈이 빨갛다. 밤새 잠을 못 잔 얼굴이다.',
  G.flags.heard_cheol && G.visited.d5_pioneers===1 ? '그 목소리다. 라디오로 들었던. 출석부를 읽던 목소리.' : '',
  '#리철: 보위원 동지세요? …선생님을 찾으러 오신 거예요?',
], options:[
  {t:'"네 목소리를 라디오로 들었다, 철아."', go:'d5_cheol_radio', req:['heard_cheol'], not:['cheol_trust']},
  {t:'"선생님이 어떻게 됐니?"', go:'d5_cheol_teacher', once:true},
  {t:'아이들과 함께 출석을 부른다.', check:{s:'empathy', dc:8}, ok:'d5_roll_ok', no:'d5_roll_shy', once:true},
  {t:'아이들에게 먹을 것을 나눠준다.', go:'d5_feed_kids', cond:G=>G.flags.item_potato||G.flags.item_canned||G.flags.item_ttok||G.flags.item_kongbap||G.flags.item_cn_can, once:true},
  {t:'노텔로 아이들에게 드라마를 보여준다.', go:'d5_kids_dvd', req:['item_notel','item_dvd'], once:true},
  {t:'청수리 인민반 명단을 철이에게 보여준다.', go:'d5_cheol_ledger', req:['item_ledger'], once:true},
  {t:'[소년단 호감 1] 아이들이 무언가를 내민다.', go:'d5_pio_r1', cond:G=>G.rep.pioneers>=1, once:true},
  {t:'[소년단 호감 2] 철이가 넥타이를 푼다.', go:'d5_pio_r2', cond:G=>G.rep.pioneers>=2, once:true},
  {t:'[소년단 호감 3] 출석부를 베껴달라고 부탁한다.', go:'d5_pio_r3', cond:G=>G.rep.pioneers>=3, once:true},
  {t:'갈림길로 돌아간다.', go:'d5_hub'},
]},
d5_cheol_radio:{scene:'삼지연 답사숙영소', on:{flag:'cheol_trust', rep:{pioneers:2}, name:'리철'}, text:[
  '소년의 눈이 커진다.',
  '#리철: 진짜요? 들렸어요? 숙영소 무전기로 밤새 했는데… 아무도 대답 안 해서, 다 하얘진 줄 알았어요.',
  '#리철: 선생님이 그랬어요. 길을 잃으면 서로 이름을 부르라고. 그래서 불렀어요. 서른두 명. 한 시간에 한 번씩. 한 명도 안 빠지게.',
  '아이들이 너를 둘러싼다. 누군가 네 소매를 잡는다.',
], options:[{t:'"잘했다. 정말 잘했다."', go:'d5_pioneers'}]},
d5_cheol_teacher:{scene:'삼지연 답사숙영소', on:{flag:'teacher_lost', name:'정순옥'}, text:[
  '#리철: 정순옥 선생님이요. 그저께 해설강사 선생님들이랑 밀영 해설관에 먼저 가셨어요. 우리는 내일 따라가기로 했고요. 그런데 그날 밤에 산 쪽이 하얘졌어요.',
  '#리철: 선생님은 안 돌아왔어요. 근데 선생님 이름은 매일 불러요. 출석부 맨 위에 적어놨거든요. 선생님도 우리 반이니까.',
  '@empathy: 이 아이는 선생님을 출석부에 넣었다. 반 아이들과 똑같이. 그게 그 아이가 아는 가장 강한 주문이다.',
], options:[{t:'…', go:'d5_pioneers'}]},
d5_roll_ok:{scene:'삼지연 답사숙영소', on:{rep:{pioneers:1}, name:['김철','리은정','박명호','최순옥','한경수']}, text:[
  '너는 아이들 사이에 앉는다. 철이가 출석부를 내민다. 네가 읽는다. 「김철.」 「예!」 「리은정.」 「예!」',
  '서른두 번째 이름까지 읽고 나서 철이가 덧붙인다. 「그리고 보위원 동지.」 아이들이 너를 본다. 너는 대답한다. 「예.」',
  '이름이 없는 너도, 이 방에서는 출석했다.',
], options:[{t:'…', go:'d5_pioneers'}]},
d5_roll_shy:{scene:'삼지연 답사숙영소', text:[
  '너는 출석부를 받지만, 아이들의 시선 앞에서 목이 막힌다. 13국 소좌가 아이들 이름을 읽어본 적이 있던가. 명단은 늘 다른 용도였다.',
  '철이가 조용히 출석부를 가져간다. "괜찮아요. 제가 할게요."',
], options:[{t:'…', go:'d5_pioneers'}]},
d5_feed_kids:{scene:'삼지연 답사숙영소', on:{rep:{pioneers:2}}, text:G=>[
  '너는 주머니를 턴다. 아이들이 서른 개로 쪼갠 음식을 나눠 먹는다. 아무도 먼저 먹지 않는다. 철이가 "다 같이"라고 할 때까지.',
  '@march: 1997년에도 이런 방이 있었다. 거기서는 아무도 기다리지 않았다.',
], options:[{t:'…', go:'d5_pioneers', fx:G=>G.flags.item_potato ? {unitem:'potato'} : G.flags.item_canned ? {unitem:'canned'} : G.flags.item_ttok ? {unitem:'ttok'} : G.flags.item_kongbap ? {unitem:'kongbap'} : {unitem:'cn_can'}}]},
d5_kids_dvd:{scene:'삼지연 답사숙영소', on:{rep:{pioneers:2, chant:-1, purge:-1}, morale:1}, text:[
  '작은 화면 앞에 서른 개의 머리가 모인다. 처음 보는 색. 처음 보는 거리. 처음 보는 어른들 — 서로를 다정하게 부르는.',
  '한 아이가 묻는다. "저 사람들은 왜 구호를 안 해요?" 다른 아이가 대답한다. "이름 부르느라 바빠서."',
  '방 안의 하얀 기운이 화면 빛이 닿는 데까지 물러난다. 아이들은 그걸 알아채지 못한다. 너만 본다.',
  '@volition: 13국 소좌가 소년단원들에게 남조선 드라마를 보여주고 있다. 이건 기록에 남으면 안 된다. …아니, 기록에 남아야 할지도 모른다.',
], options:[{t:'노텔을 접는다.', go:'d5_pioneers'}]},
d5_cheol_ledger:{scene:'삼지연 답사숙영소', on:{rep:{pioneers:1}, flag:'cheol_ledger'}, text:[
  '철이가 박순녀의 공책을 한 장씩 넘긴다. 하얘졌다가 다시 쓰인 세 집의 이름에서 손가락이 멈춘다.',
  '#리철: 이 사람들도 같이 불러줘도 돼요? 우리 반은 아니지만… 선생님이 그랬어요. 부를 수 있는 이름은 다 부르라고.',
], options:[{t:'"그래. 같이 불러다오."', go:'d5_pioneers'}]},
d5_pio_r1:{scene:'삼지연 답사숙영소', on:{item:'potato'}, text:['#리철: 아까 숙영소 아주머니가 쪄준 거예요. 하나 남았어요. 보위원 동지 드세요.'], options:[{t:'받는다.', go:'d5_pioneers'}]},
d5_pio_r2:{scene:'삼지연 답사숙영소', on:{item:'scarf'}, text:['#리철: 제 넥타이요. 안쪽에 우리 반 이름 다 써놨어요. 동지가 밀영에 가면, 우리도 같이 가는 거예요.'], options:[{t:'목에 맨다.', go:'d5_pioneers'}]},
d5_pio_r3:{scene:'삼지연 답사숙영소', on:{item:'roll_copy', name:['정순옥','김수정','오성철']}, text:['철이가 출석부를 한 장 한 장 베껴준다. 서른두 명과 선생님 한 명. 맨 아래에 철이가 적는다. 「보위원 동지 (이름은 나중에)」.'], options:[{t:'종이를 접어 품에 넣는다.', go:'d5_pioneers'}]},

// ---------- 창백 연구소 ----------
d5_lab:{scene:'삼지연 못가 · 연구소 천막', on:{flag:'met_lab', rep:{lab:0}}, text:G=>[
  G.visited.d5_lab>1 ? '연구소 천막. 계기들이 째깍거린다.' :
  '천막 안에 발전기, 계기판, 유리병 수십 개. 병마다 하얀 것이 담겨 있다. 안개도 아니고 액체도 아닌 것. 병에는 날짜와 장소가 적혀 있다. 「청수리 인근, 사흘 전」. 「보천, 어제」.',
  G.visited.d5_lab>1 ? '' : '안경을 쓴 마흔쯤의 남자가 병 하나를 불빛에 비춰보고 있다. 국가과학원 특별연구소 분소 연구사 허명진.',
  '#허명진: 보위원? 청수리에서 왔다고요? 그럼 동무가 그 보고서를 쓴… 앉으세요. 묻고 싶은 게 백 가지입니다.',
], passives:[
  {s:'eye', dc:10, t:'병 하나에 「1997년 함경북도 사망자 장부 — 소각분」이라고 적혀 있다. 그들은 창백만 담는 게 아니다. 창백이 먹은 것을 담고 있다.'},
], options:[
  {t:'"그 병들로 뭘 하려는 거요?"', go:'d5_lab_purpose', once:true},
  {t:'청수리의 관측 기록과 네가 본 것을 넘겨준다.', check:{s:'logic', dc:10}, ok:'d5_lab_data', no:'d5_lab_data_no', cond:G=>G.flags.log_truth||G.flags.report_truth||G.flags.names_resist, once:true},
  {t:'유리병 하나를 들여다본다.', check:{s:'baekdu', dc:12}, ok:'d5_lab_jar', no:'d5_lab_jar_no', once:true},
  {t:'단파 라디오를 연구소 안테나에 연결해본다.', go:'d5_lab_radio', req:['item_radio'], once:true},
  {t:'[연구소 호감 1] 보급품을 나눠달라고 한다.', go:'d5_lab_r1', cond:G=>G.rep.lab>=1, once:true},
  {t:'[연구소 호감 2] 측정기를 빌려달라고 한다.', go:'d5_lab_r2', cond:G=>G.rep.lab>=2, once:true},
  {t:'[연구소 호감 3] 방호 장비를 청한다.', go:'d5_lab_r3', cond:G=>G.rep.lab>=3, once:true},
  {t:'갈림길로 돌아간다.', go:'d5_hub'},
]},
d5_lab_purpose:{scene:'삼지연 못가 · 연구소 천막', on:{flag:'lab_purpose'}, text:G=>[
  '#허명진: 창백은 정보를 먹습니다. 반복되어 원본이 흐려진 정보부터. 우리는 그걸 "의미 밀도가 낮다"고 부르지요.',
  '#허명진: 그렇다면 반대로 생각해 보세요. 이걸 병에 담아 원하는 곳에 풀 수 있다면? 원하는 기록만, 원하는 이름만 지울 수 있다면?',
  '#허명진: 위에서는 그걸 원합니다. 저는… 저는 그냥 이게 뭔지 알고 싶을 뿐이고요. 둘 다 같은 실험이지만.',
  G.flags.choi_with ? '최경철이 병들을 본다. 하얀 손을 주머니에 넣는다. "검열이 필요 없는 세상이군." 그의 목소리가 이상하게 쓸쓸하다.' : '',
  '@volition: 지우는 무기. 평양이 "미제의 기상무기"라고 부른 바로 그것을, 평양이 만들려고 하고 있다.',
], options:[{t:'…', go:'d5_lab'}]},
d5_lab_data:{scene:'삼지연 못가 · 연구소 천막', on:{rep:{lab:2}, flag:'lab_data'}, text:[
  '너는 기록부의 숫자들, 구호부터 하얘진 순서, 이름 앞에서 멈추는 경계를 정리해 말한다. 허명진이 받아 적다가 펜을 멈춘다.',
  '#허명진: 이름 앞에서 멈춘다… 고유명사. 단 한 번 가리키는 기호. 그래서 출석부를 읽는 아이들 근처가 덜 하얬던 거군요.',
  '#허명진: 동무, 이건 논문감입니다. 논문을 낼 학술지가 남아 있다면.',
], options:[{t:'…', go:'d5_lab'}]},
d5_lab_data_no:{scene:'삼지연 못가 · 연구소 천막', text:['너는 설명하려 하지만 말이 정리되지 않는다. 허명진이 정중하게 고개를 끄덕인다. 그의 펜은 움직이지 않는다.'], options:[{t:'…', go:'d5_lab'}]},
d5_lab_jar:{scene:'삼지연 못가 · 연구소 천막', on:{pale:1, flag:'lab_jar', sp:1}, text:[
  '병 속의 하얀 것이 움직인다. 너는 들여다본다. 그리고 들린다. 아주 작게. 사람들의 목소리. 이름을 대는 목소리들. 「…함경북도 경성군… 리… 」 「…1997년 2월… 」',
  '사망자 장부에서 지워진 이름들이 병 안에서 아직 자기 이름을 말하고 있다. 아무도 듣지 않는데.',
  '@baekdu: 창백은 먹은 걸 소화하지 않아. 그냥 보관할 뿐이야. 언젠가 누가 불러주길 기다리면서.',
], options:[{t:'병을 내려놓는다. 손이 떨린다.', go:'d5_lab'}]},
d5_lab_jar_no:{scene:'삼지연 못가 · 연구소 천막', on:{morale:-1}, text:['병 속을 들여다보는 순간 머리가 하얘진다. 너는 네가 왜 여기 서 있는지 잠깐 잊는다. 허명진이 네 어깨를 잡는다. "오래 보면 안 됩니다."'], options:[{t:'…', go:'d5_lab'}]},
d5_lab_radio:{scene:'삼지연 못가 · 연구소 천막', on:{rep:{lab:1}, flag:'lab_radio'}, text:[
  '연구소 안테나에 라디오를 연결하자 잡음이 달라진다. 허명진이 계기판을 본다. 바늘이 춤춘다.',
  '#허명진: 창백이… 듣고 있어요. 동무 라디오 주파수에 반응합니다. 특히 그 아이 출석부 방송에. 이름이 나올 때마다 밀도가 떨어져요.',
  '#허명진: 이 라디오, 누가 개조했습니까? 대단한 솜씨입니다.',
  '"오창근. 청수리 관측원이었소. 1998년에 죽었소." 너는 그 이름을 처음으로 소리 내어 말한다.',
], options:[{t:'…', go:'d5_lab', fx:{name:'오창근'}}]},
d5_lab_r1:{scene:'삼지연 못가 · 연구소 천막', on:{item:['canned','canned']}, text:['#허명진: 연구소 보급 통조림입니다. 맛은 보장 못 합니다. 영양은 보장합니다. 아마도.'], options:[{t:'받는다.', go:'d5_lab'}]},
d5_lab_r2:{scene:'삼지연 못가 · 연구소 천막', on:{item:'meter'}, text:['#허명진: 휴대용 측정기. 바늘이 오른쪽으로 갈수록 의미 밀도가 낮다는 뜻입니다. 쉽게 말해 위험하다는 뜻이고요. 돌려주실 거죠?'], options:[{t:'받는다.', go:'d5_lab'}]},
d5_lab_r3:{scene:'삼지연 못가 · 연구소 천막', on:{item:'gloves'}, text:['#허명진: 방호 장갑입니다. 납을 섞었어요. 효과는… 손끝이 덜 하얘지는 정도. 그래도 없는 것보단 낫지요.'], options:[{t:'낀다.', go:'d5_lab'}]},

// ---------- 곰쫓사 ----------
d5_bear:{scene:'숲 가장자리 · 곰쫓사 야영지', on:{flag:'met_bear', rep:{bear:0}}, text:G=>[
  G.visited.d5_bear>1 ? '모닥불. 쑥 연기가 피어오른다.' :
  '숲 가장자리, 하얀 것이 시작되는 경계에 천막 두 동과 모닥불. 불에 쑥을 태우고 있다. 쓰고 맑은 냄새.',
  G.visited.d5_bear>1 ? '' : '모닥불 둘레에 세 사람. 둥근 철테 안경을 쓴 노인, 털모자를 쓴 포수, 노트를 무릎에 펼친 젊은 여자.',
  G.visited.d5_bear>1 ? '' : '#곽만석: 보위원이 여기까지 웬일이오. 우린 사냥 허가 받았소. 곰 사냥.',
  G.visited.d5_bear>1 ? '' : '#도학수: 사회과학원 력사연구소, 고조선 학술조사단 백두산 분조의 도학수요. 곰쫓사라고 부르시오. 다들 그렇게 부르니까.',
], passives:[
  {s:'history', dc:10, t:'도학수. 1993년 단군릉 발굴 보고서의 공동 서명자 명단에 있던 이름이다. 단군의 뼈를 찾았다고 발표한 그 보고서.'},
  {s:'eye', dc:12, t:'야영지 바로 앞, 하얀 눈밭에 발자국이 있다. 사람 손바닥 세 개만 한. 하얀 것 위에 찍혔는데 지워지지 않았다.'},
], options:[
  {t:'도학수에게 1993년의 단군릉에 대해 묻는다.', check:{s:'empathy', dc:10}, ok:'d5_do_confess', no:'d5_do_deny', once:true},
  {t:'포수에게 하얀 곰 이야기를 청한다.', go:'d5_kwak', once:true},
  {t:'젊은 연구원의 노트를 들여다본다.', go:'d5_seo', once:true},
  {t:'포수를 따라 발자국을 쫓는다.', check:{s:'eye', dc:10}, ok:'d5_track_ok', no:'d5_track_no', req:['met_kwak'], once:true},
  {t:'모닥불에 먹을 것을 내놓는다.', go:'d5_bear_food', cond:G=>G.flags.item_canned||G.flags.item_kongbap||G.flags.item_cn_can, once:true},
  {t:'[곰쫓사 호감 1] 쑥을 청한다.', go:'d5_bear_r1', cond:G=>G.rep.bear>=1, once:true},
  {t:'[곰쫓사 호감 2] 마늘을 청한다.', go:'d5_bear_r2', cond:G=>G.rep.bear>=2, once:true},
  {t:'[곰쫓사 호감 3] 곽만석이 목에 건 것을 본다.', go:'d5_bear_r3', cond:G=>G.rep.bear>=3, once:true},
  {t:'갈림길로 돌아간다.', go:'d5_hub'},
]},
d5_do_confess:{scene:'숲 가장자리 · 곰쫓사 야영지', on:{rep:{bear:2}, flag:'do_confessed', name:'도학수'}, text:G=>[
  '노인이 오래 불을 본다.',
  '#도학수: 1993년. 강동군에서 뼈가 나왔지. 위에서 단군의 뼈여야 한다고 했소. 그래서 연대를 맞췄소. 오천 년. 숫자 하나를 고치는 데 서명 하나면 됐지.',
  '#도학수: 그 뒤로 그 이야기가 이 나라에서 몇 번 반복됐을 것 같소? 교과서, 방송, 해설관, 기념비. 그래서 지금 하얘지고 있는 거요. 내가 만든 거짓말이 제일 먼저 먹히고 있소.',
  '#도학수: 진짜 동굴은 평양에 없소. 신화는 하늘에서 내려온 곳, 신단수 아래라고 했지. 백두산이오. 그리고 그 동굴에서 견딘 곰. 그 곰에게는 이름이 없었소. 이름 없는 건 창백이 못 먹소.',
  G.flags.choi_with ? '최경철이 낮게 웃는다. "숫자 하나. 서명 하나. 동지와 나는 같은 일을 했군."' : '',
], options:[{t:'…', go:'d5_bear'}]},
d5_do_deny:{scene:'숲 가장자리 · 곰쫓사 야영지', on:{rep:{bear:-1}}, text:['#도학수: 보위원이 그런 걸 묻는 건 대개 조서를 쓰려는 거지. 단군릉은 위대한 발굴이었소. 이상.'], options:[{t:'…', go:'d5_bear'}]},
d5_kwak:{scene:'숲 가장자리 · 곰쫓사 야영지', on:{flag:'met_kwak', name:'곽만석'}, text:[
  '#곽만석: 곽만석이오. 백두산에서 서른 해 사냥했소. 곰도 여럿 잡았지. 근데 이건 달라.',
  '#곽만석: 사흘 전에 봤소. 하얀 데 한가운데로 걸어가는 놈. 털이 하얀 거랑 똑같은 색이라 눈하고 발자국만 보이더군. 하얀 데가 그놈을 못 지워. 그놈이 지나가면 발자국이 남아.',
  '#곽만석: 저놈 가죽 한 장이면 평생 먹고살아. 교수 양반은 학문이니 뭐니 하지만, 나는 그거면 돼.',
], options:[{t:'…', go:'d5_bear'}]},
d5_seo:{scene:'숲 가장자리 · 곰쫓사 야영지', on:{flag:'met_seo', name:'서은하'}, text:[
  '#서은하: 서은하입니다. 생물학. 제 가설은 이래요. 신화 속 곰의 자손, 웅족은 우리랑 다른 종이에요. 사람처럼 보여도. 그리고 창백 속에서 살 수 있어요.',
  '#서은하: 증명하려면 표본이 필요해요. 그 곰이요. 연구소 장비만 있으면… 저 연구소 사람들은 우릴 미친 사람 취급하지만.',
  '@logic: 그녀는 곰쫓사와 연구소 사이에 서 있다. 곰을 찾는 방법은 곰쫓사에게, 곰을 담는 방법은 연구소에게 있다.',
], options:[{t:'…', go:'d5_bear'}]},
d5_track_ok:{scene:'하얀 눈밭 · 곰 발자국', on:{rep:{bear:1}, flag:'saw_bear_track', sp:1}, text:[
  '곽만석을 따라 하얀 경계 안으로 열 걸음. 스무 걸음. 소리가 사라진다. 그리고 발자국. 하얀 면 위에 선명하게 찍힌, 거대한 발자국이 산 쪽으로 이어진다.',
  '너는 발자국 하나에 손을 대본다. 따뜻하다. 하얀 것 한가운데에서, 무언가 살아 있는 것의 온기.',
  '#곽만석: 봤지? 지워지지 않아. 저 산 위, 밀영 쪽으로 가고 있소.',
  '@baekdu: 이름 없는 짐승. 창백보다 먼저 있었던 것. 아니면 창백이 끝내 먹지 못한 것.',
], options:[{t:'경계 밖으로 나온다.', go:'d5_bear'}]},
d5_track_no:{scene:'하얀 눈밭 · 곰 발자국', on:{pale:1, morale:-1}, text:['발자국을 쫓다가 눈앞이 하얘진다. 곽만석이 네 멱살을 잡아 끌어낸다. "하얀 데서 눈을 놓치면 끝이오."'], options:[{t:'…', go:'d5_bear'}]},
d5_bear_food:{scene:'숲 가장자리 · 곰쫓사 야영지', on:{rep:{bear:1}}, text:['너는 먹을 것을 모닥불 옆에 내놓는다. 곽만석이 처음으로 웃는다. "보위원이 먹을 걸 주네. 하얀 게 세상을 뒤집긴 했군."'], options:[{t:'…', go:'d5_bear', fx:G=>G.flags.item_canned ? {unitem:'canned'} : G.flags.item_kongbap ? {unitem:'kongbap'} : {unitem:'cn_can'}}]},
d5_bear_r1:{scene:'숲 가장자리 · 곰쫓사 야영지', on:{item:['ssuk','ssuk']}, text:['#도학수: 쑥이오. 동굴 앞에서 뜯었소. 하얀 데 들어가기 전에 씹으면 머리가 맑아지오. 신화가 괜히 쑥을 고른 게 아니오.'], options:[{t:'받는다.', go:'d5_bear'}]},
d5_bear_r2:{scene:'숲 가장자리 · 곰쫓사 야영지', on:{item:['garlic','garlic']}, text:['#서은하: 마늘이에요. 맵고 독해서 하얀 데서 정신을 붙잡아줘요. 제 가설로는 알리신이… 아니, 그냥 드세요.'], options:[{t:'받는다.', go:'d5_bear'}]},
d5_bear_r3:{scene:'숲 가장자리 · 곰쫓사 야영지', on:{item:'claw'}, text:['#곽만석: 곰 발톱이오. 내가 처음 잡은 놈 거. 부적이지. 하얀 데서 길 잃지 말라고. 보위원한테 줄 줄은 몰랐네.'], options:[{t:'목에 건다.', go:'d5_bear'}]},

// ---------- 정리반 ----------
d5_purge:{scene:'삼지연 · 정리반 지휘소', on:{flag:'met_purge', rep:{purge:0}}, text:G=>[
  G.visited.d5_purge>1 ? '정리반 지휘소. 기름통의 불은 꺼지지 않는다.' :
  '군 막사 앞에 기름통 여섯 개. 군인들이 서류 상자를 통째로 불에 붓는다. 출생 기록, 배급 장부, 답사단 명단. 연기가 하얗다. 연기가 올라간 하늘이 더 하얗다.',
  G.visited.d5_purge>1 ? '' : '#강동혁: 정리반장 강동혁 상좌다. 청수리 보위원이군. 보고서는 읽었다.',
  G.flags.met_yoon ? '윤해란이 막사 안에서 서류를 넘기다 너를 본다. 고개만 까딱한다.' : '',
  '#강동혁: 원칙은 간단하다. 기록이 없으면 일어나지 않은 일이다. 하얀 것을 본 자, 하얀 것에 대해 쓴 기록. 그것들을 정리하면 하얀 것도 근거를 잃는다.',
], passives:[
  {s:'logic', dc:10, t:'타는 서류에서 나는 연기가 하얗다. 그 연기가 닿은 곳이 하얘진다. 그들은 지우면서 먹이고 있다. 낭송대가 외우면서 먹이는 것처럼.'},
  {s:'history', dc:12, t:'강동혁. 2000년대 초 "정리" 작전의 지휘관 이름이다. 그가 지나간 군에서는 사망자 통계가 깨끗했다.'},
], options:[
  {t:'"청수리의 인민반 명단을 내놓으라고요?"', go:'d5_purge_ledger', req:['item_ledger'], not:['purge_ledger_done']},
  {t:'"곰쫓사의 도학수 교수를 찾는다고요?"', go:'d5_purge_do', req:['met_bear'], not:['purge_do_done']},
  {t:'타는 연기를 가리키며 따진다.', check:{s:'rhet', dc:12}, ok:'d5_purge_argue', no:'d5_purge_argue_no', once:true},
  {t:'[동행] 최경철이 강동혁과 마주친다.', go:'d5_purge_choi', req:['choi_with'], once:true},
  {t:'[정리반 호감 1] 군 보급을 청한다.', go:'d5_purge_r1', cond:G=>G.rep.purge>=1, once:true},
  {t:'[정리반 호감 2] 통행증을 청한다.', go:'d5_purge_r2', cond:G=>G.rep.purge>=2, once:true},
  {t:'[정리반 호감 3] 강동혁이 책상 위의 명단을 내민다.', go:'d5_purge_r3', cond:G=>G.rep.purge>=3, once:true},
  {t:'갈림길로 돌아간다.', go:'d5_hub'},
]},
d5_purge_ledger:{scene:'삼지연 · 정리반 지휘소', text:[
  '#강동혁: 그 공책. 하얘졌던 이름을 다시 써넣은 명단이라지. 그런 게 제일 위험하다. 지워진 걸 되살리는 문서. 불에 넣어라.',
], options:[
  {t:'명단을 기름통에 넣는다.', go:'d5_purge_burned', fx:{unitem:'ledger', flag:'purge_ledger_done', rep:{purge:2, pioneers:-1}}},
  {t:'"이건 보위성 증거물입니다. 13국으로 가져가야 합니다."', check:{s:'composure', dc:12}, ok:'d5_purge_keep', no:'d5_purge_keep_no'},
]},
d5_purge_burned:{scene:'삼지연 · 정리반 지휘소', on:{morale:-2, pale:1}, text:[
  '공책이 불에 들어간다. 박순녀의 글씨가 오그라든다. 리용남. 한복실. 문태식. 하얀 연기가 오른다.',
  '#강동혁: 잘했다. 이제 그 사람들은 이사 간 거다. 처음부터.',
  '@empathy: 박순녀가 "청수리를 불러달라"고 했지. 너는 대신 청수리를 태웠다.',
], options:[{t:'…', go:'d5_purge'}]},
d5_purge_keep:{scene:'삼지연 · 정리반 지휘소', on:{flag:'purge_ledger_done', rep:{purge:-1}}, text:['#강동혁: …13국 규정이라. 좋다. 대신 그 공책이 퍼지면 그건 동무 책임이다.', '공책은 네 품에 남는다.'], options:[{t:'…', go:'d5_purge'}]},
d5_purge_keep_no:{scene:'삼지연 · 정리반 지휘소', on:{flag:'purge_ledger_done', unitem:'ledger', rep:{purge:1, pioneers:-1}, morale:-1}, text:['네 목소리가 흔들린다. 강동혁이 손을 내민다. 공책을 가져가 직접 불에 넣는다. "규정은 내가 안다, 소좌."'], options:[{t:'…', go:'d5_purge'}]},
d5_purge_do:{scene:'삼지연 · 정리반 지휘소', text:[
  '#강동혁: 도학수. 1993년 단군릉 발굴의 실무자. 그 영감이 산에서 이상한 소리를 하고 다닌다. 진짜 동굴이니, 곰이니. 그런 소리가 하얀 것보다 위험하다. 어디 있나?',
], options:[
  {t:'숲 가장자리의 야영지를 알려준다.', go:'d5_purge_told', fx:{flag:['purge_do_done','told_do'], rep:{purge:2, bear:-3}}},
  {t:'"못 봤습니다." 표정을 지킨다.', check:{s:'composure', dc:10}, ok:'d5_purge_lie', no:'d5_purge_lie_no'},
]},
d5_purge_told:{scene:'삼지연 · 정리반 지휘소', text:['#강동혁: 협조에 감사한다. 오늘 밤에 "정리"하겠다.', '@volition: 너는 방금 한 노인의 이름을 불에 넣을 명단에 적었다. 너는 13국이다. 이건 네가 평생 해온 일이다. …정말 그것뿐인가?'], options:[{t:'…', go:'d5_purge'}]},
d5_purge_lie:{scene:'삼지연 · 정리반 지휘소', on:{flag:'purge_do_done', rep:{bear:1}}, text:['너는 아무것도 담지 않은 얼굴로 대답한다. 강동혁이 너를 오래 본다. "그래. 찾으면 알려라."'], options:[{t:'…', go:'d5_purge'}]},
d5_purge_lie_no:{scene:'삼지연 · 정리반 지휘소', on:{flag:['purge_do_done','purge_suspects'], rep:{purge:-2}}, text:['#강동혁: 보위원 눈이 숲 쪽으로 가더군. 고맙다. 직접 찾지.', '@composure: 들켰다. 오늘 밤 숲 가장자리에 불이 오를 것이다.'], options:[{t:'…', go:'d5_purge'}]},
d5_purge_argue:{scene:'삼지연 · 정리반 지휘소', on:{flag:'purge_doubt', rep:{purge:-1, lab:1}}, text:[
  '"저 연기를 보십시오. 서류가 타는 연기가 하얗고, 그 연기가 닿은 하늘이 더 하얘집니다. 상좌 동지는 지우면서 먹이고 있습니다."',
  '강동혁이 연기를 올려다본다. 오래. 군인 하나가 상자를 든 채 멈춰 선다.',
  '#강동혁: …계속 태워. 멈추면 기록이 남는다.',
  '@empathy: 그는 알아들었다. 그리고 멈출 수 없다. 멈추면 지금까지 태운 모든 것이 그의 것이 된다.',
], options:[{t:'…', go:'d5_purge'}]},

<script>
let G = null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function newGame(arch){
  G = {arch:arch.id, attrs:{...arch.attrs}, bought:{}, sp:2, hp:0, morale:0,
       node:null, flags:{}, visited:{}, checks:{}, used:{}, pale:0, ticks:0, day:1, dayTick:0, names:[], ws:0, rep:{},
       thoughts:{known:[], active:null, progress:0, done:[]}, log:[]};
  G.hp = maxHp(); G.morale = maxMorale();
  closeModal();
  $('log').innerHTML = '';
  sys(`— ${arch.name} —`);
  go('start');
}
const maxHp = () => G.attrs.fys + 2;
const maxMorale = () => G.attrs.psy + 2;

function thoughtBonus(k){
  let b = 0;
  for (const id of G.thoughts.done) b += THOUGHTS[id].bonus[k] || 0;
  return b;
}
// 가지고 있는 장비의 기술 보너스
function itemBonus(k){
  let b = 0;
  for (const [id, it] of Object.entries(ITEMS)) if (it.bonus && G.flags['item_'+id]) b += it.bonus[k] || 0;
  return b;
}
const level = k => Math.max(0, G.attrs[SKILLS[k].attr] + (G.bought[k]||0) + thoughtBonus(k) + itemBonus(k));

function chance(lvl, dc){
  let ok = 0;
  for (let a=1;a<=6;a++) for (let b=1;b<=6;b++){
    if (a===6&&b===6) ok++;
    else if (!(a===1&&b===1) && a+b+lvl >= dc) ok++;
  }
  return Math.round(ok/36*100);
}

// ---------- log ----------
function push(cls, html){ G.log.push([cls, html]); if (G.log.length>300) G.log.shift(); appendP(cls, html); }
function appendP(cls, html){ const p=document.createElement('p'); p.className=cls; p.innerHTML=html; $('log').appendChild(p); }
const sys = t => push('sys', esc(t));
function skillTag(k){ const s=SKILLS[k]; return `<b style="color:${ATTRS[s.attr].color}">${esc(s.name)}</b>`; }
function line(raw){
  if (!raw) return;
  let m;
  if ((m = raw.match(/^@(\w+):\s*(.*)$/))) push('voice', `${skillTag(m[1])} — ${esc(m[2])}`);
  else if ((m = raw.match(/^#([^:]+):\s*(.*)$/))) push('npc', `<b>${esc(m[1])}</b> — ${esc(m[2])}`);
  else push('narr', esc(raw));
}

// ---------- effects ----------
function apply(fx){
  if (typeof fx === 'function') fx = fx(G);
  if (!fx) return;
  const f = x => Array.isArray(x) ? x : [x];
  if (fx.flag) f(fx.flag).forEach(k => G.flags[k] = true);
  if (fx.unflag) f(fx.unflag).forEach(k => delete G.flags[k]);
  if (fx.hp){ G.hp = Math.min(maxHp(), G.hp + fx.hp); push('fx', fx.hp>0 ? `체력 +${fx.hp}` : `체력 ${fx.hp}`); }
  if (fx.morale){ G.morale = Math.min(maxMorale(), G.morale + fx.morale); push('fx', fx.morale>0 ? `사기 +${fx.morale}` : `사기 ${fx.morale}`); }
  if (fx.sp){ G.sp += fx.sp; push('fx', `기술 점수 +${fx.sp}`); }
  if (fx.pale){ G.pale = Math.max(0, G.pale + fx.pale); if (fx.pale<0) push('fx', '창백이 조금 물러난다.'); }
  if (fx.name) f(fx.name).forEach(nm => { if (!G.names.includes(nm)){ G.names.push(nm); push('fx', `이름을 기억했다: ${esc(nm)}`); } });
  if (fx.day){ G.day = fx.day; G.dayTick = G.ticks; G.flags['day'+fx.day] = true; }
  if (fx.ws) G.ws += fx.ws;    // 청수리의 창백 점수: 3일째 밤에 물러남(≥3)과 확장(<3)을 가른다
  // 소지품은 개수로 센다(item_<id> = 개수). 장비는 보통 하나뿐이다.
  if (fx.item) f(fx.item).forEach(k => { G.flags['item_'+k] = (+G.flags['item_'+k] || 0) + 1; push('fx', `소지품: ${esc(ITEMS[k].name)}`); });
  if (fx.unitem) f(fx.unitem).forEach(k => { const n = (+G.flags['item_'+k] || 0) - 1; if (n > 0) G.flags['item_'+k] = n; else delete G.flags['item_'+k]; });
  if (fx.rep) for (const [k, v] of Object.entries(fx.rep)){
    G.rep[k] = (G.rep[k] || 0) + v;
    if (v) push('fx', `${FACTIONS[k].name} 호감도 ${v > 0 ? '+' : ''}${v}`);
  }
  if (fx.thought && !G.thoughts.known.includes(fx.thought) && !G.thoughts.done.includes(fx.thought)){
    G.thoughts.known.push(fx.thought);
    push('fx', `새 사상: 「${THOUGHTS[fx.thought].name}」 — 사상함에서 내면화할 수 있다.`);
  }
}
function tick(){
  G.ticks++;
  const t = G.thoughts;
  if (t.active){
    t.progress++;
    if (t.progress >= THOUGHTS[t.active].time){
      const th = THOUGHTS[t.active];
      t.done.push(t.active); t.known = t.known.filter(x => x!==t.active);
      G.flags[th.flag] = true;
      push('voice', `<b style="color:var(--pale)">사상 내면화 완료: 「${esc(th.name)}」</b> — ${esc(th.a)}`);
      t.active = null; t.progress = 0;
    }
  }
}

// ---------- flow ----------
function go(id){
  const n = STORY[id];
  if (!n){ sys(`[오류: 노드 ${id} 없음]`); return; }
  G.node = id;
  G.visited[id] = (G.visited[id]||0) + 1;
  if (G.visited[id]===1) apply(n.on);
  const text = typeof n.text==='function' ? n.text(G) : n.text;
  text.forEach(line);
  (n.passives||[]).forEach(p => {
    if (level(p.s) + 6 >= p.dc) push('voice', `<span class="tag" style="color:${ATTRS[SKILLS[p.s].attr].color}">${esc(SKILLS[p.s].name)} ${DIFF[p.dc]}: 성공</span>${esc(p.t)}`);
  });
  if (!n.ending){
    if (G.hp <= 0) return go('dead_hp');
    if (G.morale <= 0) return go('dead_morale');
  }
  render();
}

function optState(n, o, i){
  const id = G.node + '#' + i;
  if (o.req && !o.req.every(f => G.flags[f])) return null;
  if (o.not && o.not.some(f => G.flags[f])) return null;
  if (o.cond && !o.cond(G)) return null;
  if (o.once && G.used[id]) return null;
  if (o.check){
    const c = G.checks[id];
    const lv = level(o.check.s);
    if (c && c.ok) return null;
    if (c && o.check.red) return null;
    if (c && lv <= c.lvl) return {id, locked:true, lv};
    return {id, lv};
  }
  return {id};
}

function render(){
  renderSide();
  const n = STORY[G.node], box = $('opts');
  box.innerHTML = '';
  if (n.ending){
    const b = document.createElement('button');
    b.textContent = '— 새 게임 —'; b.onclick = openStart; box.appendChild(b);
    scrollLog(); return;
  }
  let k = 0;
  n.options.forEach((o, i) => {
    const st = optState(n, o, i);
    if (!st) return;
    k++;
    const b = document.createElement('button');
    let pre = '';
    if (o.check){
      const s = SKILLS[o.check.s], col = ATTRS[s.attr].color;
      pre = `<span class="tag${o.check.red?' red':''}" style="color:${col}">${esc(s.name)} · ${DIFF[o.check.dc]} ${o.check.dc} · ${st.locked ? '잠김' : chance(st.lv, o.check.dc)+'%'}</span>`;
      if (st.locked) b.disabled = true, b.title = '이 기술의 레벨이 오르면 다시 시도할 수 있다.';
    }
    b.innerHTML = `<span class="n">${k}.</span>${pre}${esc(o.t)}`;
    b.onclick = () => choose(o, st);
    box.appendChild(b);
  });
  scrollLog();
}
function scrollLog(){ const l=$('log'); l.scrollTop = l.scrollHeight; }

function choose(o, st){
  push('you', '— ' + esc(o.t));
  G.used[st.id] = true;
  tick();
  apply(o.fx);
  if (o.check){
    const a = 1+Math.floor(Math.random()*6), b = 1+Math.floor(Math.random()*6);
    const lv = level(o.check.s);
    const ok = (a===6&&b===6) || (!(a===1&&b===1) && a+b+lv >= o.check.dc);
    G.checks[st.id] = {ok, lvl:lv};
    const crit = a===6&&b===6 ? ' (결정적 성공)' : a===1&&b===1 ? ' (결정적 실패)' : '';
    push('roll ' + (ok?'ok':'no'), `${skillTag(o.check.s)} [${a}+${b}+${lv} = ${a+b+lv} / ${o.check.dc}] <b>${ok?'성공':'실패'}${crit}</b>`);
    go(ok ? o.ok : o.no);
  } else go(o.go);
}

// ---------- side panel ----------
function pips(el, cur, max, cls){ el.innerHTML = Array.from({length:max}, (_,i)=>`<span class="pip ${cls} ${i<cur?'on':''}"></span>`).join(''); }
function renderSide(){
  const n = STORY[G.node];
  $('scene').textContent = n.scene;
  const m = Math.min(23*60+50, 6*60+40 + (G.ticks-G.dayTick)*10), h = Math.floor(m/60), mm = m%60;
  $('clock').textContent = `${G.day}일째 · ${String(h).padStart(2,'0')}:${String(mm).padStart(2,'0')} · 주체 ??년`;
  pips($('hp'), G.hp, maxHp(), 'hp');
  pips($('mo'), G.morale, maxMorale(), 'mo');
  const p = ['희미함','번짐','침식','잠식','백색'][Math.min(4, Math.floor(G.pale/2))];
  $('paleMeter').innerHTML = `창백 노출: <b>${p}</b><br>기억한 이름: <b>${G.names.length}</b>`;
  $('spBadge').textContent = G.sp ? `(+${G.sp})` : '';
  $('thBadge').textContent = G.thoughts.active ? '(내면화 중)' : G.thoughts.known.length ? `(${G.thoughts.known.length})` : '';
}

// ---------- modals ----------
function openModal(html){ $('card').innerHTML = html; $('modal').classList.add('show'); }
function closeModal(){ $('modal').classList.remove('show'); }
const closeBtn = () => G ? `<button class="close" data-act="close">닫기</button>` : '';

function openStart(){
  openModal(`${closeBtn()}<h2>창백한 청수리</h2>
  <p style="color:var(--dim);font-size:15px">량강도 백수군 청수리. 압록강 너머가 사라졌다. 평양은 그것을 "미제의 기상무기"라 부른다. 당신은 조사를 위해 파견된 국가보위성 소좌다. 그리고 당신의 이름이 지워지고 있다.</p>
  <h3>출신을 고르시오</h3>
  <div class="arch">${ARCHETYPES.map((a,i)=>`<button data-act="new" data-arg="${i}"><b>${a.name}</b>
    <small>${a.desc}</small>
    <small>${Object.entries(a.attrs).map(([k,v])=>`<span style="color:${ATTRS[k].color}">${ATTRS[k].name} ${v}</span>`).join(' · ')}</small></button>`).join('')}</div>
  <p style="color:var(--dim);font-size:13px;margin-top:16px">판정: 2d6 + 기술 레벨 ≥ 난이도. 흰 판정은 기술이 오르면 재시도 가능, 붉은 판정은 단 한 번.</p>`);
}

function openSheet(){
  if (!G) return;
  const rows = a => Object.entries(SKILLS).filter(([,s])=>s.attr===a).map(([k,s])=>{
    const b = G.bought[k]||0, tb = thoughtBonus(k), can = G.sp>0 && b < G.attrs[a];
    return `<div class="sk"><span>${esc(s.name)} <b>${level(k)}</b>${tb?` <small style="display:inline">(${tb>0?'+':''}${tb} 사상)</small>`:''}<small>${esc(s.desc)}</small></span>
      ${can?`<button data-act="buy" data-arg="${k}">+</button>`:''}</div>`;
  }).join('');
  openModal(`${closeBtn()}<h2>보위원 소좌 [이름 없음]</h2>
    <p style="color:var(--dim);font-size:14px">기술 점수: ${G.sp} · 각 기술은 속성 값만큼 추가로 올릴 수 있다.</p>
    ${G.names.length ? `<p style="font-size:14px">수첩 — 기억한 이름: ${G.names.map(esc).join(' · ')}</p>` : ''}
    ${sheetExtras().map(([h, body]) => `<h3>${h}</h3>${body}`).join('')}
    <div class="grid">${Object.entries(ATTRS).map(([a,A])=>`<div><h3 style="color:${A.color}">${A.name} ${G.attrs[a]}</h3>${rows(a)}</div>`).join('')}</div>`);
}
// 인물 화면의 추가 칸: 소지품 · 동행 · 창백 상황
function sheetExtras(){
  const out = [];
  const items = Object.keys(ITEMS).filter(k => G.flags['item_'+k]);
  const effect = it => it.use ? Object.entries(it.use).map(([k, v]) => `${{hp:'체력', morale:'사기', pale:'창백 노출'}[k]} ${v > 0 ? '+' : ''}${v}`).join(', ')
    : it.bonus ? Object.entries(it.bonus).map(([k, v]) => `${SKILLS[k].name} +${v}`).join(', ') : '';
  if (items.length) out.push(['소지품', items.map(k => { const it = ITEMS[k], n = +G.flags['item_'+k];
    return `<div class="sk"><span>${esc(it.name)}${n > 1 ? ` ×${n}` : ''}<small>${esc(it.desc)}${effect(it) ? ` · ${effect(it)}` : ''}</small></span>${it.use ? `<button data-act="use" data-arg="${k}">먹는다</button>` : ''}</div>`; }).join('')]);
  const reps = Object.keys(FACTIONS).filter(k => k in G.rep);
  if (reps.length) out.push(['세력 호감도', reps.map(k => `<div class="sk"><span>${esc(FACTIONS[k].name)} <b>${G.rep[k]}</b><small>${esc(FACTIONS[k].desc)}</small></span></div>`).join('')]);
  const comp = [];
  if (G.flags.choi_with) comp.push('최경철 — 검열국 중좌');
  if (G.flags.met_mun && G.flags.pale_receded) comp.push('문봉식 — 협궤 운전수');
  if (G.flags.met_yoon && G.flags.pale_expanded) comp.push('윤해란 — 중앙당 지도원');
  if (comp.length) out.push(['동행', comp.map(c => `<div class="sk"><span>${esc(c)}</span></div>`).join('')]);
  if (G.flags.report_done) out.push(['창백 상황', `<div class="sk"><span>청수리: ${G.ws >= 3 ? '물러남' : '확장'}</span></div>`]);
  return out;
}
function useItem(k){
  const it = ITEMS[k];
  if (!it || !it.use || !G.flags['item_'+k]) return;
  push('you', `— ${esc(it.name)}을(를) 먹는다.`);
  apply({unitem:k});
  apply(it.use);
  openSheet(); render();
}
function buy(k){ if (G.sp<=0) return; G.sp--; G.bought[k]=(G.bought[k]||0)+1; push('fx', `${SKILLS[k].name} → ${level(k)}`); openSheet(); render(); }

function openThoughts(){
  if (!G) return;
  const t = G.thoughts;
  const bon = th => Object.entries(th.bonus).map(([k,v])=>`${SKILLS[k].name} ${v>0?'+':''}${v}`).join(', ');
  const card = (id, state) => { const th = THOUGHTS[id]; return `<div class="thought"><b>「${esc(th.name)}」</b><br>
    <small>${esc(state==='done'?th.a:th.q)}</small><br><small>효과: ${bon(th)} · 내면화 ${th.time}턴</small><br>
    ${state==='known' && !t.active ? `<button class="close" style="float:none;margin-top:6px" data-act="internalize" data-arg="${id}">내면화한다</button>`:''}
    ${state==='active' ? `<small style="color:var(--pale)">내면화 중… ${t.progress}/${th.time}</small>`:''}</div>`; };
  openModal(`${closeBtn()}<h2>사상함</h2>
    <p style="color:var(--dim);font-size:14px">생각을 품고 있으면 선택을 할 때마다 내면화가 진행된다. 한 번에 하나만.</p>
    ${t.active?card(t.active,'active'):''}
    ${t.known.filter(x=>x!==t.active).map(x=>card(x,'known')).join('')}
    ${t.done.length?'<h3>내면화된 사상</h3>'+t.done.map(x=>card(x,'done')).join(''):''}
    ${!t.active && !t.known.length && !t.done.length ? '<p>아직 품은 사상이 없다. 생각은 위험한 곳에서 온다.</p>':''}`);
}
function internalize(id){ G.thoughts.active=id; G.thoughts.progress=0; push('fx', `「${THOUGHTS[id].name}」을(를) 품기 시작한다.`); openThoughts(); renderSide(); }

// ---------- save ----------
function saveGame(){
  if (!G) return;
  try { localStorage.setItem('pale_chungsu_save', JSON.stringify(G)); sys('— 저장됨 —'); }
  catch(e){ sys('— 저장 실패: 브라우저 저장소를 쓸 수 없음 —'); }
}
function loadGame(){
  let s = null;
  try { s = localStorage.getItem('pale_chungsu_save'); } catch(e){}
  if (!s){ if (G) sys('— 저장된 게임 없음 —'); return; }
  G = Object.assign({day:1, dayTick:0, names:[], ws:0, rep:{}}, JSON.parse(s));
  closeModal();
  $('log').innerHTML = '';
  G.log.forEach(([c,h]) => appendP(c,h));
  sys('— 불러옴 —');
  render();
}

const ACTIONS = {
  sheet:openSheet, thoughts:openThoughts, save:saveGame, load:loadGame, start:openStart, close:closeModal,
  new:i => newGame(ARCHETYPES[+i]), buy, internalize, use:useItem,
};
// 인라인 onclick 대신 위임: 미리보기 뷰어의 CSP가 인라인 핸들러를 막아도 동작한다.
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el){ ACTIONS[el.dataset.act](el.dataset.arg); return; }
  if (e.target.id==='modal' && G) closeModal();
});
document.addEventListener('keydown', e => {
  if ($('modal').classList.contains('show')) { if (e.key==='Escape' && G) closeModal(); return; }
  const n = parseInt(e.key, 10);
  if (n>=1 && n<=9){ const b = $('opts').querySelectorAll('button')[n-1]; if (b && !b.disabled) b.click(); }
});
openStart();
</script>
</body>
</html>
